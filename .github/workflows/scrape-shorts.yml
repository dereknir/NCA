name: Daily shorts refresh

# 03:00 Taipei = 19:00 UTC (前一天)
# workflow_dispatch 允許在 Actions 頁手動 (或 gh CLI) 觸發
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 明確 checkout develop, 不管觸發時的分支是什麼 (Vercel + annotator 都讀 develop)
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install yt-dlp rapidfuzz

      - name: Scrape (yt-dlp)
        run: |
          mkdir -p data
          python -m yt_dlp \
            --flat-playlist --dump-json \
            "https://www.youtube.com/@nishina__official/shorts" \
            > data/nishina_shorts_raw.jsonl

      - name: Clean → nishina_shorts.json
        run: python scripts/clean_shorts.py

      - name: Classify (hashtag + fuzzy)
        run: python scripts/classify_shorts.py

      - name: Copy raw jsonl into annotation/ (build_annotation_queue.py 讀那裡)
        run: cp data/nishina_shorts_raw.jsonl annotation/nishina_shorts_raw.jsonl

      - name: Build annotation queue
        working-directory: annotation
        run: python build_annotation_queue.py

      - name: Sync queue → /annotate/ public path
        run: cp annotation/annotation_queue.json public/annotate/annotation_queue.json

      - name: Export lyrics.json (md → data/lyrics.json)
        run: python scripts/export_lyrics_json.py

      - name: Sync lyrics.json → /annotate/ (so 新歌自動出現在下拉)
        run: cp data/lyrics.json public/annotate/lyrics.json

      - name: Diff report → recent_new_shorts.json
        run: python scripts/build_recent_new.py

      - name: Rebuild gacha LIVE pool from shorts_anchors.json
        run: python scripts/build_gacha_live_pool.py

      - name: Rebuild shorts_by_song.json + shorts_extras.json from anchors
        run: python scripts/import_anchors.py

      - name: Refresh setlists from Linkfire hub (each Spotify playlist)
        run: python scripts/scrape_setlists.py
        continue-on-error: true    # Spotify embed 若暫時掛掉不阻塞其他步驟

      - name: Sync setlists.json → /annotate/ (讓 annotator 巡演 dropdown 跟上新場)
        run: cp src/data/setlists.json public/annotate/setlists.json
        continue-on-error: true    # 上一步 continue-on-error 若沒生檔, 這步跳過

      # ---- 哨兵 (每日 1 GET each; 失敗不阻塞其他, 結果進日報) ----
      - name: Sentinel — eplus 現售場次 (JSON-LD)
        continue-on-error: true
        run: python live/watch-eplus.py > "$RUNNER_TEMP/eplus_report.txt" 2>&1 || true

      - name: Sentinel — 官方 news RSS (自動分類入庫)
        continue-on-error: true
        run: |
          REPORT_PATH="$RUNNER_TEMP/news_report.txt" python scripts/news_sentinel.py || true
          [ -f "$RUNNER_TEMP/news_report.txt" ] || echo "[news] ⚠ 哨兵執行失敗 (網路/解析), 見 workflow log" > "$RUNNER_TEMP/news_report.txt"

      - name: Rebuild live 三頁 (news 有新條目時跟著更新; 冪等)
        run: python live/inject.py

      - name: Commit + push if changed
        id: commit
        run: |
          NEW_COUNT=$(python -c "import json; print(json.load(open('annotation/recent_new_shorts.json'))['count'])")
          echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "committed=no" >> $GITHUB_OUTPUT
            echo "→ nothing to commit"
          else
            git commit -m "chore(shorts): daily refresh (+${NEW_COUNT} new)"
            # 明確 push 到 develop (Vercel + annotator 讀那)
            git push origin HEAD:develop
            echo "committed=yes" >> $GITHUB_OUTPUT
          fi

      # ---- 日報 (整合 shorts + news + eplus 當天收穫; 無碎碎念) ----
      - name: Build daily digest
        id: digest
        if: success()
        run: |
          python - << 'PYEOF'
          import json, os, re
          tmp = os.environ['RUNNER_TEMP']
          lines = []
          d = json.load(open('annotation/recent_new_shorts.json', encoding='utf-8'))
          if d['count']:
              lines.append(f"[shorts] 新增 {d['count']} 支:")
              for it in d['items'][:10]:
                  t = it['title'].split('#')[0].strip() or it['title'][:40]
                  lines.append(f"  ・{t} ({it['viewCount']:,} views)")
              if d['count'] > 10:
                  lines.append(f"  …其餘 {d['count']-10} 支")
          else:
              lines.append('[shorts] 無新增')
          reports = {}
          for key in ['news', 'eplus']:
              p = os.path.join(tmp, f'{key}_report.txt')
              reports[key] = open(p, encoding='utf-8').read().strip() if os.path.exists(p) \
                             else f'[{key}] ⚠ 無報告 (步驟未執行?)'
              lines.append('')
              lines.append(reports[key])
          open(os.path.join(tmp, 'digest.txt'), 'w', encoding='utf-8').write('\n'.join(lines) + '\n')
          # subject 摘要: shorts +N · news +M · eplus ★K/-
          def num(text, pat, zero):
              m = re.search(pat, text)
              return m.group(1) if m else zero
          news_n = num(reports['news'], r'新增 (\d+) 條', '0')
          ep_n = num(reports['eplus'], r'新場次 (\d+) 筆', '0')
          summary = f"shorts +{d['count']} · news +{news_n} · eplus " + (f"★{ep_n} 新場次" if ep_n != '0' else '無新')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'summary={summary}\n')
          PYEOF

      # 電郵通知 (secrets 未設時 step 失敗但不阻塞 job)
      - name: Email — 日報
        if: success()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "✓ NCA 日報 — ${{ steps.digest.outputs.summary }}"
          to: dereknir6409@gmail.com
          from: NCA Bot <${{ secrets.GMAIL_USER }}>
          body: file://${{ runner.temp }}/digest.txt

      - name: Email — failure
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "✗ NCA shorts refresh FAILED"
          to: dereknir6409@gmail.com
          from: NCA Bot <${{ secrets.GMAIL_USER }}>
          body: |
            NCA 每日 shorts 刷新失敗。

            檢視完整 log:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            常見原因:
            - YouTube 改東西 → yt-dlp 需要更新 (pip 會自動抓最新版)
            - 短暫 rate-limit / 網路波動 (通常隔天自動好)
            - 腳本 bug (查 run log)
