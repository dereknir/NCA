<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>にしな公演史</title>
<style>
  :root{--bg:#0a0a15;--panel:#141d31;--line:#243154;--text:#e8ecf6;--dim:#8b97b8;
        --accent:#3d63ff;--gold:#e8c94a;--font:"Noto Sans TC","Hiragino Sans",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.7}
  .site-topbar{position:sticky;top:0;z-index:50;height:57px;background:rgba(10,10,21,0.75);
        backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .site-topbar-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:100%;
        display:flex;align-items:center;gap:14px}
  .site-topbar a{color:var(--text);font-size:20px;font-weight:700;text-decoration:none;transition:color .15s}
  .site-topbar a:hover{color:var(--accent)}
  .site-topbar a.crumb{color:var(--dim);font-size:13px;font-weight:400}
  main{max-width:760px;margin:0 auto;padding:48px 22px 120px}
  h1{font-size:30px;letter-spacing:.08em}
  .sub{color:var(--dim);font-size:13px;margin-top:6px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:20px 22px;margin-top:20px;position:relative}
  .num{position:absolute;top:16px;right:20px;font-size:26px;color:#2a3a63;
       font-variant-numeric:tabular-nums;letter-spacing:.05em}
  .name{font-size:18px;padding-right:64px}
  .period{color:var(--gold);font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
  .period.todo{color:var(--dim);font-style:italic}
  .stops{color:var(--dim);font-size:12px;margin-top:8px;line-height:1.8;cursor:pointer}
  .stops b{color:var(--text);font-weight:600}
  .stops:hover b{color:var(--gold)}
  .stopsdetail{display:none;margin-top:8px;border-top:1px solid rgba(36,49,84,.6);padding-top:8px}
  .card.expanded .stopsdetail{display:block}
  .stoprow{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12.5px}
  .stoprow .sd{color:var(--dim);font-variant-numeric:tabular-nums;width:84px;flex:none}
  .stoprow .sp a{color:var(--accent);text-decoration:none}
  .stx{width:26px;height:26px;flex:none;border:1.5px dashed var(--line);border-radius:6px;
       background:transparent;color:transparent;font-size:11px;cursor:pointer;font-family:inherit}
  .stx:hover{border-color:#d65555;color:rgba(214,85,85,.55)}
  .stx.on{border:2px solid #d65555;border-radius:7px;color:#d65555;font-weight:700;
       transform:rotate(-9deg);box-shadow:inset 0 0 4px rgba(214,85,85,.35)}
  .card.hl{outline:2px solid var(--gold);outline-offset:2px}
  .slwrap{position:relative;display:inline-block}
  .slmenu{position:absolute;bottom:calc(100% + 8px);left:0;background:var(--panel);
        border:1px solid var(--gold);border-radius:12px;padding:8px;display:none;
        flex-direction:column;gap:4px;z-index:10;min-width:170px;
        box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .slmenu.open{display:flex}
  .slmenu a{font-size:12.5px;color:var(--text);text-decoration:none;padding:7px 12px;
        border-radius:8px;border:none!important}
  .slmenu a:hover{background:var(--panel-2, #1a2440);color:var(--gold)}
  .links{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .links a{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:4px 12px;
        color:var(--dim);text-decoration:none}
  .links a:hover{border-color:var(--accent);color:var(--accent)}
  .links a.setlist{border-color:var(--gold);color:var(--gold)}
  .links a.setlist.todo{opacity:.4;pointer-events:none}
  .stamp{display:none;position:absolute;right:64px;top:12px;transform:rotate(-11deg);
        border:2.5px solid #d65555;color:#d65555;border-radius:9px;padding:5px 12px;
        font-size:14px;letter-spacing:.25em;opacity:.9;pointer-events:none}
  .stamp small{display:block;font-size:9px;letter-spacing:.05em;text-align:center;margin-top:1px}
  .card.stamped .stamp{display:block}
  .stbtn{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:4px 12px;
        color:var(--dim);background:transparent;cursor:pointer;font-family:inherit}
  .stbtn:hover{border-color:#d65555;color:#d65555}
  .card.stamped .stbtn{border-color:#d65555;color:#d65555}
  #att{color:var(--dim);font-size:13px;margin-top:14px}
  #att b{color:#d65555}
  footer{margin-top:70px;color:#5a6784;font-size:11.5px;text-align:center}
</style>
</head>
<body>
<header class="site-topbar">
  <div class="site-topbar-inner">
    <a href="/">Derek's Site</a>
    <a class="crumb" href="/live/">/ Live 演出</a>
  </div>
</header>
<main>
  <h1>にしな公演史</h1>
  <p class="sub">個人公演全 10 場・2021「hatsu」→ 2026「日々散漫」</p>
  <div id="att"></div>
  <div id="list"></div>
  <footer>news 連結指向官方・SETLIST 連結由站長自 lnk.to 各場短連結填入</footer>
</main>
<script>
const DATA = /*__DATA__*/null;
/* 站上路徑(injection 產物掛在 public/live/ 底下) */
const ROUTES = { timeline: '/live/timeline/', footprint: '/live/footprint/' };
/* 各場 setlist 歌單(lnk.to 浮層收割;順序對齊 DATA.oneman;null=尚未收割) */
const SETLISTS = /*__SETLISTS__*/null;
/* TODO(站長): 各場 setlist 短連結(lnk.to),key = 場次序號 1-10 */
const SETLIST_URLS = {
  // 5: 'https://nishina.lnk.to/CBJ_setlist',   // 例:クランベリー巡演
};
/* 參戰蓋章(存於本機瀏覽器) */
const LS = 'nishina-visited';
let visited = {};
try { visited = JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) {}
const saveV = () => { try { localStorage.setItem(LS, JSON.stringify(visited)); } catch (e) {} };
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const list = document.getElementById('list');
function tourStamped(ev, i) {
  return visited['oneman:' + (i + 1)] ||
    (ev.stops || []).some(st => visited['stop:' + ev.tid + ':' + st.date]);
}
function updateAtt() {
  const n = DATA.oneman.filter((ev, i) => tourStamped(ev, i)).length;
  document.getElementById('att').innerHTML =
    n ? `你的參戰:<b>${n}</b> / 10 場公演` : '參戰過的公演,按「参戦」蓋個章吧(僅存於你的瀏覽器)';
}
DATA.oneman.forEach((ev, idx) => {
  const n = idx + 1;
  const key = 'oneman:' + n;
  const card = document.createElement('div');
  card.id = 'c' + n;
  card.className = 'card' + (visited[key] ? ' stamped' : '');
  const todo = ev.note ? ' todo' : '';
  const svc = SETLISTS && SETLISTS[idx];
  card.innerHTML = `
    <div class="num">${String(n).padStart(2, '0')}</div>
    <div class="name">${esc(ev.name)}</div>
    <div class="period${todo}">${esc(ev.period)}${ev.note ? '(' + esc(ev.note) + ')' : ''}</div>
    ${ev.stops?.length ? `<div class="stops" data-tg><b>${ev.stops.length} 站</b>:${esc([...new Set(ev.stops.map(s => s.pref))].join('・'))} ▾</div>
    <div class="stopsdetail">${ev.stops.map(st => `
      <div class="stoprow">
        <button class="stx${(visited['stop:' + ev.tid + ':' + st.date] || visited[key]) ? ' on' : ''}"
                data-stop="stop:${ev.tid}:${st.date}">参</button>
        <span class="sd">${esc(st.date.slice(2))}</span>
        <span class="sp">${ROUTES.footprint
          ? `<a href="${ROUTES.footprint}?pref=${encodeURIComponent(st.pref)}">${esc(st.pref)}</a>`
          : esc(st.pref)}</span>
        <span>${esc(st.venue)}</span>
      </div>`).join('')}</div>` : ''}
    <div class="links">
      ${ev.news.map(nw => `<a href="${esc(nw.url)}" target="_blank" rel="noopener">news: ${esc(nw.title.slice(0, 18))}…</a>`).join('')}
      ${svc && Object.keys(svc).length
        ? `<span class="slwrap"><a class="setlist" href="#" data-sl>♪ SETLIST</a>
             <span class="slmenu">${Object.entries(svc).map(([label, url]) =>
               `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`).join('')}</span></span>`
        : `<a class="setlist" href="https://nishina.lnk.to/live_setlist" target="_blank" rel="noopener">♪ SETLIST</a>`}
      <button class="stbtn"></button>
    </div>
    <div class="stamp">参戦<small></small></div>`;
  const btn = card.querySelector('.stbtn'), st = card.querySelector('.stamp small');
  const paint = () => {
    const v = visited[key];
    card.classList.toggle('stamped', !!v);
    btn.textContent = v ? '取消蓋章' : '参戦した!';
    if (v) st.textContent = new Date(v).toISOString().slice(0, 10);
  };
  btn.onclick = () => {
    if (visited[key]) delete visited[key]; else visited[key] = Date.now();
    saveV(); paint(); updateAtt();
  };
  paint();
  const tg = card.querySelector('[data-tg]');
  if (tg) tg.onclick = () => card.classList.toggle('expanded');
  card.querySelectorAll('[data-stop]').forEach(b => b.onclick = () => {
    const k = b.dataset.stop;
    if (visited[k]) delete visited[k]; else visited[k] = Date.now();
    saveV();
    b.classList.toggle('on', !!(visited[k] || visited[key]));
    b.textContent = '参';
    updateAtt();
  });
  const slBtn = card.querySelector('[data-sl]');
  if (slBtn) slBtn.onclick = e => {
    e.preventDefault();
    const menu = slBtn.nextElementSibling;
    document.querySelectorAll('.slmenu.open').forEach(m => m !== menu && m.classList.remove('open'));
    menu.classList.toggle('open');
  };
  list.appendChild(card);
});
document.addEventListener('click', e => {
  if (!e.target.closest('.slwrap'))
    document.querySelectorAll('.slmenu.open').forEach(m => m.classList.remove('open'));
});
updateAtt();
if (location.hash.match(/^#c\d+$/)) {
  const el = document.querySelector(location.hash);
  if (el) setTimeout(() => { el.scrollIntoView({ block: 'center' }); el.classList.add('hl');
    setTimeout(() => el.classList.remove('hl'), 2200); }, 80);
}
</script>
</body>
</html>
