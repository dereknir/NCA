<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>にしな年表</title>
<meta property="og:title" content="にしな年表">
<!-- og:image 用根相對路徑; 正式網域拍板後換成絕對 URL (FB 爬蟲較挑) -->
<meta property="og:image" content="/og/timeline.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{--bg:#0a0a15;--panel:#141d31;--line:#243154;--text:#e8ecf6;--dim:#8b97b8;
        --accent:#3d63ff;--gold:#e8c94a;--font:"Noto Sans TC","Hiragino Sans",system-ui,sans-serif;
        --c-LIVE:#3aa981;--c-RELEASE:#e2603a;--c-TIEUP:#8a63c9;--c-COLLAB:#e1518e;
        --c-GOODS:#ef9f27;--c-OTHER:#7c8db5}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.7}
  .site-topbar{position:sticky;top:0;z-index:50;height:57px;background:rgba(10,10,21,0.75);
        backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .site-topbar-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:100%;
        display:flex;align-items:center;gap:14px}
  .site-topbar a{color:var(--text);font-size:20px;font-weight:700;text-decoration:none;transition:color .15s}
  .site-topbar a:hover{color:var(--accent)}
  .site-topbar a.crumb{color:var(--dim);font-size:13px;font-weight:400}
  main{max-width:820px;margin:0 auto;padding:48px 22px 120px}
  h1{font-size:30px;letter-spacing:.08em}
  .sub{color:var(--dim);font-size:13px;margin-top:6px}
  #chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;position:sticky;top:57px;
         background:var(--bg);padding:12px 0;z-index:5}
  .chip{border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:12.5px;
        color:var(--dim);cursor:pointer;background:transparent;font-family:inherit}
  .chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  .chip.on{color:var(--text);border-color:currentColor}
  .yr{font-size:20px;margin:44px 0 6px;color:var(--gold);letter-spacing:.1em}
  .yr small{color:var(--dim);font-size:12px;margin-left:10px}
  .tl{border-left:2px solid var(--line);margin-left:7px;padding-left:22px}
  .item{position:relative;padding:9px 0}
  .item::before{content:'';position:absolute;left:-28px;top:17px;width:10px;height:10px;
        border-radius:50%;background:var(--dot,#7c8db5)}
  .item .d{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
  .item .t{font-size:15px}
  .item .t a{color:var(--text);text-decoration:none}
  .item .t a:hover{color:var(--accent)}
  .badge{font-size:10px;border:1px solid var(--gold);color:var(--gold);border-radius:4px;
        padding:1px 6px;margin-left:8px;vertical-align:2px}
  #today{background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:16px 18px;margin-top:20px;display:none}
  #today .hd{color:var(--dim);font-size:12px;letter-spacing:.08em}
  #today .big{font-size:19px;margin-top:8px}
  #today .big b{color:var(--gold)}
  #today .ev{color:var(--text);font-size:14.5px;margin-top:8px}
  #today .vn{color:var(--dim);font-size:12.5px;margin-top:3px}
  #today .row{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
  #today .go{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:5px 13px;
        color:var(--dim);text-decoration:none;cursor:pointer;background:transparent;font-family:inherit}
  #today .go:hover{border-color:var(--accent);color:var(--accent)}
  #today .dots{display:flex;gap:6px}
  #today .dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;border:none;padding:0}
  #today .dot.on{background:var(--gold)}
  .chip.mine{border-color:#d65555!important}
  .chip.mine i{background:#d65555}
  .chip.mine.on{color:#d65555}
  #next{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:12px 16px;margin-top:18px;font-size:14px;display:none}
  #next b{color:var(--gold)}
  #next .ics{margin-left:12px}
  #q{background:var(--panel);border:1px solid var(--line);border-radius:99px;color:var(--text);
        padding:8px 16px;font-size:13px;font-family:inherit;width:min(320px,100%);margin-top:14px}
  #q:focus{outline:none;border-color:var(--accent)}
  .ics{font-size:11px;border:1px solid var(--line);border-radius:6px;background:transparent;
        color:var(--dim);cursor:pointer;padding:2px 8px;margin-left:8px;font-family:inherit;vertical-align:1px}
  .ics:hover{border-color:var(--accent);color:var(--accent)}
  .sbadge{font-size:10px;border:1px solid var(--c-LIVE);color:var(--c-LIVE);border-radius:4px;
        padding:1px 6px;margin-left:8px;vertical-align:2px}
  .hide{display:none}
  footer{margin-top:70px;color:#5a6784;font-size:11.5px;text-align:center}

  /* ===== A 級全像素換皮 (D 路線 2026-08) — chrome 像素, 資料文字保留 Noto ===== */
  @font-face{font-family:'PX-ZH';src:url('/fonts/pixel/fp12-site-zh_hant.woff2') format('woff2');font-display:swap}
  @font-face{font-family:'PX-JA';src:url('/fonts/pixel/fp12-site-ja.woff2') format('woff2');font-display:swap}
  h1{font-family:'PX-JA','PX-ZH',var(--font);font-weight:400;font-size:24px}
  .site-topbar a:not(.crumb){font-family:'PX-ZH','PX-JA',var(--font);font-weight:400;font-size:24px}
  .site-topbar a.crumb{font-family:'PX-ZH','PX-JA',var(--font);font-size:12px}
  .yr{font-family:'PX-ZH','PX-JA',var(--font);font-size:24px}
  .chip{font-family:'PX-ZH','PX-JA',var(--font);font-size:12px;border-radius:0;border-width:2px;
        clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,
          100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,
          4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
        filter:drop-shadow(3px 3px 0 rgba(0,0,0,.5))}
  .chip:active{transform:translate(3px,3px);filter:none}
  .badge,.sbadge,.ics{border-radius:0;font-family:'PX-ZH','PX-JA',var(--font)}
  #next,#today{border-radius:0;border-width:2px;
        clip-path:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,
          100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,
          6px 100%,6px calc(100% - 6px),0 calc(100% - 6px));
        filter:drop-shadow(5px 5px 0 rgba(0,0,0,.45))}
  #today .hd{font-family:'PX-ZH','PX-JA',var(--font);font-size:12px}
  #today .big{font-family:'PX-ZH','PX-JA',var(--font);font-size:24px}
  #today .go{border-radius:0;font-family:'PX-ZH','PX-JA',var(--font)}
  #today .dot{border-radius:0}
  #q{border-radius:0;border-width:2px}
  .item::before{border-radius:0}
</style>
</head>
<body>
<header class="site-topbar">
  <div class="site-topbar-inner">
    <a href="/">Derek's Site</a>
    <a class="crumb" href="/live/">/ Live 演出</a>
  </div>
</header>
<main>
  <h1>にしな年表</h1>
  <p class="sub">官方 news 全 119 條・點標題到官方頁・未來場次可加入行事曆</p>
  <div id="today"></div>
  <div id="next"></div>
  <input id="q" type="search" placeholder="搜尋活動/歌名… (支援 ?q= 深連結)">
  <div id="chips"></div>
  <div id="tl"></div>
  <footer>資料源:nishina247.jp/news(2021.04 開站起)・僅日期/標題/連結,內文請至官方</footer>
</main>
<script>
const DATA = /*__DATA__*/null;
const SERIES = /*__SERIES__*/null;
const EVENTS = /*__EVENTS__*/null;   // 公演/出演事件(今日のにしな用)
const TOURS = /*__TOURS__*/null;     // 巡演站點(公演徽章連結+参戦濾鏡用)
/* 站上路徑(injection 產物掛在 public/live/ 底下) */
const ROUTES = { concerts: '/live/concerts/', footprint: '/live/footprint/' };
const TOURMAP = {};
TOURS.tours.forEach((t, i) => TOURMAP[t.news_url] = { n: i + 1, tid: t.id });
let visited = {};
try { visited = JSON.parse(localStorage.getItem('nishina-visited') || '{}'); } catch (e) {}
/* 回訪查表:news_url → 第幾回/共幾回(僅 2 場以上的系列) */
const SLOOK = {};
if (SERIES) for (const s of SERIES.series) if (s.count >= 2)
  s.editions.forEach((e, i) => SLOOK[e.news_url] = { name: s.series, n: i + 1, total: s.count });
const CLS = { LIVE: 'LIVE 演出', RELEASE: '發行', TIEUP: '媒體/主題歌', COLLAB: '合作',
              GOODS: '周邊', OTHER: '其他' };
const on = new Set(Object.keys(CLS));
let mineOnly = false;
function isMine(i) {
  if (visited[i.url]) return true;
  const tm = TOURMAP[i.url];
  return !!(tm && (visited['oneman:' + tm.n] ||
    Object.keys(visited).some(k => k.startsWith('stop:' + tm.tid + ':'))));
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 依日期排序(取區間起始;年份缺失的沉底) */
const key = d => {
  const m = d.match(/20\d{2}[.]\d{1,2}[.]\d{1,2}/);
  if (!m) return d.match(/20\d{2}/) ? d.slice(0, 4) + '-00-00' : '0000';
  const [y, mo, da] = m[0].split('.');
  return `${y}-${mo.padStart(2, '0')}-${da.padStart(2, '0')}`;
};
DATA.forEach(i => i._k = key(i.date));
DATA.sort((a, b) => b._k.localeCompare(a._k));   // 新到舊
const TODAY = new Date().toISOString().slice(0, 10);
let q = new URLSearchParams(location.search).get('q') || '';

/* ① .ics 行事曆(全日事件,前端生成零後端) */
function icsFor(dateISO, title, url) {
  const d = dateISO.replace(/-/g, '');
  const body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//nishina-fan//timeline//JA',
    'BEGIN:VEVENT', `DTSTART;VALUE=DATE:${d}`, `SUMMARY:${title.replace(/[,;\\]/g, ' ')}`,
    `URL:${url}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.download = `nishina-${d}.ics`;
  a.href = URL.createObjectURL(new Blob([body], { type: 'text/calendar' }));
  a.click();
}
function renderNext() {
  const fut = [...DATA].filter(i => i._k > TODAY && i.class === 'LIVE').sort((a, b) => a._k.localeCompare(b._k));
  if (!fut.length) return;
  const n = fut[0];
  const days = Math.ceil((new Date(n._k) - new Date(TODAY)) / 86400000);
  const el = document.getElementById('next');
  el.style.display = 'block';
  el.innerHTML = `下一場:<b>${esc(n.title.replace(/^【[^】]+】\s*/, '').slice(0, 40))}</b>
    ・${n._k.slice(5).replace('-', '/')}・還有 <b>${days}</b> 天
    <button class="ics" data-k="${n._k}" data-t="${esc(n.title)}" data-u="${esc(n.url)}">📅 加入行事曆</button>`;
}

function render() {
  const tl = document.getElementById('tl');
  tl.innerHTML = '';
  let curYear = null, yearWrap = null, count = 0;
  for (const i of DATA) {
    if (!on.has(i.class)) continue;
    if (q && !i.title.toLowerCase().includes(q.toLowerCase())) continue;
    if (mineOnly && !isMine(i)) continue;
    const y = i._k.slice(0, 4);
    if (y !== curYear) {
      curYear = y;
      const h = document.createElement('div');
      h.className = 'yr';
      h.id = `y${y}`;
      h.innerHTML = `${y === '0000' ? '日期不明' : y}<small id="yc-${y}"></small>`;
      tl.appendChild(h);
      yearWrap = document.createElement('div');
      yearWrap.className = 'tl';
      yearWrap.dataset.y = y;
      tl.appendChild(yearWrap);
      count = 0;
    }
    const el = document.createElement('div');
    el.className = 'item';
    el.style.setProperty('--dot', `var(--c-${i.class})`);
    const tm = TOURMAP[i.url];
    const badge = i.live_type === 'ONEMAN'
      ? (ROUTES.concerts && tm
          ? `<a class="badge" style="text-decoration:none" href="${ROUTES.concerts}#c${tm.n}">公演 →</a>`
          : '<span class="badge">公演</span>')
      : '';
    const sv = SLOOK[i.url];
    const sbadge = sv ? `<span class="sbadge" title="${esc(sv.name)}">回訪 ${sv.n}/${sv.total}</span>` : '';
    const ics = i._k > TODAY
      ? `<button class="ics" data-k="${i._k}" data-t="${esc(i.title)}" data-u="${esc(i.url)}">📅</button>` : '';
    el.innerHTML = `<div class="d">${esc(i.date)}</div>
      <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>${badge}${sbadge}${ics}</div>`;
    yearWrap.appendChild(el);
    count++;
    const yc = document.getElementById(`yc-${y}`);
    if (yc) yc.textContent = `${count} 件`;
  }
}
const chips = document.getElementById('chips');
for (const [k, label] of Object.entries(CLS)) {
  const b = document.createElement('button');
  b.className = 'chip on';
  b.innerHTML = `<i style="background:var(--c-${k})"></i>${label}`;
  b.onclick = () => { on.has(k) ? on.delete(k) : on.add(k); b.classList.toggle('on'); render(); };
  chips.appendChild(b);
}
{
  const b = document.createElement('button');
  b.className = 'chip mine';
  b.innerHTML = `<i></i>参戦した場次`;
  b.onclick = () => { mineOnly = !mineOnly; b.classList.toggle('on'); render(); };
  chips.appendChild(b);
}
document.getElementById('tl').addEventListener('click', e => {
  const b = e.target.closest('.ics');
  if (b) icsFor(b.dataset.k, b.dataset.t, b.dataset.u);
});
document.getElementById('next').addEventListener('click', e => {
  const b = e.target.closest('.ics');
  if (b) icsFor(b.dataset.k, b.dataset.t, b.dataset.u);
});
const qEl = document.getElementById('q');
qEl.value = q;
qEl.addEventListener('input', () => {
  q = qEl.value;
  history.replaceState(null, '', q ? `?q=${encodeURIComponent(q)}` : location.pathname + location.hash);
  render();
});
render();
renderNext();

/* ④ 今日のにしな:同月日回顧,無事件日回退成下一場倒數 */
(function today() {
  const el = document.getElementById('today');
  const now = new Date(TODAY);
  const md = TODAY.slice(5);
  const pool = [
    ...EVENTS.appearance.filter(e => e.event_date && e.event_date.slice(5) === md && e.event_date < TODAY)
      .map(e => ({ date: e.event_date, name: e.name, sub: e.venue || '', url: e.news_url })),
    ...TOURS.tours.flatMap((t, i) => t.stops
      .filter(st => st.date.slice(5) === md && st.date < TODAY)
      .map(st => ({ date: st.date, name: t.name, sub: st.venue + '(' + st.pref + ')',
                    url: ROUTES.concerts ? `${ROUTES.concerts}#c${i + 1}` : t.news_url }))),
  ].sort((a, b) => a.date.localeCompare(b.date)).slice(0, 3);
  el.style.display = 'block';
  const hd = `<div class="hd">✦ 今日のにしな — ${+md.slice(0, 2)}月${+md.slice(3)}日</div>`;
  if (pool.length) {
    let idx = 0;
    const paint = () => {
      const e = pool[idx];
      const yrs = now.getFullYear() - +e.date.slice(0, 4);
      el.innerHTML = hd
        + `<div class="big"><b>${yrs}</b> 年前的今天</div>`
        + `<div class="ev">${esc(e.name)}</div>`
        + `<div class="vn">${esc(e.sub)}</div>`
        + `<div class="row">
             <button class="go" data-y="${e.date.slice(0, 4)}">在年表看這一年 →</button>
             ${pool.length > 1 ? `<span class="dots">${pool.map((_, j) =>
               `<button class="dot${j === idx ? ' on' : ''}" data-i="${j}"></button>`).join('')}</span>` : ''}
           </div>`;
      el.querySelector('.go').onclick = ev =>
        document.getElementById('y' + ev.target.dataset.y)?.scrollIntoView({ block: 'start' });
      el.querySelectorAll('.dot').forEach(d => d.onclick = () => { idx = +d.dataset.i; paint(); });
    };
    paint();
    if (pool.length > 1 && !matchMedia('(prefers-reduced-motion: reduce)').matches)
      setInterval(() => { idx = (idx + 1) % pool.length; paint(); }, 7000);
  } else {
    const fut = [...DATA].filter(i => i._k > TODAY && i.class === 'LIVE')
      .sort((a, b) => a._k.localeCompare(b._k))[0];
    if (!fut) { el.style.display = 'none'; return; }
    const days = Math.ceil((new Date(fut._k) - now) / 86400000);
    el.innerHTML = hd
      + `<div class="big">今天的往年安靜——但 <b>${days}</b> 天後</div>`
      + `<div class="ev">${esc(fut.title.replace(/^【[^】]+】\s*/, '').slice(0, 44))}</div>`
      + `<div class="row"><button class="go ics" data-k="${fut._k}" data-t="${esc(fut.title)}" data-u="${esc(fut.url)}">📅 加入行事曆</button></div>`;
    el.querySelector('.ics').onclick = b =>
      icsFor(b.target.dataset.k, b.target.dataset.t, b.target.dataset.u);
  }
})();
if (location.hash.match(/^#y20\d{2}$/))
  setTimeout(() => document.querySelector(location.hash)?.scrollIntoView({ block: 'start' }), 60);
</script>
</body>
</html>
