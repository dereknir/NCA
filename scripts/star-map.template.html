<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a15">
<title>にしな歌詞星圖</title>
<meta name="description" content="每一句歌詞都是一顆星，意思相近的句子聚在一起。">
<meta property="og:type" content="website">
<meta property="og:title" content="にしな 歌詞星圖">
<meta property="og:description" content="每一句歌詞都是一顆星，意思相近的句子聚在一起。">
<meta property="og:image" content="/og/star-map.png">
<meta property="og:site_name" content="Derek's Site">
<meta name="twitter:card" content="summary_large_image">
<script src="/js/d3-star-map.min.js" defer></script>
<style>
  /* 對齊主站深空調色 */
  :root{--bg:#0a0a15;--panel:#141425;--line:rgba(255,255,255,0.08);--text:#f3f4f6;--dim:#9ca3af;
        --accent:#60a5fa;--font:"Noto Sans TC","Hiragino Sans",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1200px 700px at 65% 20%, #10112a 0%, var(--bg) 60%);
       color:var(--text);font-family:var(--font);line-height:1.6;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  /* mini header — 對齊 /lyric-universe/ 和 /kwic/ */
  .site-topbar{background:rgba(10,10,21,0.75);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-shrink:0}
  .site-topbar-inner{max-width:1400px;margin:0 auto;padding:14px 24px}
  .site-topbar a{color:var(--text);font-size:20px;font-weight:700;text-decoration:none;transition:color .15s}
  .site-topbar a:hover{color:var(--accent)}
  #star-main{flex:1;display:flex;flex-direction:column;min-height:0}   /* 主要內容 (工具列 + 星圖), 跟 body 一樣直向撐滿 */
  /* 只管星圖自己的工具列; 寫成 header{} 會連全站頁首 .sh-hd 一起吃到 padding, logo、選單被往內推 */
  #star-main>header{display:flex;align-items:center;gap:14px;padding:10px 24px;flex-wrap:wrap}
  h1{font-size:20px;letter-spacing:.08em}
  .meta{color:var(--dim);font-size:12px}
  .spacer{flex:1}
  input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:8px 14px;color:var(--text);font-size:13.5px;font-family:inherit;width:230px}
  input[type=search]:focus{outline:none;border-color:var(--accent)}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{background:transparent;border:none;color:var(--dim);padding:8px 14px;
    font-size:13px;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--accent);color:#0a0a15}
  button.rst{background:var(--panel);border:1px solid var(--line);border-radius:9px;
    color:var(--dim);padding:8px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  #stage{flex:1;display:grid;grid-template-columns:1fr 290px;min-height:0}
  #sky{width:100%;height:100%;cursor:grab;touch-action:none}
  #sky:active{cursor:grabbing}
  #sky text.cl{fill:#f3f4f6;font-size:14px;font-weight:600;letter-spacing:.15em;opacity:.9;
    paint-order:stroke;stroke:rgba(10,10,21,.9);stroke-width:5px;pointer-events:none}
  #sky path.hull{fill-opacity:.07;stroke-opacity:.35;stroke-width:1.2;pointer-events:none}
  #sky line.leader{stroke:rgba(255,255,255,.18);stroke-width:.8;pointer-events:none}
  /* 鍵盤焦點: 星星本身不畫 outline (Chrome 會框成整個 bbox), 改畫一個方框跟著走, 金色同全站 focus */
  #sky circle:focus{outline:none}
  #sky .ring rect{fill:none;shape-rendering:crispEdges;vector-effect:non-scaling-stroke;pointer-events:none}
  #sky .ring .bk{stroke:#0a0a15;stroke-width:4}
  #sky .ring .fg{stroke:#e8c94a;stroke-width:2}
  .kbd-hint{color:var(--dim);font-size:12px;margin-top:10px}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  aside{border-left:1px solid var(--line);padding:16px;overflow-y:auto;background:rgba(10,15,28,.5)}
  aside .ph{color:var(--dim);font-size:13px}
  .pin .ja{font-size:16px;line-height:1.7}
  .pin .zh{color:var(--dim);font-size:13px;margin-top:6px}
  .pin .src{margin-top:12px;font-size:12.5px}
  .pin .src a{color:var(--accent);text-decoration:none}
  .pin .cst{margin-top:14px;font-size:12px;color:var(--dim)}
  #legend{padding:10px 16px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);
    border-top:1px solid var(--line)}
  #legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
  #tip{position:fixed;pointer-events:none;background:rgba(12,18,34,.96);border:1px solid var(--line);
    border-radius:10px;padding:10px 13px;font-size:13px;max-width:340px;display:none;z-index:9}
  #tip .zh{color:var(--dim);font-size:11.5px;margin-top:3px}
  #tip .t{color:var(--dim);font-size:11px;margin-top:5px}
  .pin .x{display:none}
  /* 窄版: 側欄放不下, 平常收起; 釘選一顆星時改成貼在畫面底部的卡片 (地圖不動、不用捲頁), × 或 Esc 收起 */
  @media(max-width:820px){
    /* 手機: 頁面本身可以捲, 星圖至少 320px / 六成畫面高 (以前圖例擠掉, 390×844 只剩 251px、橫放 0) */
    body{height:auto;min-height:100vh;overflow:visible}
    #stage{grid-template-columns:1fr;flex:none;height:max(320px,60vh)}   /* 固定高: 轉橫 / 轉直時圖不會被 viewBox 比例撐到比螢幕還高 */
    /* 圖例改一排橫滑 (原本折成 6~7 行, 吃掉 240px) */
    #legend{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
    #legend span{flex:none}
    aside{display:none;position:fixed;left:8px;right:8px;bottom:8px;max-height:45vh;z-index:8;
      border:1px solid var(--line);border-radius:12px;background:rgba(12,18,34,.97);padding:14px 16px}
    aside.has-pin{display:block}
    .pin{position:relative;padding-right:36px}
    .pin .x{display:flex;align-items:center;justify-content:center;position:absolute;top:-6px;right:-8px;
      width:36px;height:36px;background:transparent;border:1px solid var(--line);border-radius:8px;
      color:var(--dim);font-size:18px;cursor:pointer;font-family:inherit}
  }

</style>
<link rel="stylesheet" href="/css/scrollbar.css">
<link rel="stylesheet" href="/css/site-shell.css">
<script src="/js/site-shell.js" defer></script>
</head>
<body data-sh-pill="off">
<header class="sh-hd" data-sh-header></header>
<div role="region" class="sh-hero sh-hero--slim" data-sh-hero data-planet="uranus" aria-labelledby="sh-title">
  <div class="sh-hero-bg" aria-hidden="true"></div>
  <div class="sh-wrap sh-hero-inner sh-wrap--full">
    <div class="sh-hero-text">
      <div class="sh-prompt"><span class="u">derek@nishina</span>:<span class="pa">~/uranus/star-map</span> $ <span class="cmd">plot --umap</span></div>
      <h1 class="sh-title" id="sh-title">歌詞星圖</h1>
    </div>
  </div>
</div>
<main id="star-main">
<header>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <input type="search" id="filter" placeholder="輸入文字點亮相符的星(日/中)">
  <div class="seg">
    <button id="m-cluster" class="on">星座</button>
    <button id="m-album">專輯</button>
  </div>
  <button class="rst" id="reset">重置視角</button>
</header>

<div id="stage">
  <svg id="sky" role="group" aria-label="歌詞星圖: Tab 進來後用方向鍵在星星之間移動, Enter 看句子, Esc 收起"></svg>
  <aside id="side"><div class="ph">每顆星是一句歌詞。滾輪縮放、拖曳漫遊;<br>hover 讀句子,點擊釘選。<br><br>亮度較高的星 = 副歌反覆吟唱的句子。<div class="kbd-hint">鍵盤: Tab 到星圖, 方向鍵移動, Enter 釘選, Esc 收起。</div></div></aside>
</div>
<div id="legend" tabindex="0" role="group" aria-label="圖例: 顏色代表的星座或專輯 (手機可左右滑)"></div>
<div id="tip"></div>
<div id="sky-live" class="sr-only" aria-live="polite"></div>
</main>

<script>
// d3 改放站上 (/js/d3-star-map.min.js) 而且 defer, 不擋畫面; 主程式等它跑完
addEventListener('DOMContentLoaded', () => {
const DATA = /*__DATA__*/null;
// 站內歌曲頁
const songUrl = id => `/translations/${id}`;
// 站長策展區:星座正式名稱(key = cluster id;未填則顯示 autoLabel 草稿)
const CLUSTER_NAMES = { /* 例: 0: '夜與溶解', 3: '果實與戀' */ };

const CL_COLORS = ['#6ea8fe','#3aa981','#e2603a','#8a63c9','#e1518e','#e8c94a',
                   '#4dd0c4','#f2a6c0','#9ccc65','#ef9f27','#7c8db5','#c76b4a'];
const ALBUMS = [...new Set(DATA.points.map(p => p.album))];
const ALB_COLORS = ['#7c8db5','#3aa981','#e2603a','#8a63c9','#e1518e'];
const cName = c => CLUSTER_NAMES[c.id] ?? c.autoLabel;
const esc = s => s.replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

document.getElementById('meta').textContent =
  `${DATA.meta.lines} 句 · ${DATA.meta.k} 星座 · encoder: ${DATA.meta.encoder}`;

const side = document.getElementById('side'), tip = document.getElementById('tip');
if (typeof d3 === 'undefined') {
  side.innerHTML = '<div class="ph">D3 載入失敗, 重新整理試試。</div>';
} else {

const svg = d3.select('#sky');
const box = document.getElementById('sky').getBoundingClientRect();
const W = box.width || 900, H = box.height || 600;
svg.attr('viewBox', `0 0 ${W} ${H}`);
const root = svg.append('g');

// 座標映射(資料 0-1000 → 畫布,留邊)
const pad = 40;
const sx = d3.scaleLinear([0, 1000], [pad, W - pad]);
const sy = d3.scaleLinear([0, 1000], [pad, H - pad]);
let mode = 'cluster';
const color = p => mode === 'cluster'
  ? CL_COLORS[p.c % CL_COLORS.length]
  : ALB_COLORS[ALBUMS.indexOf(p.album) % ALB_COLORS.length];
// 星大小:副歌反覆越多 → 星越大越亮 (更誇張的曲線, 拉開視覺層次)
const R = p => 1.4 + Math.pow(p.n, 0.6) * 2.4;
const CORE_OP = p => Math.min(1, 0.75 + (p.n - 1) * 0.05);
const HALO_OP = p => Math.min(0.28, 0.11 + (p.n - 1) * 0.03);

// 星座殼 (convex hull, 平滑曲線, 半透明) — 最底層
const line = d3.line().curve(d3.curveCatmullRomClosed.alpha(0.6));
const hulls = DATA.clusters.map(c => {
  const pts = DATA.points.filter(p => p.c === c.id).map(p => [sx(p.x), sy(p.y)]);
  if (pts.length < 3) return null;
  const hull = d3.polygonHull(pts);
  return hull ? { c, path: line(hull) } : null;
}).filter(Boolean);
const hullG = root.append('g').attr('class', 'hulls');
const hullPath = hullG.selectAll('path').data(hulls).join('path')
  .attr('class', 'hull').attr('d', h => h.path)
  .attr('fill', h => CL_COLORS[h.c.id % CL_COLORS.length])
  .attr('stroke', h => CL_COLORS[h.c.id % CL_COLORS.length]);

// 星暈 + 星核 (副歌反覆越多的星更亮更大)
const halo = root.append('g').attr('aria-hidden', 'true').selectAll('circle').data(DATA.points).join('circle')
  .attr('cx', p => sx(p.x)).attr('cy', p => sy(p.y))
  .attr('r', p => R(p) * 2.4).attr('opacity', HALO_OP);
const star = root.append('g').selectAll('circle').data(DATA.points).join('circle')
  .attr('cx', p => sx(p.x)).attr('cy', p => sy(p.y))
  .attr('r', R).attr('opacity', CORE_OP)
  .attr('stroke', 'rgba(255,255,255,.4)').attr('stroke-width', .5)
  .style('cursor', 'pointer')
  // 鍵盤: 整張圖只佔一個 Tab 停點 (roving tabindex), 進來後方向鍵在星星之間跳
  .attr('role', 'button')
  .attr('tabindex', (p, i) => i === 0 ? 0 : -1)
  .attr('aria-pressed', 'false')
  .attr('data-name', p => p.ja)
  .attr('aria-label', p => `${p.ja} — ${p.title}`);

// 星座標籤(以質心為錨, 用 d3-force 反擁擠推開)
const cent = DATA.clusters.map(c => {
  const ps = DATA.points.filter(p => p.c === c.id);
  const cx = d3.mean(ps, p => sx(p.x));
  const cy = d3.mean(ps, p => sy(p.y));
  return { c, x0: cx, y0: cy, x: cx, y: cy };
});
// 抗撞短算:centroid 為彈簧目標, 彼此以圓形碰撞推開
const labelSim = d3.forceSimulation(cent)
  .force('x', d3.forceX(d => d.x0).strength(0.5))
  .force('y', d3.forceY(d => d.y0).strength(0.5))
  .force('collide', d3.forceCollide(58))
  .stop();
for (let i = 0; i < 140; i++) labelSim.tick();

// 標籤偏移超過閾值時, 畫細引線回原質心
const leaderG = root.append('g').attr('aria-hidden', 'true');
const leader = leaderG.selectAll('line').data(cent).join('line')
  .attr('class', 'leader')
  .attr('x1', d => d.x0).attr('y1', d => d.y0)
  .attr('x2', d => d.x).attr('y2', d => d.y)
  .attr('visibility', d =>
    Math.hypot(d.x - d.x0, d.y - d.y0) > 12 ? 'visible' : 'hidden');

const clabel = root.append('g').attr('aria-hidden', 'true').selectAll('text').data(cent).join('text')
  .attr('class', 'cl').attr('text-anchor', 'middle')
  .attr('x', d => d.x).attr('y', d => d.y)
  .text(d => cName(d.c));

function paint() {
  halo.attr('fill', color);
  star.attr('fill', color);
  const showCl = mode === 'cluster';
  clabel.style('display', showCl ? null : 'none');
  leader.style('display', showCl ? null : 'none');
  hullPath.style('display', showCl ? null : 'none');
  const items = showCl
    ? DATA.clusters.map(c => [CL_COLORS[c.id % CL_COLORS.length], `${cName(c)} (${c.size})`])
    : ALBUMS.map(a => [ALB_COLORS[ALBUMS.indexOf(a) % ALB_COLORS.length], a]);
  document.getElementById('legend').innerHTML =
    items.map(([col, t]) => `<span><i style="background:${col}"></i>${esc(t)}</span>`).join('');
}
paint();

// 縮放漫遊
const zoom = d3.zoom().scaleExtent([.6, 9]).on('zoom', e => root.attr('transform', e.transform));
svg.call(zoom);
document.getElementById('reset').onclick = () =>
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);

// tooltip / 釘選
star.on('pointerover', (e, p) => {
  tip.style.display = 'block';
  tip.innerHTML = `${esc(p.ja)}<div class="zh">${esc(p.zh || '')}</div>
    <div class="t">${esc(p.title)}${p.n > 1 ? ` · 唱了 ${p.n} 次` : ''}</div>`;
}).on('pointermove', e => {
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 360) + 'px';
  tip.style.top = (e.clientY + 14) + 'px';
}).on('pointerout', () => tip.style.display = 'none');

// 點星: 星只有幾 px, 手指點不準 → 點一下 (不是拖) 時取手指 22px (螢幕像素, 跟縮放無關) 內最近的星。
// 距離量到星的外緣, 直接點在星上就是 0; 兩顆都點在上面 (疊在一起) 再比到中心的距離。
// 位置用按下那一刻的 (pointerdown), 不用 click 的 — 手機瀏覽器會把 click 的位置「吸」到它覺得想點的元素上。
const TAP_SLOP = 22, DRAG_PX = 6;
let down = null;   // { id, x, y, moved }
svg.node().addEventListener('pointerdown', e => {
  down = e.isPrimary ? { id: e.pointerId, x: e.clientX, y: e.clientY, moved: false } : null;
}, true);
svg.node().addEventListener('pointermove', e => {
  if (down && e.pointerId === down.id && Math.hypot(e.clientX - down.x, e.clientY - down.y) > DRAG_PX) down.moved = true;
}, true);
function nearestStar(x, y) {
  const m = root.node().getScreenCTM();   // 圖的座標 → 螢幕 (含縮放、捲動)
  const k = Math.hypot(m.a, m.b);
  let best = null, bd = Infinity, bc = Infinity;
  for (const p of DATA.points) {
    const px = sx(p.x), py = sy(p.y);
    const c = Math.hypot(m.a * px + m.c * py + m.e - x, m.b * px + m.d * py + m.f - y);
    const d = Math.max(0, c - R(p) * k);
    if (d < bd || (d === bd && c < bc)) { best = p; bd = d; bc = c; }
  }
  return bd <= TAP_SLOP ? best : null;
}
svg.on('click', e => {
  const t = down;
  down = null;
  if (t && t.moved) return;   // 拖曳放手不算點
  // 沒有按下的位置 (讀螢幕軟體直接對星送 click): 就是那顆星
  const p = t ? nearestStar(t.x, t.y) : e.target.__data__ && starEl.get(e.target.__data__) === e.target ? e.target.__data__ : nearestStar(e.clientX, e.clientY);
  if (p) pin(starEl.get(p), p);
});

const sidePH = side.innerHTML;
// 讀螢幕只念一句短的, 不要整個側欄當 live region (不然 Enter 會整段重念、Esc 念說明文字)
const live = document.getElementById('sky-live');
let pinned = null;   // 目前釘選的那顆星 (Esc 時焦點還給它)
function pin(el, p) {
  if (pinned) pinned.setAttribute('aria-pressed', 'false');
  el.setAttribute('aria-pressed', 'true');
  live.textContent = `已釘選: ${p.ja}`;
  const cl = DATA.clusters.find(c => c.id === p.c);
  side.innerHTML = `<div class="pin">
    <button type="button" class="x" aria-label="收起">×</button>
    <div class="ja">${esc(p.ja)}</div>
    <div class="zh">${esc(p.zh || '')}</div>
    <div class="src"><a href="${songUrl(p.song)}">${esc(p.title)} →</a>${p.n > 1 ? ` · 副歌 ×${p.n}` : ''}</div>
    <div class="cst">所屬星座:${esc(cName(cl))}(${cl.size} 句)</div></div>`;
  side.classList.add('has-pin');
  pinned = el;
  rove(el);
  clearOfCard(el, p);
}
// 窄版的卡片貼在畫面底部: 釘選的星如果被卡片蓋住, 鏡頭直接移到讓星在卡片上方 (跟方向鍵出界一樣不做過場)
function clearOfCard(el, p) {
  if (getComputedStyle(side).position !== 'fixed') return;
  let c = side.getBoundingClientRect(), b = el.getBoundingClientRect(), v = skyEl.getBoundingClientRect();
  if (b.bottom < c.top - 8 && b.top >= 0) return;
  // 卡片上方露出的圖不夠 (手機橫放、還沒往下捲): 先把頁面捲到圖的頂端貼齊畫面上緣
  if (v.top > 0 && v.top > c.top - 56) {
    window.scrollBy(0, v.top);
    c = side.getBoundingClientRect(); b = el.getBoundingClientRect(); v = skyEl.getBoundingClientRect();
  }
  const y = Math.max(v.top + 16, Math.min(c.top, v.bottom) - 40);
  // 螢幕座標 → viewBox 座標 (轉過方向後圖會有上下留白, 用 CTM 換才準)
  const q = new DOMPoint(b.left + b.width / 2, y).matrixTransform(skyEl.getScreenCTM().inverse());
  svg.call(zoom.translateTo, sx(p.x), sy(p.y), [q.x, q.y]);
}
let noJump = false;   // 用手指按 × 收起時, 焦點還給星但鏡頭不跳回去 (使用者可能已經把圖拖走了)
function unpin(byPointer) {
  if (!pinned) return;
  side.innerHTML = sidePH;
  side.classList.remove('has-pin');
  pinned.setAttribute('aria-pressed', 'false');
  live.textContent = '已收起';
  noJump = !!byPointer;
  pinned.focus({ preventScroll: true });
  noJump = false;
  pinned = null;
}

// 焦點框: 一個方框疊在最上層, 跟著有焦點的星
const ring = root.append('g').attr('class', 'ring').attr('aria-hidden', 'true').style('display', 'none');
ring.append('rect').attr('class', 'bk');
ring.append('rect').attr('class', 'fg');
let stop = star.node();   // 目前的 Tab 停點
function rove(el) {
  if (el === stop) return;
  stop.setAttribute('tabindex', -1);
  el.setAttribute('tabindex', 0);
  stop = el;
}
// 放大之後方向鍵可能跳到畫面外的星: 出界就把視角直接移過去 (不做過場, 就是鏡頭跳過去)
const skyEl = document.getElementById('sky');
function keepInView(el, p) {
  const b = el.getBoundingClientRect(), v = skyEl.getBoundingClientRect(), m = 12;
  if (b.left < v.left + m || b.right > v.right - m || b.top < v.top + m || b.bottom > v.bottom - m)
    svg.call(zoom.translateTo, sx(p.x), sy(p.y));
}
star.on('focus', function (e, p) {
  rove(this);
  if (!noJump) keepInView(this, p);
  if (!this.matches(':focus-visible')) return;   // 滑鼠點的不畫框
  const h = Math.ceil(R(p)) + 4;
  ring.style('display', null).selectAll('rect')
    .attr('x', sx(p.x) - h).attr('y', sy(p.y) - h).attr('width', h * 2).attr('height', h * 2);
}).on('blur', () => ring.style('display', 'none'));

// 方向鍵: 往那個方向找最近的星 (偏離方向的距離算重一點, 才不會斜著亂跳);
// 有輸入過濾字的時候只在亮著的星之間跳
const DIRS = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowUp: [0, -1] };
let lit = () => true;
function next(p, [dx, dy]) {
  let best = null, bestS = Infinity;
  for (const q of DATA.points) {
    if (q === p || !lit(q)) continue;
    const ax = (q.x - p.x) * dx + (q.y - p.y) * dy;        // 沿方向
    if (ax <= 0) continue;
    const off = Math.abs((q.x - p.x) * dy - (q.y - p.y) * dx);   // 偏離方向
    const s = ax + off * 2.5;
    if (s < bestS) { bestS = s; best = q; }
  }
  return best;
}
const starEl = new Map();
star.each(function (p) { starEl.set(p, this); });
star.on('keydown', function (e, p) {
  if (e.altKey || e.ctrlKey || e.metaKey) return;   // Alt+← 上一頁之類的留給瀏覽器
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    pin(this, p);
  } else if (DIRS[e.key]) {
    e.preventDefault();
    const q = next(p, DIRS[e.key]);
    if (q) starEl.get(q).focus({ preventScroll: true });
  }
});
// Esc: 在星圖或側欄裡按都收起來, 焦點回到剛剛那顆星
document.getElementById('sky').addEventListener('keydown', e => { if (e.key === 'Escape') unpin(); });
side.addEventListener('keydown', e => { if (e.key === 'Escape') unpin(); });
side.addEventListener('click', e => { if (e.target.closest('.x')) unpin(e.detail > 0); });   // detail 0 = 鍵盤按的

// 文字過濾點亮
document.getElementById('filter').addEventListener('input', e => {
  const q = e.target.value.trim();
  const hit = p => !q || p.ja.includes(q) || (p.zh && p.zh.includes(q));
  lit = hit;
  star.attr('opacity', p => hit(p) ? 1 : .12);
  halo.attr('opacity', p => hit(p) ? .13 : .02);
  // Tab 停點如果是暗掉的星, 換到第一顆亮的, 不然 Tab 進來就停在找不到的地方
  const first = DATA.points.find(hit);
  if (first && !hit(stop.__data__)) rove(starEl.get(first));
  live.textContent = first ? '' : '沒有相符的星';
});

// 模式切換
const bC = document.getElementById('m-cluster'), bA = document.getElementById('m-album');
bC.onclick = () => { mode = 'cluster'; bC.classList.add('on'); bA.classList.remove('on'); paint(); };
bA.onclick = () => { mode = 'album'; bA.classList.add('on'); bC.classList.remove('on'); paint(); };
}
});
</script>
</body>
