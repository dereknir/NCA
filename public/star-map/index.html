<style>

const CORE_OP = p => Math.min(1, 0.75 + (p.n - 1) * 0.05);
const HALO_OP = p => Math.min(0.28, 0.11 + (p.n - 1) * 0.03);

// 星座殼 (convex hull, 平滑曲線, 半透明) — 最底層
const line = d3.line().curve(d3.curveCatmullRomClosed.alpha(0.6));
const hulls = DATA.clusters.map(c => {
  const pts = DATA.points.filter(p => p.c === c.id).map(p => [sx(p.x), sy(p.y)]);
  if (pts.length < 3) return null;
  const hull = d3.polygonHull(pts);
  return hull ? { c, path: line(hull) } : null;
}).filter(Boolean);
const hullG = root.append('g').attr('class', 'hulls');
const hullPath = hullG.selectAll('path').data(hulls).join('path')
  .attr('class', 'hull').attr('d', h => h.path)
  .attr('fill', h => CL_COLORS[h.c.id % CL_COLORS.length])
  .attr('stroke', h => CL_COLORS[h.c.id % CL_COLORS.length]);

// 星暈 + 星核 (副歌反覆越多的星更亮更大)
const halo = root.append('g').selectAll('circle').data(DATA.points).join('circle')
  .attr('cx', p => sx(p.x)).attr('cy', p => sy(p.y))
  .attr('r', p => R(p) * 2.4).attr('opacity', HALO_OP);
const star = root.append('g').selectAll('circle').data(DATA.points).join('circle')
  .attr('cx', p => sx(p.x)).attr('cy', p => sy(p.y))
  .attr('r', R).attr('opacity', CORE_OP)
  .attr('stroke', 'rgba(255,255,255,.4)').attr('stroke-width', .5)
  .style('cursor', 'pointer');

// 星座標籤(以質心為錨, 用 d3-force 反擁擠推開)
const cent = DATA.clusters.map(c => {
  const ps = DATA.points.filter(p => p.c === c.id);
  const cx = d3.mean(ps, p => sx(p.x));
  const cy = d3.mean(ps, p => sy(p.y));
  return { c, x0: cx, y0: cy, x: cx, y: cy };
});
// 抗撞短算:centroid 為彈簧目標, 彼此以圓形碰撞推開
const labelSim = d3.forceSimulation(cent)
  .force('x', d3.forceX(d => d.x0).strength(0.5))
  .force('y', d3.forceY(d => d.y0).strength(0.5))
  .force('collide', d3.forceCollide(58))
  .stop();
for (let i = 0; i < 140; i++) labelSim.tick();

// 標籤偏移超過閾值時, 畫細引線回原質心
const leaderG = root.append('g');
const leader = leaderG.selectAll('line').data(cent).join('line')
  .attr('class', 'leader')
  .attr('x1', d => d.x0).attr('y1', d => d.y0)
  .attr('x2', d => d.x).attr('y2', d => d.y)
  .attr('visibility', d =>
    Math.hypot(d.x - d.x0, d.y - d.y0) > 12 ? 'visible' : 'hidden');

const clabel = root.append('g').selectAll('text').data(cent).join('text')
  .attr('class', 'cl').attr('text-anchor', 'middle')
  .attr('x', d => d.x).attr('y', d => d.y)
  .text(d => cName(d.c));

function paint() {
  halo.attr('fill', color);
  star.attr('fill', color);
  const showCl = mode === 'cluster';
  clabel.style('display', showCl ? null : 'none');
  leader.style('display', showCl ? null : 'none');
  hullPath.style('display', showCl ? null : 'none');
  const items = showCl
    ? DATA.clusters.map(c => [CL_COLORS[c.id % CL_COLORS.length], `${cName(c)} (${c.size})`])
    : ALBUMS.map(a => [ALB_COLORS[ALBUMS.indexOf(a) % ALB_COLORS.length], a]);
  document.getElementById('legend').innerHTML =
    items.map(([col, t]) => `<span><i style="background:${col}"></i>${esc(t)}</span>`).join('');
}
paint();

// 縮放漫遊
const zoom = d3.zoom().scaleExtent([.6, 9]).on('zoom', e => root.attr('transform', e.transform));
svg.call(zoom);
document.getElementById('reset').onclick = () =>
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);

// tooltip / 釘選
star.on('pointerover', (e, p) => {
  tip.style.display = 'block';
  tip.innerHTML = `${esc(p.ja)}<div class="zh">${esc(p.zh || '')}</div>
    <div class="t">${esc(p.title)}${p.n > 1 ? ` · 唱了 ${p.n} 次` : ''}</div>`;
}).on('pointermove', e => {
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 360) + 'px';
  tip.style.top = (e.clientY + 14) + 'px';
}).on('pointerout', () => tip.style.display = 'none')
  .on('click', (e, p) => {
    const cl = DATA.clusters.find(c => c.id === p.c);
    side.innerHTML = `<div class="pin">
      <div class="ja">${esc(p.ja)}</div>
      <div class="zh">${esc(p.zh || '')}</div>
      <div class="src"><a href="${songUrl(p.song)}">${esc(p.title)} →</a>${p.n > 1 ? ` · 副歌 ×${p.n}` : ''}</div>
      <div class="cst">所屬星座:${esc(cName(cl))}(${cl.size} 句)</div></div>`;
  });

// 文字過濾點亮
document.getElementById('filter').addEventListener('input', e => {
  const q = e.target.value.trim();
  const hit = p => !q || p.ja.includes(q) || (p.zh && p.zh.includes(q));
  star.attr('opacity', p => hit(p) ? 1 : .12);
  halo.attr('opacity', p => hit(p) ? .13 : .02);
});

// 模式切換
const bC = document.getElementById('m-cluster'), bA = document.getElementById('m-album');
bC.onclick = () => { mode = 'cluster'; bC.classList.add('on'); bA.classList.remove('on'); paint(); };
bA.onclick = () => { mode = 'album'; bA.classList.add('on'); bC.classList.remove('on'); paint(); };
}
</script>

  }

})();
</script>
