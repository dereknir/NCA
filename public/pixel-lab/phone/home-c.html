<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首頁 C — 整個首頁就是手機</title>
<link rel="stylesheet" href="/css/site-shell.css">
<link rel="stylesheet" href="/css/n247i.css">
<script src="/js/site-shell.js" defer></script>
<style>
  /* 首頁 C (Peter Oravec 式): 整個首頁只有手機, 不能往下捲, 所有地方都從手機 (或頁首選單) 進去 */
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sh-bg); color: var(--sh-ink); }
  body { display: flex; flex-direction: column; }
  .stage { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .stage canvas.sky { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  .room { position: relative; flex: 1; display: grid; place-items: center; min-height: 0; }
  .room > div { display: grid; place-items: center; }
  .escape { position: relative; text-align: center; padding: 0 16px 16px; font: 12px/1.8 var(--sh-px); color: var(--sh-ink3); }
  .escape a { color: var(--sh-ink2); }
  .who { position: absolute; left: 24px; top: 20px; font: 12px/1.8 var(--sh-px); color: var(--sh-ink3); width: 300px; }
  .who b { display: block; font: 24px var(--sh-px); color: var(--sh-ink); font-weight: 400; margin-bottom: 4px; }
  @media (max-width: 760px) { .who { display: none; } }
</style>
</head>
<body data-sh-pill="off">
<div class="sh-hd" data-sh-header></div>
<section class="stage" data-stage>
  <canvas class="sky"></canvas>
  <p class="who"><b>にしな的歌詞與 Live</b>日文歌翻譯、完整 Live、Setlist、日記。打開這支手機到處逛逛。</p>
  <div class="room"><div><div data-n247i></div></div></div>
  <p class="escape">沒時間玩？直接看 <a href="/translations">最新翻譯</a> · <a href="/live/full/">完整 Live</a> · 或用上面的選單</p>
</section>
<script src="/js/n247i.js"></script>
<script src="stage.js"></script>
</body>
</html>
