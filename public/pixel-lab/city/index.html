<style>
  @font-face{font-family:'PX-ZH';src:url('/fonts/pixel/fp12-site-zh_hant.woff2') format('woff2');font-display:swap}
  @font-face{font-family:'PX-JA';src:url('/fonts/pixel/fp12-site-ja.woff2') format('woff2');font-display:swap}
  @font-face{font-family:'openhuninn';src:url('/fonts/openhuninn-site.woff2') format('woff2');font-display:swap}
  :root{--bg:#0a0a15;--panel:#141d31;--panel-2:#1a2440;--line:#243154;--text:#e8ecf6;--dim:#8b97b8;
    --accent:#3d63ff;--gold:#e8c94a;--red:#d65555;
    --px:'PX-ZH','PX-JA',"Noto Sans TC",sans-serif;--body:'openhuninn',"Noto Sans TC",sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--px);overflow:hidden}
  #stage{position:fixed;inset:0}
  #stage canvas{image-rendering:pixelated;display:block}
  .site-topbar{position:fixed;top:0;left:0;right:0;z-index:20;height:57px;background:rgba(10,10,21,.78);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .site-topbar-inner{max-width:1400px;margin:0 auto;padding:0 24px;height:100%;display:flex;align-items:center;gap:14px}
  .site-topbar a{color:var(--text);font-size:24px;text-decoration:none}
  .site-topbar a.crumb{color:var(--dim);font-size:12px}
  #title{position:fixed;top:76px;left:28px;z-index:10;pointer-events:none}
  #title .pn{font-size:12px;color:var(--dim);letter-spacing:.3em}
  #title h1{font-size:36px;font-weight:400;letter-spacing:.14em;margin:6px 0 4px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
  #title .ps{font-size:12px;color:var(--dim);letter-spacing:.15em}
  #legend{position:fixed;left:28px;bottom:84px;z-index:10;display:flex;flex-direction:column;gap:6px;font-size:12px}
  #legend div{display:flex;align-items:center;gap:8px;color:var(--dim);cursor:pointer}
  #legend div:hover{color:var(--text)}
  #legend i{display:inline-block;width:12px;height:12px}
  #panel{position:fixed;top:76px;right:24px;width:320px;max-height:calc(100vh - 170px);z-index:10;
    background:rgba(20,29,49,.92);border:2px solid var(--line);
    clip-path:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),
      calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px));
    padding:18px 20px;overflow-y:auto}
  #panel .hd{font-size:12px;color:var(--dim);letter-spacing:.2em;margin-bottom:10px}
  #panel .hd b{color:var(--red);font-weight:400}
  #panel h2{font-family:'PX-JA','PX-ZH',sans-serif;font-weight:400;font-size:24px;line-height:1.3;margin:4px 0 8px}
  #panel .meta{font-size:12px;color:var(--dim);line-height:2}
  #panel .cover{width:100%;aspect-ratio:1;object-fit:cover;border:2px solid var(--line);margin:10px 0;display:block;image-rendering:pixelated}
  #panel .body{font-family:var(--body);font-size:16px;line-height:1.9;color:#ccd5ea;margin-top:8px}
  #panel .rel{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  #panel .rel .lb{font-size:12px;color:var(--gold);letter-spacing:.15em;margin-bottom:6px}
  #panel .rel a{display:block;font-family:var(--body);font-size:15px;color:var(--text);text-decoration:none;padding:4px 0;cursor:pointer}
  #panel .rel a:hover{color:var(--gold)}
  #panel .rel small{color:var(--dim);font-family:var(--px);font-size:12px;margin-left:8px}
  #panel .lyric{font-family:'DotGothic16','PX-JA',sans-serif;font-size:14px;color:#b6c2e0;line-height:1.8;margin-top:8px;border-left:2px solid var(--line);padding-left:10px}
  .pxbtn{font-family:var(--px);font-size:12px;color:var(--text);background:var(--panel-2);border:2px solid var(--line);
    padding:8px 16px;cursor:pointer;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.5));
    clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),
      calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
    text-decoration:none;display:inline-block;line-height:1.4}
  .pxbtn:hover{color:var(--gold);border-color:var(--gold)}
  .pxbtn.on{color:var(--gold);border-color:var(--gold)}
  .pxbtn:active{transform:translate(3px,3px);filter:none}
  .pxbtn.go{background:var(--accent);border-color:#2a49c9;color:#fff;margin-top:12px}
  .pxbtn.go:hover{color:var(--gold)}
  #modes{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:10;display:flex;gap:10px}
  #tour{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:10;display:none;align-items:center;gap:14px;
    background:rgba(20,29,49,.9);border:2px solid var(--gold);padding:10px 18px;font-size:12px}
  #tour.on{display:flex}
  #tour .cap{font-family:'PX-JA','PX-ZH',sans-serif;font-size:12px;max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #tour .pg{color:var(--gold);font-variant-numeric:tabular-nums}
  #hover{position:fixed;z-index:15;pointer-events:none;transform:translate(-50%,-120%);background:rgba(10,10,21,.92);
    border:2px solid var(--gold);padding:5px 10px;font-size:12px;display:none;white-space:nowrap}
  #hover b{font-family:'PX-JA','PX-ZH',sans-serif;font-weight:400;font-size:12px}
  #hint{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:9;font-size:12px;color:#5a6784;padding:4px}
  #loading{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;
    font-size:24px;letter-spacing:.3em;color:var(--gold)}
  @media(max-width:760px){
    #panel{top:auto;bottom:0;right:0;left:0;width:auto;max-height:42vh;border-left:none;border-right:none;border-bottom:none;clip-path:none}
    #modes{bottom:auto;top:66px;right:12px;left:auto;transform:none;flex-direction:column}
    #legend{display:none} #title h1{font-size:24px} #hint{display:none}
    #tour{bottom:44vh}
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>

<body>
<div id="loading">LOADING CITY…</div>
<div id="stage"></div>
<header class="site-topbar"><div class="site-topbar-inner">
  <a href="/">Derek's Site</a><a class="crumb" href="/pixel-lab/">/ Pixel Lab</a><a class="crumb" href="#">/ IV 歌詞之城 (提案 prototype)</a>
</div></header>
<div id="title"><div class="pn">地球 — NISHINA SOLAR SYSTEM</div><h1>歌詞之城</h1><div class="ps">LYRIC CITY · PROTOTYPE</div></div>
<div id="legend"></div>
<div id="panel">
  <div class="hd">CITY LOG <b>● LIVE</b></div>
  <div id="pbody"><div class="meta">讀取 /annotate/lyrics.json…</div></div>
</div>
<div id="tour"><button class="pxbtn" id="tourPause">⏸</button><span class="cap" id="tourCap"></span><span class="pg" id="tourPg"></span><button class="pxbtn" id="tourExit">離開</button></div>
<div id="modes">
  <button class="pxbtn on" id="mOverview">全景</button>
  <button class="pxbtn" id="mTour">時間導覽</button>
  <a class="pxbtn" href="/translations/">清單</a>
</div>
<div id="hover"></div>
<div id="hint">拖曳旋轉・滾輪縮放・點一棟樓</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- 資料 (站內公開 JSON, 即時讀) ---------- */
const data = await (await fetch('/annotate/lyrics.json')).json();
const SONGS = data.songs.filter(s => /にしな/.test(s.artist || "")).map(s => ({
  ...s,
  album: s.album || '單曲',
  year: Number(s.album_year) || Number((s.publish_date || '').slice(0, 4)) || 2024,
  track: Number(s.track_number) || 99,
  lines: Array.isArray(s.lyric_lines) ? s.lyric_lines : [],
  n: Number(s.lyric_line_count) || (Array.isArray(s.lyric_lines) ? s.lyric_lines.length : 0),
}));

/* 城區 = 專輯, 依年份排序; 色盤依序指派 (像素調, 全部原創) */
const byAlbum = {};
SONGS.forEach(s => (byAlbum[s.album] ||= []).push(s));
const ORDER_AL = Object.keys(byAlbum).sort((a, b) =>
  Math.min(...byAlbum[a].map(s => s.year)) - Math.min(...byAlbum[b].map(s => s.year)) || byAlbum[b].length - byAlbum[a].length);
const COLORS = [
  { base: 0x3aa981, roof: 0x9fe8cf }, { base: 0x3d63ff, roof: 0x9fb6ff }, { base: 0xe8c94a, roof: 0xfff0a8 },
  { base: 0xe1518e, roof: 0xffb3d1 }, { base: 0x8a63c9, roof: 0xcfb6ff }, { base: 0xe08a3a, roof: 0xffd2a8 },
  { base: 0x4fb8d6, roof: 0xb6ecf7 }, { base: 0x8b97b8, roof: 0xd0d8ea },
];
const PAL = {};
ORDER_AL.forEach((a, i) => {
  const ys = byAlbum[a].map(s => s.year), y0 = Math.min(...ys), y1 = Math.max(...ys);
  PAL[a] = { ...COLORS[i % COLORS.length], name: a, yr: y0 === y1 ? String(y0) : `${y0}–${y1}` };
});

/* 關聯線 = 歌詞字元 2-gram Jaccard top-3 (prototype; 正式版接歌詞宇宙主題網) */
const grams = s => {
  const t = s.lines.map(l => l.ja || '').join('').replace(/[\s、。！？!?「」『』（）()・…\-〜~]/g, '');
  const g = new Set(); for (let i = 0; i < t.length - 1; i++) g.add(t.slice(i, i + 2)); return g;
};
const G = SONGS.map(grams);
const jac = (a, b) => { let n = 0; for (const x of a) if (b.has(x)) n++; return n / (a.size + b.size - n || 1); };
const REL = SONGS.map((s, i) => SONGS.map((t, j) => [i === j ? -1 : jac(G[i], G[j]), j])
  .filter(([v]) => v > 0.06).sort((a, b) => b[0] - a[0]).slice(0, 3));

/* ---------- 場景 ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(0.5);                       // 半解析度 + CSS pixelated → 像素感
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.BasicShadowMap;
$('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a15);
scene.fog = new THREE.Fog(0x0a0a15, 70, 160);
const VIEW = 26;
const camera = new THREE.OrthographicCamera(-VIEW, VIEW, VIEW, -VIEW, 1, 400);
camera.position.set(60, 60, 60);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.maxPolarAngle = Math.PI * .45; controls.minPolarAngle = Math.PI * .15;
controls.minZoom = .6; controls.maxZoom = 3.5; controls.enablePan = true;
scene.add(new THREE.HemisphereLight(0x9fb6ff, 0x1a1030, .9));
const sun = new THREE.DirectionalLight(0xfff0c8, 1.1);
sun.position.set(30, 50, 20); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, far: 200 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.MeshLambertMaterial({ color: 0x0e1526 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
scene.add(new THREE.GridHelper(240, 120, 0x1a2440, 0x141d31));

/* ---------- 城區排版: 專輯依年份排成弧線, 區內方格; 樓高 ∝ 歌詞行數 ---------- */
const BUILDINGS = []; const CELL = 3.2;
ORDER_AL.forEach((al, ai) => {
  const list = byAlbum[al].slice().sort((a, b) => a.track - b.track);
  const cols = Math.ceil(Math.sqrt(list.length)), rows = Math.ceil(list.length / cols);
  const span = Math.PI * 1.1, ang = -Math.PI * .55 + (ORDER_AL.length > 1 ? ai * span / (ORDER_AL.length - 1) : 0);
  const R = 24, cx = Math.cos(ang) * R, cz = Math.sin(ang) * R * .7;
  const pal = PAL[al];
  // 區塊地基 (微亮一塊)
  const pad = new THREE.Mesh(new THREE.BoxGeometry(cols * CELL + 1.6, .3, rows * CELL + 1.6),
    new THREE.MeshLambertMaterial({ color: 0x141d31 }));
  pad.position.set(cx, .15, cz); pad.receiveShadow = true; scene.add(pad);
  list.forEach((s, i) => {
    const gx = (i % cols) - (cols - 1) / 2, gz = Math.floor(i / cols) - (rows - 1) / 2;
    const x = cx + gx * CELL, z = cz + gz * CELL;
    const h = s.instrumental || !s.n ? 1.2 : Math.max(1.5, s.n / 4.5);
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(2, h, 2), new THREE.MeshLambertMaterial({ color: pal.base }));
    body.position.y = h / 2 + .3; body.castShadow = true; body.receiveShadow = true; g.add(body);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(1.4, .5, 1.4), new THREE.MeshLambertMaterial({ color: pal.roof }));
    roof.position.y = h + .55; g.add(roof);
    const wm = new THREE.MeshBasicMaterial({ color: 0xfff6d0 });
    for (let w = 0; w < Math.min(9, Math.floor(h)); w++) {
      if ((w * 7 + i * 3) % 4 === 0) continue;
      const win = new THREE.Mesh(new THREE.BoxGeometry(.3, .3, .06), wm);
      win.position.set(-.5 + (w % 2), 1.1 + w * .9, 1.03); g.add(win);
    }
    g.position.set(x, 0, z);
    g.userData = { song: s, idx: BUILDINGS.length, h, pal, body, roof };
    scene.add(g); BUILDINGS.push(g);
  });
});
$('legend').innerHTML = ORDER_AL.map(a =>
  `<div data-al="${esc(a)}"><i style="background:#${PAL[a].base.toString(16).padStart(6, '0')}"></i>${esc(a)} (${PAL[a].yr}) · ${byAlbum[a].length} 棟</div>`).join('');
$('legend').querySelectorAll('[data-al]').forEach(el => el.onclick = () => {
  const list = byAlbum[el.dataset.al]; const c = new THREE.Vector3();
  BUILDINGS.filter(b => list.includes(b.userData.song)).forEach(b => c.add(b.position));
  camTarget = c.multiplyScalar(1 / list.length); flashDistrict(el.dataset.al);
});

/* ---------- 互動 ---------- */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const hoverEl = $('hover'), pbody = $('pbody');
let hovered = null, selected = null, camTarget = null;
const lineGroup = new THREE.Group(); scene.add(lineGroup);
const BODIES = BUILDINGS.map(b => b.userData.body);
function pick(ev) {
  if (ev.target !== renderer.domElement) return null;
  ptr.x = (ev.clientX / innerWidth) * 2 - 1; ptr.y = -(ev.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(BODIES);
  return hit.length ? BUILDINGS[hit[0].object.parent.userData.idx] : null;
}
addEventListener('pointermove', ev => {
  const b = pick(ev);
  if (b !== hovered) { hovered = b; document.body.style.cursor = b ? 'pointer' : 'default'; }
  if (b) {
    const s = b.userData.song;
    hoverEl.style.display = 'block'; hoverEl.style.left = ev.clientX + 'px'; hoverEl.style.top = ev.clientY + 'px';
    hoverEl.innerHTML = `<b>${esc(s.title)}</b> · ${s.n} 行`;
  } else hoverEl.style.display = 'none';
});
let downAt = 0, downX = 0, downY = 0;
addEventListener('pointerdown', ev => { downAt = Date.now(); downX = ev.clientX; downY = ev.clientY; });
addEventListener('pointerup', ev => {
  if (Date.now() - downAt < 260 && Math.hypot(ev.clientX - downX, ev.clientY - downY) < 6) {
    const b = pick(ev); if (b) { select(b.userData.idx); flyTo(b.userData.idx); }
  }
});
function paint(idx) {
  BUILDINGS.forEach((b, i) => {
    const on = idx == null || i === idx || REL[idx].some(([, j]) => j === i);
    b.userData.body.material.color.set(on ? b.userData.pal.base : 0x1f2a44);
    b.userData.roof.material.color.set(i === idx ? 0xffffff : on ? b.userData.pal.roof : 0x2a3657);
  });
}
function flashDistrict(al) {
  BUILDINGS.forEach(b => { const on = b.userData.song.album === al;
    b.userData.body.material.color.set(on ? b.userData.pal.base : 0x1f2a44);
    b.userData.roof.material.color.set(on ? b.userData.pal.roof : 0x2a3657); });
  setTimeout(() => { if (selected == null) paint(null); }, 1400);
}
function select(idx) {
  selected = idx; lineGroup.clear(); paint(idx);
  const from = BUILDINGS[idx], fh = from.userData.h + .3;
  const mat = new THREE.LineBasicMaterial({ color: 0xe8c94a });
  REL[idx].forEach(([v, j]) => {
    const to = BUILDINGS[j], th = to.userData.h + .3;
    const a = from.position.clone().setY(fh + .6), c = to.position.clone().setY(th + .6);
    const mid = a.clone().add(c).multiplyScalar(.5).setY(Math.max(fh, th) + 4 + v * 24);
    const pts = new THREE.QuadraticBezierCurve3(a, mid, c).getPoints(28);
    lineGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
  });
  const s = from.userData.song, pal = from.userData.pal;
  const firstLine = s.lines.find(l => l.ja);
  pbody.innerHTML = `
    <h2>${esc(s.title)}</h2>
    <div class="meta">${esc(pal.name)} (${pal.yr})${s.track !== 99 ? ' · Track ' + s.track : ''}<br>
      ${s.publish_date ? esc(s.publish_date) + ' 發行 · ' : ''}${s.instrumental ? '器樂曲' : s.n + ' 行歌詞'}</div>
    ${s.cover_image ? `<img class="cover" src="${esc(s.cover_image)}" alt="" onerror="this.remove()">` : ''}
    ${firstLine ? `<div class="lyric">${esc(firstLine.ja)}<br><span style="color:#8b97b8">${esc(firstLine.zh || '')}</span></div>` : ''}
    <div class="rel"><div class="lb">歌詞相近的樓</div>
      ${REL[idx].map(([v, j]) => `<a data-j="${j}">${esc(BUILDINGS[j].userData.song.title)}<small>${Math.round(v * 100)}%</small></a>`).join('')
        || '<div class="meta">(獨棟, 無近鄰)</div>'}
    </div>
    <a class="pxbtn go" href="/translations/${esc(s.id)}/">進入這棟 → 翻譯頁</a>`;
  pbody.querySelectorAll('a[data-j]').forEach(a => a.onclick = () => { select(+a.dataset.j); flyTo(+a.dataset.j); });
}
function overview() {
  selected = null; lineGroup.clear(); paint(null);
  pbody.innerHTML = `
    <h2>城市概況</h2>
    <div class="meta">${BUILDINGS.length} 棟歌 · ${ORDER_AL.length} 個城區 (專輯) · ${REL.reduce((n, r) => n + r.length, 0)} 條關聯線</div>
    <div class="body">每一棟樓是一首歌,城區是專輯,樓高是歌詞行數。點一棟樓:跟它歌詞相近的樓會亮起並拉線;「時間導覽」沿發行順序飛過全城;點左下城區名可跳到該區。</div>
    <div class="rel"><div class="lb">依據 (prototype)</div>
      <div class="meta">樓高 = 歌詞行數 (正式版換 shorts 觀看總數)<br>關聯線 = 歌詞 2-gram 相似度 top-3 (正式版接歌詞宇宙主題網)<br>資料 = /annotate/lyrics.json 即時讀取<br>渲染 = three.js 半解析度 + 方塊陰影 (像素化)</div></div>`;
}
function flyTo(idx) { camTarget = BUILDINGS[idx].position.clone(); }

/* ---------- 時間導覽 (依發行日) ---------- */
const tourEl = $('tour'), cap = $('tourCap'), pg = $('tourPg');
const TOUR = BUILDINGS.map((b, i) => i).sort((a, b) =>
  (BUILDINGS[a].userData.song.publish_date || '9999').localeCompare(BUILDINGS[b].userData.song.publish_date || '9999')
  || BUILDINGS[a].userData.song.track - BUILDINGS[b].userData.song.track);
let tourI = -1, tourTimer = null, tourPaused = false;
function tourStep() {
  tourI = (tourI + 1) % TOUR.length;
  const idx = TOUR[tourI], s = BUILDINGS[idx].userData.song;
  select(idx); flyTo(idx);
  cap.textContent = `${s.publish_date || '—'}  ${s.title}`;
  pg.textContent = `${String(tourI + 1).padStart(2, '0')} / ${TOUR.length}`;
}
function startTour() {
  tourEl.classList.add('on'); setMode('mTour'); tourI = -1; tourPaused = false; $('tourPause').textContent = '⏸';
  tourStep(); tourTimer = setInterval(() => { if (!tourPaused) tourStep(); }, 2600);
}
function stopTour() { clearInterval(tourTimer); tourTimer = null; tourEl.classList.remove('on'); setMode('mOverview'); overview(); camTarget = new THREE.Vector3(0, 0, 0); }
$('tourPause').onclick = e => { tourPaused = !tourPaused; e.target.textContent = tourPaused ? '▶' : '⏸'; };
$('tourExit').onclick = stopTour;
$('mTour').onclick = startTour;
$('mOverview').onclick = () => { if (tourTimer) stopTour(); else { overview(); camTarget = new THREE.Vector3(0, 0, 0); } };
function setMode(id) { ['mOverview', 'mTour'].forEach(m => $(m).classList.toggle('on', m === id)); }

/* ---------- 迴圈 ---------- */
function fit() {
  const a = innerWidth / innerHeight;
  camera.left = -VIEW * a; camera.right = VIEW * a; camera.top = VIEW; camera.bottom = -VIEW;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', fit); fit();
function frame() {
  if (camTarget) {
    const d = camTarget.clone().sub(controls.target);
    controls.target.add(d.multiplyScalar(.07)); camera.position.add(d);
    if (controls.target.distanceTo(camTarget) < .05) camTarget = null;
  }
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(frame);
}
overview(); frame();
$('loading').remove();
</script>
</body>
