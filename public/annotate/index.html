<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>にしな Shorts 歌詞標注工具</title>
<style>
  :root{
    --bg:#0c1322; --panel:#141d31; --panel-2:#1a2440; --line:#243154;
    --text:#e8ecf6; --dim:#8b97b8; --accent:#3d63ff; --accent-soft:#2b3f86;
    --ok:#39c07f; --warn:#e2b03a; --danger:#e05656; --hint:#8a5cf6;
    --mono:"SFMono-Regular",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Hiragino Sans",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

  header{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);flex-shrink:0}
  header h1{font-size:15px;font-weight:600;letter-spacing:.04em}
  header .stats{font-size:12px;color:var(--dim)}
  header .spacer{flex:1}
  button{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent)}
  button.ghost{background:transparent}

  main{display:grid;grid-template-columns:270px 400px 1fr;flex:1;min-height:0}

  /* ── 佇列欄 ── */
  #queuePanel{border-right:1px solid var(--line);overflow-y:auto;padding:10px}
  .song-group{margin-bottom:6px}
  .song-group>.song-title{font-size:12.5px;font-weight:600;color:var(--dim);padding:6px 8px;cursor:pointer;border-radius:6px}
  .song-group>.song-title:hover{background:var(--panel)}
  .short-item{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12px}
  .short-item:hover{background:var(--panel)}
  .short-item.active{background:var(--accent-soft)}
  .short-item img{width:34px;height:60px;object-fit:cover;border-radius:5px;flex-shrink:0}
  .short-item .t{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
  .short-item .vc{color:var(--dim);font-size:10.5px}
  .badge{font-size:10px;padding:1.5px 6px;border-radius:99px;flex-shrink:0}
  .badge.done{background:rgba(57,192,127,.15);color:var(--ok)}
  .badge.skip{background:rgba(226,176,58,.15);color:var(--warn)}

  /* ── 播放器欄 ── */
  #playerPanel{border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:10px;overflow-y:auto}
  #player{width:100%;aspect-ratio:9/16;max-height:56vh;background:#000;border-radius:12px}
  #nowTitle{font-size:12.5px;color:var(--dim);line-height:1.5}
  #playerError{font-size:12px;color:var(--danger);min-height:14px;line-height:1.5}
  #songPicker{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
  #songPicker label{font-size:12px;color:var(--dim);flex-shrink:0}
  #songSelect{flex:1;background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-family:inherit;font-size:13px}
  #songSelect:focus{outline:1px solid var(--accent);border-color:var(--accent)}
  .short-item .method{font-size:9.5px;color:var(--dim);padding:0 4px;border-radius:3px;background:var(--panel-2);display:inline-block;margin-top:2px}
  .short-item .method.hashtag{color:var(--ok)}
  .short-item .method.lyric_match{color:var(--accent)}
  .short-item .method.review{color:var(--warn)}
  .short-item .method.out_of_catalog{color:var(--hint)}
  .short-item .method.non_song{color:var(--danger)}
  .song-group.unmatched>.song-title{color:var(--warn)}
  .song-group.collapsed .short-item{display:none}

  /* 版本類型 chip 選擇器 */
  #versionPicker{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0}
  #versionPicker .label{font-size:12px;color:var(--dim);margin-right:4px}
  .v-chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit}
  .v-chip:hover{border-color:var(--accent)}
  .v-chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
  .v-chip-inst.active{background:rgba(138,92,246,.22);border-color:var(--hint);color:var(--text)}
  .v-sep{color:var(--dim);margin:0 2px;user-select:none;font-size:12px}

  /* GitHub 同步 UI */
  header .stats.sync{cursor:default}
  header .stats.sync[data-state="dirty"]{color:var(--warn)}
  header .stats.sync[data-state="saved"]{color:var(--ok)}
  header .stats.sync[data-state="saving"]{color:var(--accent)}
  header .stats.sync[data-state="error"]{color:var(--danger)}
  button.gh{background:linear-gradient(180deg,#2ea043,#22863a);border-color:#22863a;color:#fff}
  button.gh:hover{background:linear-gradient(180deg,#37b048,#2ea043)}
  button.gh:disabled{opacity:.5;cursor:not-allowed}
  #settingsPanel{position:absolute;top:52px;right:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:100;width:320px}
  #settingsPanel[hidden]{display:none}
  #settingsPanel label{font-size:12px;color:var(--dim);display:block;margin-bottom:4px}
  #settingsPanel input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;font-family:var(--mono);font-size:12px}
  #settingsPanel .row{display:flex;gap:8px;margin-top:8px}
  #settingsPanel .hint{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.5}
  .short-item .vt{font-size:10.5px;color:var(--accent);padding:0 4px}
  #timeRow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px}
  #curTime{color:var(--accent);font-size:17px;font-weight:600}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  .controls button{padding:6px 10px;font-size:12px}
  #anchorList{display:flex;flex-direction:column;gap:5px}
  .anchor-row{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}
  .anchor-row .at{font-family:var(--mono);color:var(--accent);cursor:pointer;min-width:52px}
  .anchor-row .al{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .anchor-row .del{color:var(--danger);cursor:pointer;background:none;border:none;font-size:14px;padding:0 4px}
  .done-row{display:flex;gap:8px;margin-top:4px}

  /* ── 歌詞欄 ── */
  #lyricsPanel{overflow-y:auto;padding:14px 18px}
  #lyricsPanel .song-head{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--dim)}
  .lyr{padding:9px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;position:relative;margin-bottom:2px}
  .lyr:hover{background:var(--panel);border-color:var(--line)}
  .lyr .ja{font-size:15px;line-height:1.55}
  .lyr .zh{font-size:12px;color:var(--dim);margin-top:2px}
  .lyr .idx{position:absolute;right:10px;top:9px;font-family:var(--mono);font-size:10px;color:var(--dim);opacity:.6}
  .lyr.hint{border-color:var(--hint)}
  .lyr.hint::before{content:"標題句?";position:absolute;right:8px;bottom:7px;font-size:10px;color:var(--hint)}
  .lyr.anchored{border-left:3px solid var(--accent)}
  .lyr.playing{background:var(--accent-soft);border-color:var(--accent)}

  #dropzone{position:fixed;inset:0;background:rgba(12,19,34,.96);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;z-index:50}
  #dropzone.hidden{display:none}
  #dropzone p{color:var(--dim);font-size:14px;max-width:460px;text-align:center;line-height:1.7}
  kbd{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-family:var(--mono);font-size:11px}
  footer{padding:6px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dim);flex-shrink:0}
</style>
</head>
<body>

<header>
  <h1>にしな Shorts 歌詞標注</h1>
  <span class="stats" id="progress">—</span>
  <span class="stats sync" id="syncStatus" data-state="idle">—</span>
  <span class="spacer"></span>
  <button class="ghost" id="settingsBtn" title="設定 GitHub token">⚙</button>
  <button class="ghost" id="importBtn">匯入</button>
  <button class="ghost" id="exportBtn">匯出 JSON</button>
  <button class="gh" id="saveGhBtn" title="推到 GitHub develop 分支">☁ 存到 GitHub</button>
</header>

<div id="settingsPanel" hidden>
  <label for="tokenInput">GitHub Personal Access Token</label>
  <input type="password" id="tokenInput" placeholder="github_pat_...">
  <div class="row">
    <button class="primary" id="tokenSaveBtn" style="flex:1">存 token</button>
    <button id="tokenClearBtn">清除</button>
    <button id="settingsCloseBtn">關閉</button>
  </div>
  <div class="hint">Token 存在本瀏覽器 localStorage,不會離開你的機器。存了之後右上「☁ 存到 GitHub」就會亮。</div>
</div>

<main>
  <nav id="queuePanel"></nav>

  <section id="playerPanel">
    <div id="player"></div>
    <div id="nowTitle">尚未選擇 short</div>
    <div id="playerError"></div>
    <div id="versionPicker"></div>
    <div id="timeRow"><span id="curTime">0.00</span><span style="color:var(--dim)">s</span></div>
    <div class="controls">
      <button data-seek="-2">−2s</button>
      <button data-seek="-0.5">−0.5s</button>
      <button id="playBtn">播放/暫停 <kbd>space</kbd></button>
      <button data-seek="0.5">+0.5s</button>
      <button data-seek="2">+2s</button>
    </div>
    <div style="font-size:12px;color:var(--dim)">點右側歌詞任一句 = 在目前時間打一個 anchor</div>
    <div id="anchorList"></div>
    <div class="done-row">
      <button class="primary" id="doneBtn" style="flex:1">完成,下一支 <kbd>enter</kbd></button>
      <button id="skipBtn">略過</button>
    </div>
  </section>

  <section id="lyricsPanel"><div class="song-head">從左側選一支 short 開始</div></section>
</main>

<footer>快捷鍵: <kbd>space</kbd> 播放/暫停 · <kbd>←</kbd><kbd>→</kbd> ±2 秒 · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> 選版本 · <kbd>i</kbd> 純演奏 · <kbd>enter</kbd> 完成並跳下一支</footer>

<div id="dropzone">
  <p><b>載入資料</b><br>把 <code>annotation_queue.json</code> 和 <code>lyrics.json</code> 一起拖進來,<br>或用 <code>python -m http.server</code> 啟動後放同目錄自動載入。</p>
  <input type="file" id="filePick" multiple accept=".json">
</div>

<script>
/* ============================================================
   にしな Shorts 歌詞標注工具 — 單檔版
   資料流: annotation_queue.json + lyrics.json → 人工標 anchors
   → 匯出 { videoId: { songId, anchors:[{t,line}], status } }
   ============================================================ */

const S = {                       // 全域狀態
  queue: null,                    // annotation_queue.json 的 queue 物件
  songs: {},                      // songId -> song(含 lyric_lines)
  songList: [],                   // 排序過的 songs 陣列(供 <select> 用)
  ann: {},                        // videoId -> {songId, anchors, status}
  cur: null,                      // 目前的 short item
  player: null, ready: false, timer: null,
  pendingLoad: null,              // 若 player 尚未 ready,先暫存 videoId
};
const UNMATCHED_KEY = '__unmatched';
const METHOD_LABEL = {
  hashtag:'#tag', lyric_match:'歌詞', review:'低信心',
  out_of_catalog:'庫外', non_song:'非歌',
};
// 版本類型:{ key, 顯示文字, 縮寫(佇列側欄) }
const VERSION_TYPES = [
  { key:'mv',       label:'官方MV',    short:'MV'  },
  { key:'live',     label:'演唱會LIVE', short:'LIVE'},
  { key:'acoustic', label:'弾き語り',   short:'弾語'},
  { key:'other',    label:'其他',      short:'他'  },
];

/* ---------- 儲存 (localStorage 有 try/catch 保護) ---------- */
const LS_KEY = 'nishina-annotator-v1';
const LS_DIRTY_KEY = 'nishina-annotator-dirty-v1';
const LS_TOKEN_KEY = 'nishina-annotator-gh-token';
S.dirty = new Set();       // videoIds 有未存到 GitHub 的變更

function persist(dirtyKeys){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(S.ann));
    if(dirtyKeys){
      (Array.isArray(dirtyKeys) ? dirtyKeys : [dirtyKeys]).forEach(k => S.dirty.add(k));
    }
    // S.cur 若存在, 認定它就是 dirty (最常見的情況)
    if(!dirtyKeys && S.cur) S.dirty.add(S.cur.videoId);
    localStorage.setItem(LS_DIRTY_KEY, JSON.stringify([...S.dirty]));
  }catch(e){}
  updateSyncStatus();
}
function restore(){
  try{
    const x = localStorage.getItem(LS_KEY); if(x) S.ann = JSON.parse(x);
    const d = localStorage.getItem(LS_DIRTY_KEY); if(d) S.dirty = new Set(JSON.parse(d));
  }catch(e){}
}

/* ---------- GitHub 同步 ---------- */
const GH = {
  owner: 'dereknir',
  repo: 'NCA',
  path: 'annotation/shorts_anchors.json',
  branch: 'develop',
  sha: null,       // 目前遠端檔案的 sha (寫入時要用)
  baseline: null,  // 上次從 GitHub 讀到的內容 (用來 merge)
  syncedAt: null,
};
function getToken(){ try{ return localStorage.getItem(LS_TOKEN_KEY) || ''; }catch(e){ return ''; } }
function setToken(v){ try{ if(v) localStorage.setItem(LS_TOKEN_KEY, v); else localStorage.removeItem(LS_TOKEN_KEY); }catch(e){} }

/* base64 <-> UTF-8 (safe for large 中日文 strings) */
function utf8ToBase64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const CHUNK = 8192;
  for(let i=0; i<bytes.length; i+=CHUNK){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CHUNK));
  }
  return btoa(bin);
}
function base64ToUtf8(b64){
  const bin = atob(b64.replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for(let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

async function fetchBaseline(){
  const t = getToken();
  const headers = { 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' };
  if(t) headers['Authorization'] = `Bearer ${t}`;
  const url = `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}?ref=${GH.branch}`;
  const resp = await fetch(url, { headers });
  if(!resp.ok) throw new Error('GitHub read failed: '+resp.status);
  const data = await resp.json();
  GH.sha = data.sha;
  GH.baseline = JSON.parse(base64ToUtf8(data.content));
  GH.syncedAt = new Date();
  // Merge: 非 dirty 的 videoId 一律採用 baseline; dirty 的保留本地 (使用者未存的變更)
  for(const [vid, entry] of Object.entries(GH.baseline)){
    if(!S.dirty.has(vid)) S.ann[vid] = entry;
  }
  // Baseline 裡沒有但本地有 且非 dirty → 是舊 session 殘留, 也還原成 baseline (即移除)
  for(const vid of Object.keys(S.ann)){
    if(!(vid in GH.baseline) && !S.dirty.has(vid)) delete S.ann[vid];
  }
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S.ann)); }catch(e){}
  updateSyncStatus();
}

async function saveToGitHub(){
  const t = getToken();
  if(!t){ alert('請先在右上 ⚙ 貼上 GitHub token'); return; }
  if(GH.sha === null){
    if(!confirm('尚未拉過遠端 baseline, 直接覆寫可能蓋掉他人變更, 確定?')) return;
  }
  const btn = document.getElementById('saveGhBtn');
  const oldLabel = btn.textContent;
  btn.disabled = true;
  setSyncStatus('saving', '存檔中...');
  try{
    const content = JSON.stringify(S.ann, null, 2);
    const body = {
      message: `Annotate ${S.dirty.size} short(s) via /annotate/`,
      content: utf8ToBase64(content),
      branch: GH.branch,
    };
    if(GH.sha) body.sha = GH.sha;
    const resp = await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${t}`,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(body),
    });
    if(resp.status === 409){
      setSyncStatus('error', '衝突');
      alert('遠端有新變動, 請重新整理頁面拿最新 baseline 再存一次');
      return;
    }
    if(!resp.ok){
      const err = await resp.text();
      setSyncStatus('error', 'HTTP '+resp.status);
      alert('存到 GitHub 失敗: '+resp.status+'\n'+err.slice(0,200));
      return;
    }
    const data = await resp.json();
    GH.sha = data.content.sha;
    GH.baseline = JSON.parse(content);
    GH.syncedAt = new Date();
    S.dirty.clear();
    try{ localStorage.setItem(LS_DIRTY_KEY, '[]'); }catch(e){}
    setSyncStatus('saved', '已同步 · '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    setSyncStatus('error', '網路錯誤');
    alert('存到 GitHub 失敗: '+e.message);
  }finally{
    btn.disabled = false;
    btn.textContent = oldLabel;
  }
}

function setSyncStatus(state, text){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.dataset.state = state;
  el.textContent = text;
}
function updateSyncStatus(){
  const n = S.dirty.size;
  if(!getToken()){ setSyncStatus('idle', '未設 token'); return; }
  if(n === 0){
    setSyncStatus('saved', GH.syncedAt ? '已同步' : '尚未載入 GitHub');
  }else{
    setSyncStatus('dirty', `${n} 筆未存`);
  }
}

/* ---------- 資料載入: fetch 優先,失敗顯示拖放區 ---------- */
async function boot(){
  restore();
  updateSyncStatus();
  // 若已設 token, 從 GitHub 拉最新 baseline 蓋在 localStorage 之上 (非 dirty 部分)
  if(getToken()){
    fetchBaseline().then(() => renderQueue?.()).catch(err => {
      console.warn('[boot] baseline fetch failed:', err);
      setSyncStatus('error', 'baseline 讀取失敗');
    });
  }
  try{
    const [q, l] = await Promise.all([
      fetch('annotation_queue.json').then(r=>r.json()),
      fetch('lyrics.json').then(r=>r.json()),
    ]);
    initData(q, l);
    document.getElementById('dropzone').classList.add('hidden');
  }catch(e){ /* 留在拖放畫面 */ }
}
function initData(queueFile, lyricsFile){
  S.queue = queueFile.queue;
  for(const s of lyricsFile.songs) S.songs[s.id] = s;
  S.songList = lyricsFile.songs
    .filter(s => !s.instrumental)
    .sort((a,b)=> (a.album||'').localeCompare(b.album||'') || (a.track_number||99)-(b.track_number||99));
  renderQueue(); updateProgress();
}
document.getElementById('filePick').addEventListener('change', async ev=>{
  let q=null, l=null;
  for(const f of ev.target.files){
    const j = JSON.parse(await f.text());
    if(j.queue) q=j; else if(j.songs) l=j;
  }
  if(q&&l){ initData(q,l); document.getElementById('dropzone').classList.add('hidden'); }
  else alert('需要同時選 annotation_queue.json 和 lyrics.json');
});

/* ---------- YouTube IFrame API ---------- */
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);
window.onYouTubeIframeAPIReady = () => {
  S.player = new YT.Player('player', {
    width:'100%', height:'100%', videoId:'',
    playerVars:{ playsinline:1, rel:0, origin: window.location.origin },
    events:{
      onReady: () => {
        S.ready = true;
        // race-condition fix: 若使用者在 API 載入前已點過某支 short,現在補載
        if (S.pendingLoad) {
          S.player.loadVideoById(S.pendingLoad);
          S.pendingLoad = null;
        }
      },
      onError: (e) => {
        // 2:無效ID  5:HTML5錯誤  100:已移除/私人  101/150:擁有者禁止嵌入
        const msg = {
          2:'影片 ID 無效',
          5:'HTML5 播放器錯誤',
          100:'影片已被移除或設為私人',
          101:'擁有者禁止嵌入',
          150:'擁有者禁止嵌入',
        }[e.data] || `播放錯誤 (${e.data})`;
        document.getElementById('playerError').textContent = `⚠ ${msg} — 按「略過」跳下一支`;
      },
    },
  });
};

/* ---------- 佇列側欄 ---------- */
function renderQueue(){
  const el = document.getElementById('queuePanel'); el.innerHTML='';
  // 已 match 的歌曲 group 排前面,__unmatched 放最後
  const entries = Object.entries(S.queue).sort((a,b)=>{
    if(a[0]===UNMATCHED_KEY) return 1;
    if(b[0]===UNMATCHED_KEY) return -1;
    return 0;
  });
  for(const [sid, items] of entries){
    const isUnmatched = sid === UNMATCHED_KEY;
    const song = S.songs[sid];
    const label = isUnmatched
      ? `⚠ 未匹配 (${items.length})`
      : `${song ? song.title : sid} (${items.length})`;
    const g = document.createElement('div');
    g.className = 'song-group' + (isUnmatched ? ' unmatched collapsed' : '');
    g.innerHTML = `<div class="song-title">${label}</div>`;
    // click title = 展開/收起
    g.querySelector('.song-title').onclick = ()=> g.classList.toggle('collapsed');
    for(const it of items){
      const a = S.ann[it.videoId];
      // 若使用者已用下拉選歌,以 ann 裡的 songId 為準
      const effectiveSid = a?.songId || it.songId;
      const method = it.matchMethod;
      const row = document.createElement('div');
      row.className = 'short-item' + (S.cur && S.cur.videoId===it.videoId ? ' active':'');
      const vtLabel = a?.versionType
        ? VERSION_TYPES.find(v=>v.key===a.versionType)?.short : null;
      const instMark = a?.instrumental ? '<span class="vt inst" title="純演奏">🎵</span>' : '';
      row.innerHTML = `
        <img src="${it.thumbnail||''}" loading="lazy" onerror="this.style.visibility='hidden'">
        <div style="min-width:0;flex:1">
          <div class="t">${escapeHtml(it.title.split('#')[0].trim() || it.title)}</div>
          <div class="vc">${(it.viewCount||0).toLocaleString()} views
            ${vtLabel ? `<span class="vt">${vtLabel}</span>` : ''}
            ${instMark}
            ${isUnmatched ? `<span class="method ${method}">${METHOD_LABEL[method]||method}</span>` : ''}
          </div>
        </div>
        ${a?.status==='done' ? '<span class="badge done">完成</span>' :
          a?.status==='skip' ? '<span class="badge skip">略過</span>' : ''}`;
      row.onclick = ()=> loadShort(it);
      g.appendChild(row);
    }
    el.appendChild(g);
  }
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function updateProgress(){
  const all = Object.values(S.queue).flat();
  const done = all.filter(x=>S.ann[x.videoId]?.status==='done').length;
  document.getElementById('progress').textContent = `${done} / ${all.length} 已標注`;
}

/* ---------- 載入一支 short ---------- */
function loadShort(item){
  S.cur = item;
  if(!S.ann[item.videoId]) S.ann[item.videoId] = { songId:item.songId, anchors:[], status:'pending', versionType:null, instrumental:false };
  // 舊資料相容:沒有欄位就補上
  if(S.ann[item.videoId].versionType === undefined) S.ann[item.videoId].versionType = null;
  if(S.ann[item.videoId].instrumental === undefined) S.ann[item.videoId].instrumental = false;
  document.getElementById('playerError').textContent = '';
  if(S.ready){
    S.player.loadVideoById(item.videoId);
  } else {
    // 若 API 還沒 ready,先暫存,ready 後再自動載入
    S.pendingLoad = item.videoId;
  }
  document.getElementById('nowTitle').textContent = item.title;
  renderQueue(); renderVersionPicker(); renderLyrics(); renderAnchors(); startPoll();
}

/* ---------- 版本類型 chips + 純演奏 toggle ---------- */
function renderVersionPicker(){
  const el = document.getElementById('versionPicker');
  if(!S.cur){ el.innerHTML = ''; return; }
  const ann = S.ann[S.cur.videoId] || {};
  const cur = ann.versionType;
  const isInst = !!ann.instrumental;
  el.innerHTML = `<span class="label">版本</span>` + VERSION_TYPES.map(v =>
    `<button class="v-chip${cur===v.key?' active':''}" data-v="${v.key}">${v.label}</button>`
  ).join('') +
  `<span class="v-sep" aria-hidden="true">·</span>` +
  `<button class="v-chip v-chip-inst${isInst?' active':''}" data-inst="1" title="純演奏 / 間奏 (i)">🎵 純演奏</button>`;

  el.querySelectorAll('.v-chip[data-v]').forEach(b => {
    b.onclick = ()=>{
      const k = b.dataset.v;
      // 再點一次同一個 = 取消
      S.ann[S.cur.videoId].versionType = (S.ann[S.cur.videoId].versionType === k) ? null : k;
      persist(); renderVersionPicker(); renderQueue();
    };
  });
  el.querySelector('[data-inst]').onclick = toggleInstrumental;
}
function toggleInstrumental(){
  if(!S.cur) return;
  const ann = S.ann[S.cur.videoId];
  const willEnable = !ann.instrumental;
  if(willEnable && ann.anchors.length > 0){
    if(!confirm('切成純演奏會清掉已標的 anchors,確定?')) return;
    ann.anchors = [];
  }
  ann.instrumental = willEnable;
  persist(); renderVersionPicker(); renderAnchors(); renderLyrics(); renderQueue();
}

/* ---------- 歌詞欄(含人工歌曲下拉) ---------- */
function renderLyrics(){
  const panel = document.getElementById('lyricsPanel');
  const ann = S.ann[S.cur.videoId];
  const effectiveSid = ann.songId; // 以 ann 為準(允許使用者覆蓋)
  const song = effectiveSid ? S.songs[effectiveSid] : null;

  // 一律先畫「歌曲下拉」——已 match 也能改,未 match 必選
  const options = ['<option value="">— 選擇歌曲 —</option>']
    .concat(S.songList.map(s =>
      `<option value="${s.id}"${s.id===effectiveSid?' selected':''}>${escapeHtml(s.title)} (${s.album||''})</option>`
    )).join('');
  const head = `
    <div id="songPicker">
      <label>歌曲</label>
      <select id="songSelect">${options}</select>
    </div>`;

  if(!song){
    panel.innerHTML = head + `<div class="song-head" style="color:var(--warn)">請從上方選擇歌曲</div>`;
    bindSongSelect();
    return;
  }

  const anchoredLines = new Set(ann.anchors.map(a=>a.line));
  panel.innerHTML = head +
    `<div class="song-head">${escapeHtml(song.title)} — ${escapeHtml(song.album||'')} (${song.album_year||''})</div>`;
  for(const ln of song.lyric_lines){
    if(!ln.ja) continue;
    const d = document.createElement('div');
    d.className = 'lyr'
      + (ln.index===S.cur.lineHint && effectiveSid===S.cur.songId ? ' hint':'')  // 只有原始 match 時才顯示 hint
      + (anchoredLines.has(ln.index) ? ' anchored':'');
    d.dataset.line = ln.index;
    d.innerHTML = `<div class="ja">${escapeHtml(ln.ja)}</div><div class="zh">${escapeHtml(ln.zh||'')}</div><span class="idx">${ln.index}</span>`;
    d.onclick = ()=> addAnchor(ln.index);
    panel.appendChild(d);
  }
  bindSongSelect();
  // 自動捲到 lineHint(標題那句)附近
  const hintEl = panel.querySelector('.lyr.hint');
  if(hintEl) hintEl.scrollIntoView({ block:'center' });
}
function bindSongSelect(){
  const sel = document.getElementById('songSelect');
  if(!sel) return;
  sel.onchange = ()=>{
    // 更換歌曲會清掉已打的 anchors(因為 line 對應到不同歌就失效了)
    if(S.ann[S.cur.videoId].anchors.length > 0){
      if(!confirm('切換歌曲會清掉目前已打的 anchors,確定?')) {
        sel.value = S.ann[S.cur.videoId].songId || '';
        return;
      }
      S.ann[S.cur.videoId].anchors = [];
    }
    S.ann[S.cur.videoId].songId = sel.value || null;
    persist(); renderLyrics(); renderAnchors(); renderQueue();
  };
}

/* ---------- anchors ---------- */
function addAnchor(lineIdx){
  if(!S.ready || !S.cur) return;
  const ann = S.ann[S.cur.videoId];
  if(ann.instrumental){ alert('這支已標為純演奏,無需 anchor。要恢復請點右上「🎵 純演奏」關掉。'); return; }
  if(!ann.songId){ alert('請先在上方選擇歌曲'); return; }
  const t = Math.round(S.player.getCurrentTime()*100)/100;
  const arr = ann.anchors;
  const dup = arr.find(a=>a.line===lineIdx);
  if(dup) dup.t = t; else arr.push({ t, line:lineIdx });
  arr.sort((a,b)=>a.t-b.t);
  persist(); renderAnchors(); renderLyrics();
}
function renderAnchors(){
  const el = document.getElementById('anchorList'); el.innerHTML='';
  if(!S.cur) return;
  const effectiveSid = S.ann[S.cur.videoId]?.songId;
  const song = S.songs[effectiveSid] || { lyric_lines:[] };
  for(const [i,a] of S.ann[S.cur.videoId].anchors.entries()){
    const ja = song.lyric_lines.find(l=>l.index===a.line)?.ja || `line ${a.line}`;
    const row = document.createElement('div'); row.className='anchor-row';
    row.innerHTML = `<span class="at">${a.t.toFixed(2)}s</span><span class="al">${ja}</span><button class="del">×</button>`;
    row.querySelector('.at').onclick = ()=> S.player.seekTo(a.t, true);
    row.querySelector('.del').onclick = ()=>{
      S.ann[S.cur.videoId].anchors.splice(i,1);
      persist(); renderAnchors(); renderLyrics();
    };
    el.appendChild(row);
  }
}

/* ---------- 播放同步預覽(和你網站正式功能同一套邏輯) ---------- */
function startPoll(){
  clearInterval(S.timer);
  S.timer = setInterval(()=>{
    if(!S.ready || !S.cur) return;
    const t = S.player.getCurrentTime();
    document.getElementById('curTime').textContent = t.toFixed(2);
    const arr = S.ann[S.cur.videoId].anchors;
    let active = null;
    for(const a of arr){ if(t >= a.t) active = a.line; else break; }
    document.querySelectorAll('.lyr').forEach(el=>{
      el.classList.toggle('playing', Number(el.dataset.line)===active);
    });
  }, 250);
}

/* ---------- 完成/略過/匯出/匯入 ---------- */
function finishCurrent(status){
  if(!S.cur) return;
  S.ann[S.cur.videoId].status = status;
  persist(); updateProgress();
  const all = Object.values(S.queue).flat();
  const next = all.find(x => !S.ann[x.videoId] || S.ann[x.videoId].status==='pending');
  if(next) loadShort(next); else { renderQueue(); alert('佇列全部處理完了 🎉'); }
}
document.getElementById('doneBtn').onclick = ()=> finishCurrent('done');
document.getElementById('skipBtn').onclick = ()=> finishCurrent('skip');

document.getElementById('exportBtn').onclick = ()=>{
  const out = {};   // 只匯出有內容的
  for(const [vid, a] of Object.entries(S.ann)){
    if(a.anchors.length || a.status!=='pending') out[vid] = a;
  }
  const blob = new Blob([JSON.stringify(out, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'shorts_anchors.json'; a.click();
  URL.revokeObjectURL(url);
};
document.getElementById('importBtn').onclick = ()=>{
  const inp = document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange = async ()=>{
    const imported = JSON.parse(await inp.files[0].text());
    Object.assign(S.ann, imported);
    // 匯入的每一支都視為 dirty, 等下才會被推到 GitHub
    persist(Object.keys(imported));
    renderQueue(); updateProgress();
    if(S.cur){ renderAnchors(); renderLyrics(); }
  };
  inp.click();
};

/* ---------- 控制列/快捷鍵 ---------- */
document.getElementById('playBtn').onclick = togglePlay;
document.querySelectorAll('[data-seek]').forEach(b=>{
  b.onclick = ()=>{ if(S.ready) S.player.seekTo(S.player.getCurrentTime()+Number(b.dataset.seek), true); };
});
function togglePlay(){
  if(!S.ready) return;
  const st = S.player.getPlayerState();
  st===1 ? S.player.pauseVideo() : S.player.playVideo();
}
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT' || e.target.tagName==='SELECT') return;
  if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
  if(e.code==='ArrowLeft' && S.ready) S.player.seekTo(S.player.getCurrentTime()-2, true);
  if(e.code==='ArrowRight'&& S.ready) S.player.seekTo(S.player.getCurrentTime()+2, true);
  if(e.code==='Enter' && S.cur) finishCurrent('done');
  // 1-4 數字鍵 = 快速選版本(不論 event.code 是 Digit1 還是 Numpad1)
  const idx = { Digit1:0, Digit2:1, Digit3:2, Digit4:3,
                Numpad1:0, Numpad2:1, Numpad3:2, Numpad4:3 }[e.code];
  if(idx !== undefined && S.cur){
    const k = VERSION_TYPES[idx].key;
    S.ann[S.cur.videoId].versionType = (S.ann[S.cur.videoId].versionType === k) ? null : k;
    persist(); renderVersionPicker(); renderQueue();
  }
  // I 鍵 = toggle 純演奏
  if(e.code === 'KeyI' && S.cur) toggleInstrumental();
});

/* ---------- Settings 面板 + GitHub 存檔按鈕 ---------- */
const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
const tokenInput = document.getElementById('tokenInput');
const tokenSaveBtn = document.getElementById('tokenSaveBtn');
const tokenClearBtn = document.getElementById('tokenClearBtn');
const settingsCloseBtn = document.getElementById('settingsCloseBtn');
const saveGhBtn = document.getElementById('saveGhBtn');

function openSettings(){
  tokenInput.value = getToken();
  settingsPanel.hidden = false;
  setTimeout(() => tokenInput.focus(), 30);
}
function closeSettings(){ settingsPanel.hidden = true; }
settingsBtn.onclick = () => settingsPanel.hidden ? openSettings() : closeSettings();
settingsCloseBtn.onclick = closeSettings;
tokenSaveBtn.onclick = () => {
  const v = tokenInput.value.trim();
  if(!v){ alert('請貼上 token'); return; }
  setToken(v);
  closeSettings();
  updateSyncStatus();
  // 順便試著抓 baseline 驗證 token 是否有效
  fetchBaseline().then(() => {
    renderQueue?.();
    setSyncStatus('saved', 'Token OK · 已載入 baseline');
  }).catch(err => {
    setSyncStatus('error', 'Token 驗證失敗');
    alert('Token 驗證失敗: '+err.message);
  });
};
tokenClearBtn.onclick = () => {
  if(!confirm('清除 token? 之後就不能存到 GitHub')) return;
  setToken('');
  tokenInput.value = '';
  updateSyncStatus();
};
saveGhBtn.onclick = saveToGitHub;
// Esc 關設定面板
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !settingsPanel.hidden){ closeSettings(); }
});
// 點面板外關閉
document.addEventListener('click', e => {
  if(settingsPanel.hidden) return;
  if(settingsPanel.contains(e.target) || settingsBtn.contains(e.target)) return;
  closeSettings();
});

boot();
</script>
