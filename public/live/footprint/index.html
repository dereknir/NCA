<title>にしな出演足跡</title>
<style>
  :root{--bg:#0a0a15;--panel:#141d31;--line:#243154;--text:#e8ecf6;--dim:#8b97b8;
        --accent:#3d63ff;--gold:#e8c94a;--font:"Noto Sans TC","Hiragino Sans",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.6}
  .site-topbar{position:sticky;top:0;z-index:50;height:57px;background:rgba(10,10,21,0.75);
        backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .site-topbar-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:100%;
        display:flex;align-items:center;gap:14px}
  .site-topbar a{color:var(--text);font-size:20px;font-weight:700;text-decoration:none;transition:color .15s}
  .site-topbar a:hover{color:var(--accent)}
  .site-topbar a.crumb{color:var(--dim);font-size:13px;font-weight:400}
  main{max-width:980px;margin:0 auto;padding:44px 22px 120px}
  h1{font-size:30px;letter-spacing:.08em}
  .sub{color:var(--dim);font-size:13px;margin-top:6px}
  #wrap{display:grid;grid-template-columns:minmax(340px,1fr) 300px;gap:20px;margin-top:26px}
  #map{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  #map svg{width:100%;height:auto}
  .tile{fill:#141d31;stroke:#2a3a63;stroke-width:.7;stroke-linejoin:round;cursor:default}
  .tile.hit{cursor:pointer}
  .tile.hit:hover{stroke:var(--gold);stroke-width:1.4}
  .tile.sel{stroke:var(--gold);stroke-width:1.8}
  .tnum{font-size:13px;fill:var(--text);pointer-events:none;font-weight:700;
        paint-order:stroke;stroke:#0a0a15;stroke-width:3px}
  #side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;
        font-size:13px;display:flex;flex-direction:column;min-height:420px}
  #sideList{flex:1}
  #sideNav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;
        border-top:1px solid rgba(36,49,84,.6);padding-top:10px}
  #sideNav button{background:transparent;border:1px solid var(--line);border-radius:8px;
        color:var(--dim);width:34px;height:30px;cursor:pointer;font-size:14px;font-family:inherit}
  #sideNav button:not(:disabled):hover{border-color:var(--gold);color:var(--gold)}
  #sideNav button:disabled{opacity:.3;cursor:default}
  #sideNav .pg{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
  #side .ph{color:var(--dim)}
  #side h3{font-size:15px;margin-bottom:8px}
  .sgh{margin:12px 0 2px;font-size:12.5px;color:var(--gold);letter-spacing:.03em}
  .ev{padding:7px 0;border-bottom:1px solid rgba(36,49,84,.5)}
  .ev .d{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
  .ev a{color:var(--text);text-decoration:none;font-size:13px}
  .ev a:hover{color:var(--accent)}
  .ev .cx{color:#c05555;font-size:10px;margin-left:6px}
  .ev{display:flex;align-items:center;gap:8px}
  .ev .body{flex:1;min-width:0}
  .stx{width:32px;height:32px;flex:none;border:1.5px dashed var(--line);border-radius:7px;
       background:transparent;color:transparent;font-size:13px;cursor:pointer;font-family:inherit;
       transition:transform .15s}
  .stx:hover{border-color:#d65555;color:rgba(214,85,85,.55)}
  .stx.on{border:2.5px solid #d65555;border-radius:8px;color:#d65555;font-weight:700;
       transform:rotate(-9deg);box-shadow:inset 0 0 5px rgba(214,85,85,.35);
       text-shadow:0 0 1px #d65555}
  #mystats{color:var(--dim);font-size:13px;margin-top:10px}
  #mystats b{color:#d65555}
  #mkcard{background:transparent;border:1px solid var(--line);border-radius:99px;color:var(--dim);
        padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;margin-left:10px}
  #mkcard:hover{border-color:var(--gold);color:var(--gold)}
  #cardModal{position:fixed;inset:0;background:rgba(6,8,16,.82);display:none;
        align-items:center;justify-content:center;z-index:90;padding:20px}
  #cardModal.open{display:flex}
  #cardBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;
        display:flex;flex-direction:column;align-items:center;gap:12px;max-width:560px;width:100%}
  #passCv{width:100%;image-rendering:pixelated;border-radius:6px}
  #cardBox button{background:var(--panel-2,#1a2440);color:var(--text);border:1px solid var(--line);
        border-radius:10px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit}
  #unmapped{margin-top:22px;background:var(--panel);border:1px dashed var(--line);
        border-radius:14px;padding:16px;font-size:12.5px;color:var(--dim)}
  #unmapped b{color:var(--text)}
  #mapcol{display:flex;flex-direction:column;gap:10px}
  #mapctl{display:flex;gap:12px;align-items:center;min-height:34px}
  #play{background:var(--panel);border:1px solid var(--line);border-radius:99px;color:var(--text);
        padding:7px 16px;font-size:13px;cursor:pointer;font-family:inherit}
  #play:hover{border-color:var(--gold);color:var(--gold)}
  .ly{background:transparent;border:1px solid var(--line);border-radius:99px;padding:6px 13px;
      font-size:12px;color:var(--dim);cursor:pointer;font-family:inherit}
  .ly i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
  .ly.on{color:var(--text);border-color:currentColor}
  #cap{color:var(--dim);font-size:12.5px;flex:1;min-width:0;white-space:nowrap;
       overflow:hidden;text-overflow:ellipsis}
  .tile.playhl{stroke:var(--gold);stroke-width:2.2}
  #facts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .fact{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:8px 14px;font-size:12.5px;color:var(--dim)}
  .fact b{color:var(--gold);font-size:14px;margin-right:2px}
  .icsb{font-size:11px;border:1px solid var(--line);border-radius:6px;background:transparent;
        color:var(--dim);cursor:pointer;padding:1px 7px;margin-left:6px;font-family:inherit}
  .icsb:hover{border-color:var(--accent);color:var(--accent)}
  @media(max-width:760px){#wrap{grid-template-columns:1fr}}
  footer{margin-top:60px;color:#5a6784;font-size:11.5px;text-align:center}
</style>
</head>

function locate(ev) {
  const src = ev.name + ' ' + (ev.venue || '');
  for (const [k, p] of GEO) if (src.includes(k)) return p;
  return null;
}

const layers = { app: true, one: true };
function effCounts() {
  const c = {};
  if (layers.app) for (const [p, a] of Object.entries(byPref)) (c[p] = c[p] || []).push(...a);
  if (layers.one) for (const [p, a] of Object.entries(byPrefOne)) (c[p] = c[p] || []).push(...a);
  return c;
}
const maxN = Math.max(1, ...Object.values(effCounts()).map(a => a.length));
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 畫地圖:真實日本縣界(可重繪:蓋章後縣上出現紅印)
   瓷磚版退路:見上方註解掉的 PREF 與 zip 歷史版本 */
const side = document.getElementById('side');
function renderMap(counts = null, playhl = null, mxOverride = null) {
  counts = counts || effCounts();
  const mx = mxOverride || Math.max(1, ...Object.values(counts).map(a => a.length), 1);
  const M = JAPAN.meta;
  let svg = `<svg viewBox="0 0 ${M.w} ${M.h}" xmlns="http://www.w3.org/2000/svg">
    <rect x="${M.inset[0]}" y="${M.inset[1]}" width="${M.inset[2] - M.inset[0]}" height="${M.inset[3] - M.inset[1]}"
          fill="none" stroke="#243154" stroke-dasharray="5 4"/>`;
  // 縣面層
  for (const [name, p] of Object.entries(JAPAN.prefs)) {
    const evs = counts[name] || [];
    const n = evs.length;
    const heat = n ? 0.28 + 0.72 * (n / mx) : 0;
    const hasApp = evs.some(e => !e.tour);
    const rgbBase = hasApp ? '61,99,255' : '232,201,74';   // 純公演縣=金
    const fill = n ? `rgba(${rgbBase},${heat.toFixed(2)})` : '#141d31';
    svg += `<path class="tile${n ? ' hit' : ''}${name === selPref ? ' sel' : ''}${name === playhl ? ' playhl' : ''}" data-p="${name}"
        d="${p.d}" style="fill:${fill}"><title>${name}${n ? `・${n} 場` : ''}</title></path>`;
  }
  // 標記層(最上,不被縣界蓋住)
  for (const [name, p] of Object.entries(JAPAN.prefs)) {
    const evs = counts[name] || [];
    if (!evs.length) continue;
    const been = evs.some(e => e.tour ? stopStamped(e) : visited[e.news_url]);
    svg += `<text class="tnum" x="${p.cx}" y="${p.cy + 4}" text-anchor="middle">${evs.length}</text>`;
    if (been) svg += `<circle cx="${p.cx - 12}" cy="${p.cy + 9}" r="4.5" fill="#d65555" stroke="#0a0a15" stroke-width="1"/>`;
    if (evs.some(e => e.tour) && evs.some(e => !e.tour))
      svg += `<circle cx="${p.cx + 12}" cy="${p.cy + 9}" r="4" fill="#e8c94a" stroke="#0a0a15" stroke-width="1"/>`;
  }
  svg += '</svg>';
  document.getElementById('map').innerHTML = svg;
  document.querySelectorAll('.tile.hit').forEach(t =>
    t.addEventListener('click', () => openPref(t.dataset.p)));
}
function updateStats() {
  const nApp = Object.keys(visited).filter(k => !k.startsWith('oneman:') && !k.startsWith('stop:')).length;
  const nStop = new Set(Object.keys(visited).filter(k => k.startsWith('stop:'))).size;
  const prefs = new Set();
  for (const [p, evs] of Object.entries(byPref))
    if (evs.some(e => visited[e.news_url])) prefs.add(p);
  for (const [p, evs] of Object.entries(byPrefOne))
    if (evs.some(stopStamped)) prefs.add(p);
  document.getElementById('mystats').innerHTML = (nApp + nStop)
    ? `你的足跡:<b>${nStop}</b> 站公演・<b>${nApp}</b> 場出演・<b>${prefs.size}</b> 個都道府縣`
    : '去過的場次蓋個章,足跡會落在地圖上(僅存於你的瀏覽器)';
}
let sidePage = 0, sideItems = [], sideTitle = '';
const PAGE_SIZE = 6;
function openPref(p) {
  if (playing) stopPlay();
  if (selPref !== p) sidePage = 0;
  selPref = p;
  renderMap();
  const all = effCounts()[p] || [];
  const oneEvs = all.filter(e => e.tour);
  const evs = all.filter(e => !e.tour);
  const row = e => `<div class="ev">
      <button class="stx${visited[e.news_url] ? ' on' : ''}" data-k="${esc(e.news_url)}">${visited[e.news_url] ? '参' : ''}</button>

  const oneRow = e => `<div class="ev">
      <button class="stx${stopStamped(e) ? ' on' : ''}" data-stop="${esc(stopKey(e))}"${visited['oneman:' + e.tn] && !visited[stopKey(e)] ? ' title="已於公演史頁蓋整場章"' : ''}>${stopStamped(e) ? '参' : ''}</button>
      <div class="body"><div class="d">${esc(e.date)}・${esc(e.venue)}</div>
      <a href="${esc(e.news_url)}" target="_blank" rel="noopener">${esc(e.tour)}</a></div></div>`;
  sideItems = [];
  if (oneEvs.length) {
    sideItems.push(`<div class="sgh">♪ 公演 ×${oneEvs.length}</div>`);
    oneEvs.sort((a, b) => a.date.localeCompare(b.date)).forEach(e => sideItems.push(oneRow(e)));
  }
  const g = {};
  for (const e of evs) {
    const k = SNAME[e.news_url] || e.name;
    (g[k] = g[k] || []).push(e);
  }
  const multi = Object.entries(g).filter(([, a]) => a.length >= 2)
    .sort((a, b) => b[1].length - a[1].length);
  const single = Object.entries(g).filter(([, a]) => a.length === 1)
    .flatMap(([, a]) => a)
    .sort((a, b) => (a.event_date || '').localeCompare(b.event_date || ''));
  for (const [name, a] of multi) {
    sideItems.push(`<div class="sgh">${esc(name)} ×${a.length}</div>`);
    a.sort((x, y) => (x.event_date || '').localeCompare(y.event_date || '')).forEach(e => sideItems.push(row(e)));
  }
  if (single.length) {
    if (multi.length || oneEvs.length) sideItems.push(`<div class="sgh" style="color:var(--dim)">單次出演</div>`);
    single.forEach(e => sideItems.push(row(e)));
  }
  sideTitle = `<h3>${p}(${all.length} 場)</h3>`;
  renderSidePage();
}
function renderSidePage() {
  const pages = Math.max(1, Math.ceil(sideItems.length / PAGE_SIZE));

  side.innerHTML = sideTitle + `<div id="sideList">` + slice.join('') + `</div>`
    + (pages > 1 ? `<div id="sideNav">
        <button id="pgPrev" ${sidePage === 0 ? 'disabled' : ''}>‹</button>
        <span class="pg">${sidePage + 1} / ${pages}</span>
        <button id="pgNext" ${sidePage === pages - 1 ? 'disabled' : ''}>›</button></div>` : '');
  const pv = document.getElementById('pgPrev'), nx = document.getElementById('pgNext');
  if (pv) pv.onclick = () => { sidePage--; renderSidePage(); };
  if (nx) nx.onclick = () => { sidePage++; renderSidePage(); };
}

/* ⑥ 參戰履歷像素卡(吃蓋章資料;字型走像素管線同款,載不到時 monospace 降級) */
const FONT_BASE = '/gacha/fonts/';   // 已驗證:public/gacha/fonts/fusion-pixel-12px-proportional-{ja,zh_hant}.sub.ttf
let passFontsReady = null;
function loadPassFonts() {
  if (passFontsReady) return passFontsReady;
  passFontsReady = Promise.all([
    ['JP12', FONT_BASE + 'fusion-pixel-12px-proportional-ja.sub.ttf'],
    ['TC12', FONT_BASE + 'fusion-pixel-12px-proportional-zh_hant.sub.ttf'],
  ].map(async ([n, u]) => {
    const f = new FontFace(n, `url(${u})`);
    await f.load(); document.fonts.add(f);
  })).then(() => true).catch(() => false);
  return passFontsReady;
}
async function renderPassport() {
  const W = 168, H = 126;
  const pixelFonts = await loadPassFonts();
  const P = { bg: [12,18,32], deep: [30,42,74], accent: [61,99,255], dim: [139,152,184],
              light: [158,180,255], text: [242,244,250], gold: [232,201,74], red: [214,85,85] };
  const buf = new Uint8Array(W * H * 3);
  const px = (x, y, c) => { x|=0; y|=0; if (x<0||y<0||x>=W||y>=H) return;
    const i = (y*W+x)*3; buf[i]=c[0]; buf[i+1]=c[1]; buf[i+2]=c[2]; };
  const rect = (x, y, w, h, c) => { for (let j=y;j<y+h;j++) for (let i=x;i<x+w;i++) px(i,j,c); };
  rect(0, 0, W, H, P.bg);
  let seed = 20210625;
  const rnd = () => { seed = (seed*1103515245+12345)>>>0; return seed/4294967296; };
  for (let i = 0; i < 85; i++) {
    const x=(rnd()*W)|0, y=(rnd()*H)|0, r=rnd();
    px(x, y, r<.5?P.dim:r<.86?P.light:P.gold);
  }
  const fr=(x,y,w,h,c,t)=>{rect(x,y,w,t,c);rect(x,y+h-t,w,t,c);rect(x,y,t,h,c);rect(x+w-t,y,t,h,c);};
  fr(2,2,W-4,H-4,P.accent,2); rect(2,H-5,W-4,3,P.accent);

  // 參戰縣集合:出演蓋章 + 公演蓋章(該巡演全站點)
  const lit = new Set();
  for (const [p, evs] of Object.entries(byPref))
    if (evs.some(e => visited[e.news_url])) lit.add(p);
  TOURS.tours.forEach((t, i) => t.stops.forEach(st => {
    if (visited['oneman:' + (i + 1)] || visited[`stop:${t.id}:${st.date}`]) lit.add(st.pref);
  }));
  // 迷你日本(真實縣質心縮放)
  const sc = 0.089, ox = 96, oy = 20;
  for (const [name, pp] of Object.entries(JAPAN.prefs)) {
    const x = ox + Math.round(pp.cx*sc), y = oy + Math.round(pp.cy*sc);
    if (lit.has(name)) { rect(x-1, y-1, 3, 3, P.gold); px(x, y-2, P.light); }
    else px(x, y, P.deep);
  }
  // 統計
  const nOne = TOURS.tours.filter((t, i) => visited['oneman:' + (i + 1)]
    || t.stops.some(st => visited[`stop:${t.id}:${st.date}`])).length;
  const nApp = Object.keys(visited).filter(k => !k.startsWith('oneman:') && !k.startsWith('stop:')).length;

  const cv = document.getElementById('passCv'), ctx = cv.getContext('2d');
  const oc = new OffscreenCanvas(W, H), o = oc.getContext('2d');
  const img = o.createImageData(W, H);
  for (let i = 0, j = 0; i < buf.length; i += 3, j += 4) {
    img.data[j]=buf[i]; img.data[j+1]=buf[i+1]; img.data[j+2]=buf[i+2]; img.data[j+3]=255;
  }
  o.putImageData(img, 0, 0);
  const txt = new OffscreenCanvas(W, H), t = txt.getContext('2d');
  t.textBaseline = 'top';
  const F = pixelFonts ? 'JP12' : 'monospace';
  const FT = pixelFonts ? 'TC12' : 'monospace';
  const put = (str, x, y, size, fam, c) => {
    t.font = `${size}px ${fam}`;
    t.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
    t.fillText(str, x, y);
  };
  put('にしな', 10, 9, 12, F, P.dim);
  put(new Date().toISOString().slice(0, 10), W - 66, 10, 10, 'monospace', P.dim);
  put('参戦の記録', 12, 30, 12, F, P.gold);
  put(`公演 ${nOne}/10`, 12, 54, 12, FT, P.text);
  put(`出演 ${nApp} 場`, 12, 72, 12, FT, P.text);
  put(`${lit.size} 都道府縣`, 12, 90, 12, FT, P.light);
  const ti = t.getImageData(0, 0, W, H);
  for (let j = 3; j < ti.data.length; j += 4) ti.data[j] = ti.data[j] >= 128 ? 255 : 0;
  t.putImageData(ti, 0, 0);
  o.drawImage(txt, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(oc, 0, 0, cv.width, cv.height);
}

/* ② 統計趣聞條 */
function renderFacts() {
  const NS = ['北海道','青森','岩手','宮城','秋田','山形','福島','茨城','栃木','群馬','埼玉','千葉','東京','神奈川','新潟','富山','石川','福井','山梨','長野','岐阜','静岡','愛知','三重','滋賀','京都','大阪','兵庫','奈良','和歌山','鳥取','島根','岡山','広島','山口','徳島','香川','愛媛','高知','福岡','佐賀','長崎','熊本','大分','宮崎','鹿児島','沖縄'];
  const prefs = Object.keys(effCounts());
  const ec = effCounts();
  const topPref = [...prefs].sort((a, b) => ec[b].length - ec[a].length)[0];
  const north = prefs.sort((a, b) => NS.indexOf(a) - NS.indexOf(b))[0];
  const south = prefs.sort((a, b) => NS.indexOf(b) - NS.indexOf(a))[0];
  const yc = {};
  DATA.appearance.forEach(e => { const y = (e.event_date || '').slice(0, 4); if (y) yc[y] = (yc[y] || 0) + 1; });
  const topYear = Object.entries(yc).sort((a, b) => b[1] - a[1])[0];
  const topS = (SERIES?.series || []).filter(s => s.count >= 2)[0];
  const nStops = TOURS.tours.reduce((n, t) => n + t.stops.length, 0);
  const F = [
    `出演<b>${DATA.appearance.length}</b>場・巡演<b>${nStops}</b>站・<b>${prefs.length}</b>縣`,
    `最常出沒 <b>${topPref}</b> ${ec[topPref].length}場`,
    topS ? `<b>${topS.series.slice(0, 20)}</b> ${topS.count}年皆勤` : '',
    `最北 <b>${north}</b>・最南 <b>${south}</b>`,
    topYear ? `最忙碌 <b>${topYear[0]}</b>年 ${topYear[1]}場` : '',
  ].filter(Boolean);
  document.getElementById('facts').innerHTML = F.map(f => `<div class="fact">${f}</div>`).join('');
}
