const SUN_N = 84, SUN_R = 22;
function paintSun(ctx, t) {
  const img = ctx.createImageData(SUN_N, SUN_N);
  const d = img.data, c = SUN_N / 2;
  const put = (x, y, col) => {
    x |= 0; y |= 0;
    if (x < 0 || y < 0 || x >= SUN_N || y >= SUN_N) return;
    const i = (y * SUN_N + x) * 4;
    d[i] = col[0]; d[i+1] = col[1]; d[i+2] = col[2]; d[i+3] = 255;
  };
  const FIRE = [[255,246,214],[255,222,120],[238,178,60],[206,120,38],[150,66,34]];
  for (let a = 0; a < 6.283; a += .028) {
    const n = Math.sin(a*3 + t*.0016) * .5 + Math.sin(a*7 - t*.0027) * .3
            + Math.sin(a*13 + t*.004) * .2;
    const len = SUN_R * (1.12 + .5 * (n * .5 + .5));
    for (let r = SUN_R - 1; r < len; r++) {
      const f = (r - SUN_R + 1) / (len - SUN_R + 1);
      const col = FIRE[Math.min(4, 1 + (f * 4) | 0)];
      if (hash((a*100)|0, r, (t/90)|0) < .82)
        put(c + Math.cos(a)*r, c + Math.sin(a)*r, col);
    }
  }
  for (let y = -SUN_R; y <= SUN_R; y++) for (let x = -SUN_R; x <= SUN_R; x++) {
    const d2 = x*x + y*y;
    if (d2 > SUN_R*SUN_R) continue;
    const f = Math.sqrt(d2) / SUN_R;

    if (hash(x + 60, y + 60, (t/140)|0) < .07) col = mix(col, [255,255,255], .5);
    if (f > .74 && (BAYER[(y+SUN_R)%4][(x+SUN_R)%4]/16) > (1-f)*3.2) col = FIRE[2];
    put(c + x, c + y, col);
  }
  const pa = ((t / 2600) | 0) % 7 * .9 + .4;
  if (((t / 2600) % 1) < .6) {
    for (let s = 0; s < 1; s += .04) {
      const r = SUN_R * (1.05 + Math.sin(s * Math.PI) * .55);

    }
  }
  ctx.putImageData(img, 0, 0);
}

  const spd = ship.mode === 'travel' ? .09 : .02;
  ship.x += (ship.tx - ship.x) * spd;
  ship.y += (ship.ty - ship.y) * spd;
  if (Math.abs(ship.tx - ship.x) + Math.abs(ship.ty - ship.y) > 3)
    ship.trail.push({ x: ship.x, y: ship.y + 8, life: 14 });
  ship.trail = ship.trail.filter(p => --p.life > 0);
  for (const p of ship.trail) {
    fctx.fillStyle = p.life > 7 ? '#e8c94a' : '#8a5a2a';
    fctx.fillRect((p.x + (hash(p.life, 1)*4-2)) | 0, p.y | 0, 2, 2);
  }
  const S = 3;
  SHIP_MAP.forEach((row, j) => [...row].forEach((ch, i) => {
    const c = SHIP_COL[ch];
    if (!c) return;
    if (ch === 'F' && ((t / 90) | 0) % 2) return;
    fctx.fillStyle = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
    fctx.fillRect((ship.x + (i - 2.5) * S) | 0, (ship.y + (j - 3) * S) | 0, S, S);
  }));
  if (ship.mode === 'travel' && ship.target) {
    if (Math.hypot(ship.tx - ship.x, ship.ty - ship.y) < 14) doWarp(ship.target);
  }
}
function travel(b) {
  explored[b.id] = Date.now();
  saveExp(); updateHud();
  if (reduced) return doWarp(b);
  ship.mode = 'travel';
  ship.target = b;
  const r = b.el.getBoundingClientRect();
  ship.tx = r.left + r.width / 2;
  ship.ty = r.top - 16;
  showToast('航行中 → ' + b.nameJa + '・' + b.page);
}
function doWarp(b) {
  ship.mode = 'idle'; ship.target = null;
  cam.target = null;
  const warp = document.getElementById('warp');
  const r = b.el.getBoundingClientRect();
  const wx = b._sx != null && MODE === 'cockpit' ? b._sx : r.left + r.width / 2;
  const wy = b._sy != null && MODE === 'cockpit' ? b._sy : r.top + r.height / 2;
  warp.style.setProperty('--wx', wx + 'px');
  warp.style.setProperty('--wy', wy + 'px');
  const go = () => {
    const url = ROUTES[b.id];
    if (url) location.href = url;
    else { warp.classList.remove('on'); showToast('著陸:' + b.nameJa + '・' + b.page + '(ROUTES 未填,原型模式)'); }
  };
  if (reduced) return go();
  warp.classList.add('on');
  setTimeout(go, 480);
}

/* ---------- 操縦席:偽3D第一人稱 ---------- */
const WORLD_R = 900;                                    // 軌道世界尺度
const cam = { x: 0, y: 90, z: -1350, yaw: 0, pitch: .06, roll: 0, spd: .4, target: null };
const NDUST = [];
{
  const r = rng(555);
  for (let i = 0; i < 46; i++)
    NDUST.push({ x: (r()-.5)*520, y: (r()-.5)*520, z: (r()-.5)*520 });
}
const wrapN = v => ((v + 260) % 520 + 520) % 520 - 260;
const CSTARS = [];
{
  const r = rng(777);
  for (let i = 0; i < 340; i++)
    CSTARS.push({ x: (r()-.5)*3200, y: (r()-.5)*3200, z: (r()-.5)*3200,
                  c: r() < .6 ? '#8b97b8' : r() < .9 ? '#cdd6ee' : '#e8c94a' });
}
const wrapC = v => ((v + 1600) % 3200 + 3200) % 3200 - 1600;
function worldPos(b) {
  const R = b.orbit * WORLD_R;
  return [Math.cos(b.angle) * R, 0, Math.sin(b.angle) * R];
}
function project(dx, dy, dz) {
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const rx = dx * cy - dz * sy;
  let rz = dx * sy + dz * cy;
  const ry = dy * cp + rz * sp;
  rz = -dy * sp + rz * cp;
  if (rz < 8) return null;
  const F = 430;
  return [VW/2 + rx / rz * F, VH/2 + ry / rz * F, rz];
}
function renderCockpit(t) {
  sctx.imageSmoothingEnabled = true;
  sctx.drawImage(nebula, -10, -8, VW + 20, VH + 16);
  // 轉向:自由=滑鼠;自動駕駛=朝目標
  let yawT, pitchT;
  if (cam.target) {
    const [tx, ty, tz] = worldPos(cam.target);
    yawT = Math.atan2(tx - cam.x, tz - cam.z);
    pitchT = -Math.atan2(ty - cam.y, Math.hypot(tx - cam.x, tz - cam.z)) * .9;
    const dist = Math.hypot(tx - cam.x, ty - cam.y, tz - cam.z);
    const want = dist < 480 ? Math.max(1.6, dist / 480 * 7.5) : 7.5;   // 進場減速
    cam.spd += (want - cam.spd) * .04;
    cam._dist = dist;
  } else {
    yawT = (mx - .5) * 2.6;
    pitchT = (my - .5) * 1.3;
    cam.spd += (.4 - cam.spd) * .04;
  }
  let dy = yawT - cam.yaw;
  dy = ((dy + Math.PI) % 6.283 + 6.283) % 6.283 - Math.PI;
  cam.yaw += dy * .055;
  cam.pitch += (pitchT - cam.pitch) * .055;
  cam.roll += (Math.max(-.4, Math.min(.4, -dy * 3.2)) - cam.roll) * .06;   // 轉彎側傾
  const fw = [Math.sin(cam.yaw) * Math.cos(cam.pitch), -Math.sin(cam.pitch), Math.cos(cam.yaw) * Math.cos(cam.pitch)];
  const rc = Math.cos(cam.roll), rs = Math.sin(cam.roll);
  const roll = p => p && [VW/2 + (p[0]-VW/2)*rc - (p[1]-VH/2)*rs,
                          VH/2 + (p[0]-VW/2)*rs + (p[1]-VH/2)*rc, p[2]];
  const dt = window.__dt || 16;
  cam.x += fw[0] * cam.spd * dt * .06;
  cam.y += fw[1] * cam.spd * dt * .06;
  cam.z += fw[2] * cam.spd * dt * .06;
  // 星流(速度越快拖越長)
  for (const st of CSTARS) {
    const dx = wrapC(st.x - cam.x), dyy = wrapC(st.y - cam.y), dz = wrapC(st.z - cam.z);
    const p = roll(project(dx, dyy, dz));
    if (!p) continue;
    const p2 = roll(project(dx + fw[0] * cam.spd * 7, dyy + fw[1] * cam.spd * 7, dz + fw[2] * cam.spd * 7));
    sctx.strokeStyle = st.c;
    sctx.globalAlpha = Math.min(1, 900 / p[2]) * .9;
    sctx.lineWidth = p[2] < 400 ? 2 : 1;
    sctx.beginPath();
    sctx.moveTo(p[0], p[1]);
    sctx.lineTo(p2 ? p2[0] : p[0] + .6, p2 ? p2[1] : p[1] + .6);
    sctx.stroke();
  }
  sctx.globalAlpha = 1;
  // 近場塵埃:速度感的主要來源
  sctx.strokeStyle = 'rgba(205,214,238,.5)';
  sctx.lineWidth = 1;
  for (const d of NDUST) {
    const dx = wrapN(d.x - cam.x), dyy = wrapN(d.y - cam.y), dz = wrapN(d.z - cam.z);
    const p = roll(project(dx, dyy, dz));
    if (!p || p[2] > 300) continue;
    const p2 = roll(project(dx + fw[0] * cam.spd * 3.5, dyy + fw[1] * cam.spd * 3.5, dz + fw[2] * cam.spd * 3.5));
    if (!p2) continue;
    sctx.globalAlpha = Math.min(.6, 90 / p[2]);
    sctx.beginPath();
    sctx.moveTo(p[0], p[1]);
    sctx.lineTo(p2[0], p2[1]);
    sctx.stroke();
  }
  sctx.globalAlpha = 1;
  // 天體(遠→近)
  const order = [];
  for (const b of BODIES) {
    const [wx2, wy2, wz2] = b.orbit ? worldPos(b) : [0, 0, 0];
    const p = roll(project(wx2 - cam.x, wy2 - cam.y, wz2 - cam.z));
    b._sx = b._sy = null;
    if (!p) continue;
    order.push([p[2], b, p]);
  }
  order.sort((a, b2) => b2[0] - a[0]);
  sctx.imageSmoothingEnabled = false;
  for (const [rz, b, p] of order) {
    const sizeW = b.base * b.scale * (b.id === 'sun' ? 1.15 : 1);
    const s2 = sizeW * 300 / rz;
    if (s2 < 2) continue;
    if (b.id === 'sun') {
      const g = sctx.createRadialGradient(p[0], p[1], s2 * .3, p[0], p[1], s2 * 1.6);
      g.addColorStop(0, 'rgba(238,178,60,.35)');
      g.addColorStop(1, 'rgba(238,178,60,0)');
      sctx.fillStyle = g;
      sctx.fillRect(p[0] - s2 * 1.6, p[1] - s2 * 1.6, s2 * 3.2, s2 * 3.2);
    }
    sctx.drawImage(b.el, p[0] - s2 / 2, p[1] - s2 / 2, s2, s2);
    b._sx = p[0]; b._sy = p[1]; b._sr = s2 / 2; b._srz = rz;
    if (b.id !== 'sun' && s2 > 7 && rz < 2600) {
      sctx.font = '12px ' + getComputedStyle(document.body).fontFamily;
      sctx.textAlign = 'center';
      sctx.fillStyle = cam.target === b ? '#e8c94a' : 'rgba(139,152,184,.85)';
      sctx.fillText(b.nameJa + '・' + b.page, p[0], p[1] + s2 / 2 + 16);
    }
  }
  // 目標鎖定框(四角括號,呼吸)
  if (cam.target && cam.target._sx != null) {
    const b = cam.target;
    const r2 = Math.max(16, b._sr + 10 + Math.sin(t * .006) * 2);
    sctx.strokeStyle = '#e8c94a';
    sctx.lineWidth = 1.5;
    const seg = Math.max(5, r2 * .4);
    for (const [ox, oy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) {
      sctx.beginPath();
      sctx.moveTo(b._sx + ox*r2 - ox*seg, b._sy + oy*r2);
      sctx.lineTo(b._sx + ox*r2, b._sy + oy*r2);
      sctx.lineTo(b._sx + ox*r2, b._sy + oy*r2 - oy*seg);
      sctx.stroke();
    }
  }
  // 準星
  sctx.strokeStyle = 'rgba(232,201,74,.5)';
  sctx.lineWidth = 1;
  sctx.beginPath();
  sctx.moveTo(VW/2 - 9, VH/2); sctx.lineTo(VW/2 - 3, VH/2);
  sctx.moveTo(VW/2 + 3, VH/2); sctx.lineTo(VW/2 + 9, VH/2);
  sctx.moveTo(VW/2, VH/2 - 9); sctx.lineTo(VW/2, VH/2 - 3);
  sctx.moveTo(VW/2, VH/2 + 3); sctx.lineTo(VW/2, VH/2 + 9);
  sctx.stroke();
  // 座艙框:四角支柱 + 底部儀表暗帶 + 暗角
  sctx.fillStyle = 'rgba(12,16,30,.92)';
  const st2 = Math.min(VW, VH) * .16;
  for (const [cx2, cy2, dx2, dy2] of [[0,0,1,1],[VW,0,-1,1],[0,VH,1,-1],[VW,VH,-1,-1]]) {
    sctx.beginPath();
    sctx.moveTo(cx2, cy2 + dy2*st2*1.5);
    sctx.lineTo(cx2, cy2);
    sctx.lineTo(cx2 + dx2*st2*1.5, cy2);
    sctx.lineTo(cx2 + dx2*st2*1.1, cy2 + dy2*8);
    sctx.lineTo(cx2 + dx2*8, cy2 + dy2*st2*1.1);
    sctx.closePath();
    sctx.fill();
    sctx.strokeStyle = '#243154';
    sctx.stroke();
  }
  const vg = sctx.createRadialGradient(VW/2, VH/2, Math.min(VW,VH)*.32, VW/2, VH/2, Math.max(VW,VH)*.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(4,6,14,.55)');
  sctx.fillStyle = vg;
  sctx.fillRect(0, 0, VW, VH);
  // 雷達(左下):前方=上,行星方位與距離
  const RX = 86, RY = VH - 92, RR = 52;
  sctx.fillStyle = 'rgba(14,20,38,.85)';
  sctx.beginPath(); sctx.arc(RX, RY, RR, 0, 6.283); sctx.fill();
  sctx.strokeStyle = '#243154';
  sctx.beginPath(); sctx.arc(RX, RY, RR, 0, 6.283); sctx.stroke();
  sctx.beginPath(); sctx.arc(RX, RY, RR*.55, 0, 6.283); sctx.stroke();
  sctx.strokeStyle = 'rgba(139,152,184,.4)';
  sctx.beginPath(); sctx.moveTo(RX, RY-RR); sctx.lineTo(RX, RY-RR+6); sctx.stroke();
  for (const b of BODIES) {
    const [wx2, , wz2] = b.orbit ? worldPos(b) : [0, 0, 0];
    const ddx = wx2 - cam.x, ddz = wz2 - cam.z;
    const bear = Math.atan2(ddx, ddz) - cam.yaw;
    const dd = Math.min(1, Math.hypot(ddx, ddz) / 2400);
    const bx2 = RX + Math.sin(bear) * dd * (RR-6);
    const by2 = RY - Math.cos(bear) * dd * (RR-6);
    if (b.id === 'sun') { sctx.fillStyle = '#e8c94a'; sctx.fillRect(bx2-2, by2-2, 4, 4); }
    else {
      const isT = cam.target === b;
      sctx.fillStyle = isT ? (((t/300)|0) % 2 ? '#e8c94a' : '#fff') : '#8b97b8';
      sctx.fillRect(bx2-1.5, by2-1.5, isT ? 4 : 3, isT ? 4 : 3);
    }
  }
  sctx.fillStyle = '#8b97b8';
  sctx.fillRect(RX-1, RY-1, 2, 2);
  // 抵達
  if (cam.target) {
    const [tx, ty, tz] = worldPos(cam.target);
    if (Math.hypot(tx - cam.x, ty - cam.y, tz - cam.z) < 130) doWarp(cam.target);
  }
  // 儀表
  document.getElementById('cTarget').innerHTML = cam.target
    ? '<span class="lbl">針路:</span><b>' + cam.target.nameJa + '</b>・' + cam.target.page
      + (cam._dist ? ' <span class="lbl">距離</span> ' + (cam._dist|0) : '')
    : '<span class="lbl">針路:</span>自由巡航(點行星設定)';
  document.getElementById('cSpd').textContent = cam.spd.toFixed(1);
  document.getElementById('cExp').textContent = Object.keys(explored).length;
}
space.addEventListener('click', e => {
  if (MODE !== 'cockpit') return;
  let hit = null;
  for (const b of BODIES) {
    if (b.id === 'sun' || b._sx == null) continue;
    const d = Math.hypot(e.clientX - b._sx, e.clientY - b._sy);
    if (d < Math.max(16, b._sr + 8) && (!hit || b._srz < hit._srz)) hit = b;
  }
  if (hit) {
    cam.target = hit;
    explored[hit.id] = Date.now();
    saveExp(); updateHud();
    showToast('針路設定 → ' + hit.nameJa + '・' + hit.page);
  } else if (cam.target) {
    cam.target = null;
    showToast('自動駕駛解除');
  }
});

/* ---------- 主迴圈 ---------- */
let lastPaint = 0;
function frame(t) {
  const repaint = t - lastPaint > 110;
  if (repaint) lastPaint = t;
  for (const b of BODIES) {
    if (!reduced) {
      let w = b.speed || 0;
      if (b.orbit && !vertical) {
        const rr = b.orbit * ORBMAX;
        const px2 = (b.ecc || .52) * rr + Math.cos(b.angle) * rr * .78;
        const py2 = Math.sin(b.angle) * rr * .78 * (b.flat || .42);
        const k = (rr * .78) / (Math.hypot(px2, py2) || 1);
        w *= Math.min(3.5, Math.max(.5, k * k));   // 近日俯衝,遠日漂移(夾限防瞬移)
      }
      b.angle += w * (window.__dt || 16);
      b.phase = ((b.phase + (b.spin || 0) * (window.__dt || 16)) % 1 + 1) % 1;
    }
    if (b._gl || repaint || !b._painted) { paintBody(b, t); b._painted = true; }
  }
  if (MODE === 'cockpit') {
    renderCockpit(t);
    fctx.clearRect(0, 0, VW, VH);
    requestAnimationFrame(frame);
    return;
  }
  drawSpace(t);
  for (const b of BODIES) {
    let x, y, depth = 0;
    if (!b.orbit) { x = SUNX; y = SUNY; }
    else if (vertical) {
      x = SUNX + Math.sin(b.angle) * 54;
      y = SUNY + b.orbit * ORBMAX;
    } else {
      [x, y, depth] = orbitPos(b);
    }
    const dscale = 1 + depth * .22;
    b.el.style.left = x + 'px';
    b.el.style.top = y + 'px';
    b.el.style.width = (b.base * b.scale * dscale) + 'px';
    b.el.style.zIndex = b.id === 'sun' ? 4 : (depth >= 0 ? 5 : 3);
    if (b.id !== 'sun')
      b.el.style.filter = 'brightness(' + (1 + depth * .18).toFixed(2) + ')';
    b.lbl.style.left = x + 'px';
    b.lbl.style.top = (y + b.base * b.scale * dscale / 2 + 6) + 'px';
    b.lbl.style.zIndex = b.el.style.zIndex;
    b.lbl.innerHTML = '<div class="n">' + b.nameJa + '</div><div class="p">' + b.page + '</div>'
      + (explored[b.id] ? '<div class="v">▲ 探索済</div>' : '');
  }
  drawShip(t);
  requestAnimationFrame(frame);
}
let last = performance.now();
(function tick(t) { window.__dt = Math.min(48, t - last); last = t; requestAnimationFrame(tick); })(last);

addEventListener('mousemove', e => { mx = e.clientX / VW; my = e.clientY / VH; });

function placeFlare() {
  if (!FLARE_TEXT) return;   // 事件池還沒載到 / 今天沒有回憶 → 不顯示
  const f = document.getElementById('flare');
  f.innerHTML = '✦ ' + FLARE_TEXT.years + ' 年前的今天<br>' + FLARE_TEXT.name
    + '<br><span class="f">' + FLARE_TEXT.sub + '</span>';
  // 避開日冕半徑(太陽畫布半寬 ≈143px)與行星標籤帶
  if (vertical) { f.style.left = '24px'; f.style.top = (SUNY + 170) + 'px'; }
  else { f.style.left = (SUNX + 165) + 'px'; f.style.top = (SUNY - 175) + 'px'; }
}
/* 耀斑呼吸:載入 2s 後亮 9s,之後每 45s 閃現一次;hover 太陽隨時召喚 */
const flareEl = document.getElementById('flare');
let flareT = null;
function flareShow(ms) {
  flareEl.classList.add('show');
  clearTimeout(flareT);
  if (ms) flareT = setTimeout(() => flareEl.classList.remove('show'), ms);
}
function initFlareCycle() {
  if (!reduced) {
    setTimeout(() => flareShow(9000), 2000);
    setInterval(() => flareShow(9000), 45000);
  } else {
    flareEl.classList.add('show');   // reduced-motion:恆亮不閃
  }
}
/* 開機抓事件池, 命中才點燃閃焰 */
fetch('/live/events.json')
  .then(r => r.ok ? r.json() : null)
  .then(list => {
    if (!list || !list.length) return;
    const now = new Date();
    const md = String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    const yr = now.getFullYear();
    const pool = list.filter(e => e.d.slice(5) === md && +e.d.slice(0, 4) < yr);
    if (!pool.length) return;
    const doy = Math.floor((now - new Date(yr, 0, 0)) / 86400000);
    const e = pool[doy % pool.length];
    FLARE_TEXT = { years: yr - +e.d.slice(0, 4), name: e.n, sub: e.s || '' };
    placeFlare();
    initFlareCycle();
  })
  .catch(() => {});
layout(); placeFlare(); updateHud();
setMode(MODE);
ship.x = SUNX + 120; ship.y = SUNY;
addEventListener('resize', () => { layout(); placeFlare(); });
BODIES[0].el.addEventListener('mouseenter', () => flareShow(0));
BODIES[0].el.addEventListener('mouseleave', () => flareShow(2500));
requestAnimationFrame(frame);
