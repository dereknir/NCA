<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>にしなカードガチャ β</title>
<style>
  :root{--bg:#0a0a15;--panel:#141d31;--panel-2:#1a2440;--line:#243154;
        --text:#e8ecf6;--dim:#8b97b8;--accent:#3d63ff;--gold:#e8c94a;
        --artist-accent:#3d63ff;--font:"Noto Sans TC","Hiragino Sans",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;
       display:flex;flex-direction:column;align-items:center;padding:0 14px 60px}

  /* ── 站點 nav ── */
  .site-nav{width:100%;max-width:1200px;padding:14px 4px 8px;display:flex;
            justify-content:space-between;align-items:center;font-size:13px}
  .site-nav a{color:var(--dim);text-decoration:none}
  .site-nav a.home{color:var(--text);font-weight:600}
  .site-nav a:hover{color:var(--accent)}
  .site-nav .links{display:flex;gap:20px;flex-wrap:wrap;justify-content:flex-end}

  h1{font-size:22px;letter-spacing:.12em;margin-top:18px}
  h1 .beta{color:var(--gold)}
  .sub{color:var(--dim);font-size:12px;margin-top:6px;text-align:center;line-height:1.7;margin-bottom:18px}

  /* ── 三欄:歌手 rail | 舞台 | 圖鑑 ── */
  #app{display:grid;grid-template-columns:64px minmax(300px,1fr) 380px;gap:14px;
       width:min(1120px,100%);align-items:start}

  /* 歌手欄 */
  #rail{display:flex;flex-direction:column;gap:10px;background:var(--panel);
        border:1px solid var(--line);border-radius:12px;padding:10px 8px;
        position:sticky;top:14px}
  .artist{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);
        display:flex;align-items:center;justify-content:center;font-size:18px;
        cursor:pointer;background:var(--panel-2);color:var(--text);
        position:relative;font-family:inherit;transition:transform .15s}
  .artist:not(.locked):hover{transform:translateY(-2px)}
  .artist.active{background:var(--artist-accent);border-color:var(--artist-accent);
        box-shadow:0 0 12px 0 color-mix(in srgb,var(--artist-accent) 55%, transparent)}
  .artist.locked{opacity:.38;cursor:not-allowed}
  .artist.locked::after{content:attr(data-tip);position:absolute;left:56px;top:50%;
        transform:translateY(-50%);background:var(--panel-2);border:1px solid var(--line);
        border-radius:8px;padding:4px 10px;font-size:11px;color:var(--dim);white-space:nowrap;
        opacity:0;pointer-events:none;transition:opacity .15s;z-index:5}
  .artist.locked:hover::after{opacity:1}

  /* 舞台 */
  #stagePanel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:16px;display:flex;flex-direction:column;align-items:center;
        position:relative;min-height:520px}
  #stageTitle{font-size:15px;letter-spacing:.12em}
  #stageTitle b{color:var(--artist-accent)}
  #machine{margin-top:10px;image-rendering:pixelated;cursor:pointer;max-width:100%;
           width:min(420px,100%);height:auto}
  #machine.shake{animation:mshake .3s}
  @keyframes mshake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  #hint{color:var(--dim);font-size:12px;margin-top:8px;text-align:center;min-height:16px}

  /* hero 卡覆蓋層 */
  #hero{position:absolute;inset:0;display:none;flex-direction:column;
        align-items:center;justify-content:center;background:rgba(10,10,21,.82);
        border-radius:12px;z-index:4;padding:20px}
  #hero.show{display:flex}
  #heroCard{width:min(86%,420px);image-rendering:pixelated;border-radius:6px;
        box-shadow:0 18px 60px rgba(0,0,0,.6);cursor:pointer}
  #hero.show #heroCard{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.4) rotate(-5deg);opacity:0}100%{transform:none;opacity:1}}
  #heroMeta{margin-top:12px;display:flex;gap:10px;align-items:center;font-size:13px;
        flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:12px;color:var(--dim)}
  .chip.r-R{border-color:var(--accent);color:var(--accent)}
  .chip.r-SR,.chip.r-LIVE{border-color:var(--gold);color:var(--gold)}
  #hero button,#modal button{background:var(--panel-2);color:var(--text);
        border:1px solid var(--line);border-radius:10px;padding:8px 16px;
        font-size:13px;cursor:pointer;font-family:inherit}
  #hero button:hover,#modal button:hover{border-color:var(--artist-accent)}
  #heroSong a{color:var(--text);text-decoration:none}
  #heroSong a:hover{color:var(--artist-accent)}

  /* 飛行複製體 */
  #flyer{position:fixed;z-index:60;image-rendering:pixelated;border-radius:4px;
        display:none;pointer-events:none;transition:all .55s cubic-bezier(.5,.05,.3,1)}

  /* 圖鑑 */
  #bookPanel{display:flex;flex-direction:column;gap:8px}
  #bookHead{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
  #bookHead .t{font-size:14px}
  #bookHead .n{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  #backpack{--bp-max-h:560px}

  /* 彈窗 */
  #modal{position:fixed;inset:0;background:rgba(6,8,16,.8);display:none;
        align-items:center;justify-content:center;z-index:80;padding:20px}
  #modal.show{display:flex}
  #modalBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:18px;display:flex;flex-direction:column;align-items:center;
        gap:12px;max-width:560px;width:100%}
  #modalCard{width:100%;image-rendering:pixelated;border-radius:6px}
  #modalMeta{display:flex;gap:10px;align-items:center;font-size:13px;flex-wrap:wrap;justify-content:center}
  #modalMeta a{color:var(--text);text-decoration:none}
  #modalMeta a:hover{color:var(--artist-accent)}

  footer{margin-top:36px;color:#5a6784;font-size:11.5px;text-align:center;line-height:1.8}

  @media(max-width:820px){
    #app{grid-template-columns:1fr;gap:16px}
    #rail{flex-direction:row;position:static;width:100%;justify-content:center;
          overflow-x:auto}
    .artist.locked::after{left:50%;top:56px;transform:translateX(-50%)}
    #bookPanel{order:3}
  }
</style>
</head>

<h1>にしなカードガチャ <span class="beta">β</span></h1>
<p class="sub">點扭蛋機抽一張獨一無二的歌詞卡・演出中再點一下可跳過</p>

<div id="app">
  <nav id="rail"></nav>

  <section id="stagePanel">
    <div id="stageTitle"><b id="artistName">にしな</b> の扭蛋機</div>
    <canvas id="machine" width="600" height="550" title="點機器抽一張(演出中再點可跳過)"></canvas>
    <div id="hint">載入中…</div>

<canvas id="flyer" width="168" height="126"></canvas>

<footer>測試版:不限次數・reduced-motion 使用者自動跳過演出。<br>抽卡紀錄存於本機瀏覽器,圖鑑進度即時同步。</footer>

<script type="module">
import * as E from './engine.js';
import { drawMachine, drawCapsule, MACHINE_W, MPAL } from './machine.js';
import { createBackpack } from './backpack.js';

/* ===== 站長策展區 ===== */
const songUrl = id => `/translations/${id}`;
const RATES = [['LIVE', 1], ['SR', 5], ['R', 16], ['N', 78]];
// LIVE 池於 boot() 自動從 live_pool.json 注入 (從 anchor 生的)
const CURATED = { R: [], SR: [], LIVE: [] };
// 歌手清單。Tuki. / ユイカ 之後有翻譯 md 再解鎖 (locked:false + 塞 theme)
const ARTISTS = [
  { id: 'nishina', displayName: 'にしな', short: 'に', locked: false,
    theme: '#3d63ff', themeRGB: [61, 99, 255] },
  { id: 'tuki',    displayName: 'Tuki.',  short: 'T', locked: true },
  { id: 'yuika',   displayName: 'ユイカ', short: 'ユ', locked: true },
];
const LOG_KEY = 'nishina-gacha-log';
/* ===================== */

const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let POOL = null, busy = false, skip = false, current = null;
let activeArtist = ARTISTS[0];
let backpack = null, log = [];

function loadLog() {
  try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch (e) { return []; }
}
function saveLog() {
  try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); } catch (e) {}
}
function songsByArtist(artistId) {
  if (!POOL) return [];
  return POOL.pool.filter(s => s.id.split('-')[0] === artistId);
}
function artistTotalCards(artistId) {
  return songsByArtist(artistId).reduce((n, s) => n + s.lines.length, 0);
}

/* ---------- 歌手 rail ---------- */
function renderRail() {
  const rail = $('rail');
  rail.innerHTML = '';
  for (const a of ARTISTS) {
    const b = document.createElement('button');
    b.className = 'artist' + (a.locked ? ' locked' : '') + (a === activeArtist ? ' active' : '');
    b.textContent = a.locked ? '🔒' : a.short;
    if (a.locked) b.dataset.tip = `${a.displayName} · Coming soon`;
    else b.onclick = () => { activeArtist = a; applyArtist(); };
    rail.appendChild(b);
  }
}
function applyArtist() {
  document.documentElement.style.setProperty('--artist-accent', activeArtist.theme);
  $('artistName').textContent = activeArtist.displayName;
  renderRail();
  backpack && backpack.setActive(activeArtist.id);
  updateBookCount();
}

/* ---------- 場景繪製 (rAF loop) ---------- */
const SW = 120, SH = 110;
const mCv = $('machine'), mCtx = mCv.getContext('2d');
const small = new OffscreenCanvas(SW, SH), sCtx = small.getContext('2d');
const scene = { t: 0, knob: 0, hatch: null, capsule: null,
                flash: 0, flashColor: [255,255,255], confetti: [] };
function paintScene() {
  const img = sCtx.createImageData(SW, SH), d = img.data;
  for (let i = 0; i < d.length; i += 4) { d[i]=10; d[i+1]=10; d[i+2]=21; d[i+3]=255; }
  const put = (x, y, c) => {
    x |= 0; y |= 0;
    if (x < 0 || y < 0 || x >= SW || y >= SH) return;
    const i = (y * SW + x) * 4;
    d[i] = c[0]; d[i+1] = c[1]; d[i+2] = c[2];
  };
  drawMachine(put, (SW - MACHINE_W) >> 1, 6, {
    knob: scene.knob, bob: Math.floor(scene.t / 500) % 2,
    hatchCapsule: scene.hatch, theme: activeArtist.themeRGB ?? null,
  });
  if (scene.capsule?.visible)
    drawCapsule(put, scene.capsule.x, scene.capsule.y, scene.capsule.color, 6, scene.capsule.crack);
  for (const p of scene.confetti) {
    put(p.x, p.y, p.c); put(p.x+1, p.y, p.c); put(p.x, p.y+1, p.c); put(p.x+1, p.y+1, p.c);
  }
  if (scene.flash > 0) {
    const r = (1 - scene.flash) * 70 + 8;
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
      const dist = x*x + y*y;
      if (dist <= r*r && dist > (r-3)*(r-3)) put(60 + x, 96 + y, scene.flashColor);
    }
  }
  sCtx.putImageData(img, 0, 0);
  mCtx.imageSmoothingEnabled = false;
  mCtx.clearRect(0, 0, mCv.width, mCv.height);
  mCtx.drawImage(small, 0, 0, mCv.width, mCv.height);
}
(function loop(ts) {
  scene.t = ts || 0;
  for (const p of scene.confetti) { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--; }
  scene.confetti = scene.confetti.filter(p => p.life > 0 && p.y < SH);
  if (scene.flash > 0) scene.flash -= 0.06;
  paintScene();
  requestAnimationFrame(loop);
})();

/* ---------- 可跳過的 wait ---------- */
const wait = ms => new Promise(res => {
  const t0 = performance.now();
  (function chk() {
    if (skip || performance.now() - t0 >= ms) return res();
    requestAnimationFrame(chk);
  })();
});

/* ---------- 抽選 ---------- */
function rollRarity() {
  const x = Math.random() * 100; let acc = 0;
  for (const [t, p] of RATES) { acc += p; if (x < acc) return t; }
  return 'N';
}
function pickIdentity(tier) {
  const order = ['LIVE', 'SR', 'R', 'N'];
  const artistPool = songsByArtist(activeArtist.id);
  for (let i = order.indexOf(tier); i < order.length; i++) {
    const t = order[i];
    if (t === 'N') {
      const song = artistPool[Math.floor(Math.random() * artistPool.length)];
      const line = song.lines[Math.floor(Math.random() * song.lines.length)];
      return { song, line, rarity: 'N' };
    }
    const list = CURATED[t];
    if (list?.length) {
      const id = list[Math.floor(Math.random() * list.length)];
      const [sid, idx] = id.split('#');
      // curated 只在 activeArtist 的池裡查
      const song = artistPool.find(s => s.id === sid);
      const line = song?.lines.find(l => l.i === Number(idx));
      if (song && line) return { song, line, rarity: t };
    }
  }
}

/* ---------- 卡渲染 (共用管線, 輸出到任意 canvas) ---------- */
function renderCardTo(canvas, song, line, seed, rarity) {
  const dd = { titleJa: song.title, lyricJa: line.ja, lyricZh: line.zh,
               album: song.album, accent: song.accent, motif: song.motif };
  const L = E.computeLayout(dd);
  const { buf, palette: p } = E.buildCardArt(dd, L, seed, rarity);
  const oc = new OffscreenCanvas(E.W, E.H), o = oc.getContext('2d');
  const img = o.createImageData(E.W, E.H);
  for (let i = 0, j = 0; i < buf.data.length; i += 3, j += 4) {
    img.data[j] = buf.data[i]; img.data[j+1] = buf.data[i+1];
    img.data[j+2] = buf.data[i+2]; img.data[j+3] = 255;
  }
  o.putImageData(img, 0, 0);
  const txt = new OffscreenCanvas(E.W, E.H), t = txt.getContext('2d');
  t.textBaseline = 'top';
  const put = (str, x, y, size, fam, color) => {
    t.font = `${size}px ${fam}`;
    t.fillStyle = `rgb(${color[0]},${color[1]},${color[2]})`;
    t.fillText(str, x, y);
  };
  put('にしな', 10, 10, 12, 'JP12', p.dim);
  put(song.album, E.W - 8 - E.textWidth(song.album, 12), 10, 12, 'JP12', p.gold);
  put(song.title, E.MARGIN, 32, L.titleSize, E.famJP[L.titleSize], p.light);
  put(line.ja, E.MARGIN, L.lyricTop, L.lyricSize, E.famJP[L.lyricSize], p.text);
  if (line.zh && !L.zhDropped)
    put(line.zh, E.MARGIN, L.zhTop, L.zhSize, E.famTC[L.zhSize], p.dim);
  const ti = t.getImageData(0, 0, E.W, E.H);
  for (let j = 3; j < ti.data.length; j += 4) ti.data[j] = ti.data[j] >= 128 ? 255 : 0;
  t.putImageData(ti, 0, 0);
  o.drawImage(txt, 0, 0);
  const comp = o.getImageData(0, 0, E.W, E.H);
  const rgb = new Uint8Array(E.W * E.H * 3);
  for (let i = 0, j = 0; i < rgb.length; i += 3, j += 4) {
    rgb[i] = comp.data[j]; rgb[i+1] = comp.data[j+1]; rgb[i+2] = comp.data[j+2];
  }
  E.snapToPalette(rgb, p);
  for (let i = 0, j = 0; i < rgb.length; i += 3, j += 4) {
    comp.data[j] = rgb[i]; comp.data[j+1] = rgb[i+1]; comp.data[j+2] = rgb[i+2];
  }
  o.putImageData(comp, 0, 0);
  const c = canvas.getContext('2d');
  c.imageSmoothingEnabled = false;
  c.clearRect(0, 0, canvas.width, canvas.height);
  c.drawImage(oc, 0, 0, canvas.width, canvas.height);
}

/* ---------- 演出編排(skip 支援) ---------- */
const RARITY_FLASH = { N: [200,216,246], R: [90,130,255], SR: [232,201,74], LIVE: [232,201,74] };
async function choreography(rarity, colorIdx) {
  scene.knob = 1; await wait(160);
  if (!skip) mCv.classList.add('shake');
  scene.knob = 2; await wait(200);
  mCv.classList.remove('shake');
  scene.hatch = colorIdx; await wait(260);
  scene.hatch = null;
  scene.capsule = { x: 71, y: 79, vy: 0, color: MPAL.capsules[colorIdx % 5], crack: 0, visible: true };
  let vy = -0.8, x = 71;
  for (let f = 0; f < 60 && !skip; f++) {
    vy += 0.14; scene.capsule.y += vy;
    if (x < 60) { x += 0.6; scene.capsule.x = x; }
    if (scene.capsule.y >= 96) { scene.capsule.y = 96; if (Math.abs(vy) < 0.5) break; vy = -vy * 0.45; }
    await new Promise(r => setTimeout(r, 16));
  }
  scene.capsule.x = 60; scene.capsule.y = 96;
  const shakes = (rarity === 'SR' || rarity === 'LIVE') ? 3 : 1;
  for (let s = 0; s < shakes && !skip; s++) {
    for (const dx of [-2, 2, -2, 2, 0]) { scene.capsule.x = 60 + dx; await wait(50); }
    await wait(s < shakes - 1 ? 240 : 80);
  }
  scene.capsule.crack = 1; await wait(140);
  scene.capsule.crack = 2; await wait(120);
  scene.flashColor = RARITY_FLASH[rarity]; scene.flash = 1;
  scene.capsule.visible = false;
  const colors = rarity === 'SR' || rarity === 'LIVE'
    ? [MPAL.gold, MPAL.white, [255,226,130]]
    : [MPAL.white, [140,170,255], MPAL.capsules[colorIdx % 5]];
  for (let i = 0; i < 42; i++) scene.confetti.push({
    x: 60, y: 96, vx: (Math.random()-0.5)*3.2, vy: -Math.random()*3-0.6,
    life: 40 + Math.random()*25, c: colors[i % colors.length],
  });
  await wait(200);
}

/* ---------- hero → 飛入圖鑑 ---------- */
function flyToSlot(identity) {
  return new Promise(resolve => {
    const slotEl = document.querySelector(`[data-id="${identity.song.id}#${identity.line.i}"]`);
    const flyer = $('flyer');
    if (!slotEl || reduced) { resolve(); return; }
    slotEl.scrollIntoView({ block: 'nearest' });
    const from = $('heroCard').getBoundingClientRect();
    const to = slotEl.getBoundingClientRect();
    renderCardTo(flyer, identity.song, identity.line, identity.seed, identity.rarity);
    Object.assign(flyer.style, {
      display: 'block', transition: 'none',
      left: from.left + 'px', top: from.top + 'px',
      width: from.width + 'px', height: from.height + 'px', opacity: 1,
    });
    void flyer.offsetWidth;
    Object.assign(flyer.style, {
      transition: 'all .55s cubic-bezier(.5,.05,.3,1)',
      left: to.left + 'px', top: to.top + 'px',
      width: to.width + 'px', height: to.height + 'px', opacity: .9,
    });
    flyer.addEventListener('transitionend', () => {
      flyer.style.display = 'none'; resolve();
    }, { once: true });
  });
}

async function collectHero() {
  if (!current) return;
  $('hero').classList.remove('show');
  await flyToSlot(current);
  backpack.refresh(log);
  backpack.highlightLatest(current);
  updateBookCount();
  busy = false;
  $('hint').textContent = '再點機器抽下一張';
}

/* ---------- 主流程 ---------- */
async function drawOne() {
  if (!POOL) return;
  if (busy) { skip = true; return; }        // 演出中再點 = 跳過
  busy = true; skip = false;
  $('hero').classList.remove('show');
  $('hint').textContent = '抽選中…(再點一下可跳過演出)';
  const picked = pickIdentity(rollRarity());
  if (!picked) { busy = false; $('hint').textContent = '此歌手池尚未開放'; return; }
  const { song, line, rarity } = picked;
  const seed = (Math.random() * 0xFFFFFFFF) >>> 0;
  current = { song, line, rarity, seed };
  renderCardTo($('heroCard'), song, line, seed, rarity);
  log.push({ id: `${song.id}#${line.i}`, rarity, seed, ts: Date.now() });
  saveLog();

  if (!reduced) await choreography(rarity, Math.floor(Math.random() * 5));
  $('heroRarity').textContent = rarity;
  $('heroRarity').className = `chip r-${rarity}`;
  $('heroSong').innerHTML =
    `<a href="${songUrl(song.id)}" target="_blank">${escapeHtml(song.title)} → #${line.i}</a>`;
  $('hero').classList.add('show');
  $('hint').textContent = '點卡片或「收進圖鑑」';
  skip = false;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g,
    c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

$('machine').onclick = drawOne;
$('heroCard').onclick = collectHero;
$('heroKeep').onclick = collectHero;
$('heroDl').onclick = () => {
  if (!current) return;
  const a = document.createElement('a');
  a.download = `${current.song.id}-${current.line.i}-${current.seed.toString(16)}.png`;
  a.href = $('heroCard').toDataURL('image/png');
  a.click();
};

/* ---------- 圖鑑 ---------- */
function updateBookCount() {
  const uniq = new Set(log.filter(e => e.id.split('-')[0] === activeArtist.id).map(e => e.id)).size;
  const total = POOL ? artistTotalCards(activeArtist.id) : 0;
  $('bookCount').textContent = total ? `${uniq} / ${total}` : '—';
}
let modalCur = null;
function openModal(identity) {
  modalCur = identity;
  renderCardTo($('modalCard'), identity.song, identity.line, identity.seed, identity.rarity);
  $('modalRarity').textContent = identity.rarity;
  $('modalRarity').className = `chip r-${identity.rarity}`;
  $('modalSong').innerHTML =
    `<a href="${songUrl(identity.song.id)}" target="_blank">${escapeHtml(identity.song.title)} → #${identity.line.i}</a>`;
  $('modal').classList.add('show');
}
$('modalClose').onclick = () => $('modal').classList.remove('show');
$('modal').onclick = e => { if (e.target === $('modal')) $('modal').classList.remove('show'); };
$('modalDl').onclick = () => {
  if (!modalCur) return;
  const a = document.createElement('a');
  a.download = `${modalCur.song.id}-${modalCur.line.i}-${modalCur.seed.toString(16)}.png`;
  a.href = $('modalCard').toDataURL('image/png');
  a.click();
};

/* ---------- 啟動 ---------- */
const FONTS = [
  ['JP12','fonts/fusion-pixel-12px-proportional-ja.sub.ttf'],
  ['JP10','fonts/fusion-pixel-10px-proportional-ja.sub.ttf'],
  ['JP8','fonts/fusion-pixel-8px-proportional-ja.sub.ttf'],
  ['TC12','fonts/fusion-pixel-12px-proportional-zh_hant.sub.ttf'],
  ['TC10','fonts/fusion-pixel-10px-proportional-zh_hant.sub.ttf'],
  ['TC8','fonts/fusion-pixel-8px-proportional-zh_hant.sub.ttf'],
];
(async () => {
  renderRail();
  try {
    await Promise.all(FONTS.map(async ([n, u]) => {
      const f = new FontFace(n, `url(${u})`); await f.load(); document.fonts.add(f);
    }));
    POOL = await fetch('pool.json').then(r => r.json());
    log = loadLog();

    // 自動注入 LIVE 池 (從 annotation anchors 生的)
    try {
      const auto = await fetch('live_pool.json').then(r => r.ok ? r.json() : []);
      if (Array.isArray(auto) && auto.length) {
        const seen = new Set(CURATED.LIVE);
        for (const id of auto) if (!seen.has(id)) { CURATED.LIVE.push(id); seen.add(id); }
      }
    } catch (e) { /* 沒有 live_pool 也沒差, 全池降級 N */ }

    backpack = createBackpack($('backpack'), {
      artists: ARTISTS.map(a => ({
        id: a.id, displayName: a.displayName, locked: a.locked,
        totalCards: artistTotalCards(a.id),
      })),
      activeArtist: activeArtist.id,
      showTabs: false,                              // rail 已經是歌手切換 UI
      getSongsForArtist: songsByArtist,
      log,
      onSlotClick: openModal,
      onTabSwitch: () => {},                        // showTabs:false 用不到
    });
    applyArtist();
    $('hint').textContent = `點機器抽一張(圖鑑 ${artistTotalCards('nishina')} 格)`;
  } catch (e) {
    $('hint').textContent = '載入失敗:請以 http server 啟動';
    console.error(e);
  }
})();
</script>
</body>
</html>
