<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>にしなカードガチャ β</title>
<style>
  :root{--bg:#0a0a15;--panel:#141d31;--line:#243154;--text:#e8ecf6;--dim:#8b97b8;
        --accent:#3d63ff;--gold:#e8c94a;--font:"Noto Sans TC","Hiragino Sans",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;
       display:flex;flex-direction:column;align-items:center;padding:0 16px 80px}
  .site-nav{width:100%;max-width:1200px;padding:14px 4px 26px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
  .site-nav a{color:var(--dim);text-decoration:none}
  .site-nav a.home{color:var(--text);font-weight:600}
  .site-nav a:hover{color:var(--accent)}
  .site-nav .links{display:flex;gap:20px;flex-wrap:wrap;justify-content:flex-end}
  h1{font-size:24px;letter-spacing:.12em}
  .sub{color:var(--dim);font-size:12.5px;margin-top:8px;text-align:center;line-height:1.7}
  #stage{margin-top:30px;width:min(560px,94vw);aspect-ratio:4/3;display:flex;align-items:center;
         justify-content:center;position:relative}
  #card{width:100%;image-rendering:pixelated;border-radius:6px;display:none;
        box-shadow:0 18px 60px rgba(0,0,0,.55)}
  #card.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.5) rotate(-4deg);opacity:0}100%{transform:none;opacity:1}}
  #placeholder{color:var(--dim);font-size:14px;border:1px dashed var(--line);border-radius:12px;
               width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  #info{margin-top:16px;display:none;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;
        font-size:13.5px}
  #info a{color:var(--accent);text-decoration:none}
  .chip{border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:12px;color:var(--dim)}
  .chip.r-N{border-color:var(--line)}
  .chip.r-R{border-color:var(--accent);color:var(--accent)}
  .chip.r-SR,.chip.r-LIVE{border-color:var(--gold);color:var(--gold)}
  .id{font-family:monospace;font-size:11px;color:#5a6784}
  .row{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;
         padding:13px 26px;font-size:15px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:wait}
  #draw{background:var(--accent);border-color:var(--accent);font-weight:700;letter-spacing:.1em}
  #hist{margin-top:34px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:820px}
  #hist img{width:96px;border-radius:4px;image-rendering:pixelated;border:1px solid var(--line);cursor:pointer}
  #stat{margin-top:14px;color:var(--dim);font-size:12px}
  footer{margin-top:60px;color:#5a6784;font-size:11.5px;text-align:center;line-height:1.8}
</style>
</head>
<body>
<nav class="site-nav">
  <a href="/" class="home">Derek's Site</a>
  <div class="links">
    <a href="/translations">日文歌翻譯</a>
    <a href="/lyric-universe/">歌詞宇宙</a>
    <a href="/kwic/">歌詞索引</a>
    <a href="/star-map/">歌詞星圖</a>
  </div>
</nav>
<h1>にしなカードガチャ <span style="color:var(--gold)">β</span></h1>
<p class="sub">每一次抽選都是一張獨一無二的歌詞卡<br>身分(歌×句)共 <b id="poolN">…</b> 種・印刷(星空)無限</p>

<div id="stage">
  <div id="placeholder">載入字型中…</div>
  <canvas id="card" width="840" height="630"></canvas>
</div>

<div id="info">
  <span class="chip" id="rarity"></span>
  <a id="songLink" href="#" target="_blank"></a>
  <span class="id" id="cardId"></span>
</div>

<div class="row">
  <button id="draw" disabled>抽一張</button>
  <button id="dl" style="display:none">下載 PNG</button>
</div>

<div id="hist"></div>
<div id="stat"></div>

<footer>測試版:不限次數。正式版一天一抽(處方箋機制)。<br>抽卡紀錄存於本機瀏覽器,未來收集冊將回溯計入。</footer>

<script type="module">
import * as E from './engine.js';

/* ===== 站長策展區 ===== */
// TODO(Claude Code): songUrl 對齊站內路由
const songUrl = id => `/translations/${id}`;
// 機率表(百分比)。R/SR/LIVE 池為空時自動降級抽下一階。
const RATES = [['LIVE', 1], ['SR', 5], ['R', 16], ['N', 78]];
// 策展卡表:身分 id = `${songId}#${lineIndex}`。站長填入後即生效。
// LIVE 池於 boot() 自動注入 (從 annotation/shorts_anchors.json 已標 anchor 的句子生 live_pool.json)
const CURATED = {
  R: [],      // 例: ['nishina-plum#14', ...]
  SR: [],     // 名句(每首 2-3 句)
  LIVE: [],   // 自動注入 — 若要手工加也 OK, 兩邊 union
};
/* ===================== */

const $ = id => document.getElementById(id);
const cardCv = $('card'), ctx = cardCv.getContext('2d');
let POOL = null, current = null;

/* ---------- 字型 ---------- */
const FONTS = [
  ['JP12', 'fonts/fusion-pixel-12px-proportional-ja.sub.ttf'],
  ['JP10', 'fonts/fusion-pixel-10px-proportional-ja.sub.ttf'],
  ['JP8', 'fonts/fusion-pixel-8px-proportional-ja.sub.ttf'],
  ['TC12', 'fonts/fusion-pixel-12px-proportional-zh_hant.sub.ttf'],
  ['TC10', 'fonts/fusion-pixel-10px-proportional-zh_hant.sub.ttf'],
  ['TC8', 'fonts/fusion-pixel-8px-proportional-zh_hant.sub.ttf'],
];
async function boot() {
  try {
    await Promise.all(FONTS.map(async ([name, url]) => {
      const f = new FontFace(name, `url(${url})`);
      await f.load(); document.fonts.add(f);
    }));
    POOL = await fetch('pool.json').then(r => r.json());
    $('poolN').textContent = POOL.meta.cards;
    // 自動注入 LIVE 池 (載入失敗就沿用手工的 CURATED.LIVE)
    try {
      const auto = await fetch('live_pool.json').then(r => r.ok ? r.json() : []);
      if (Array.isArray(auto) && auto.length) {
        const seen = new Set(CURATED.LIVE);
        for (const id of auto) if (!seen.has(id)) { CURATED.LIVE.push(id); seen.add(id); }
      }
    } catch (e) { /* live_pool 不存在也可以, LIVE 池會退化為空 → 自動降級到 SR/R/N */ }
    $('placeholder').textContent = '準備好了——抽一張吧';
    $('draw').disabled = false;
  } catch (e) {
    $('placeholder').textContent = '載入失敗:請用 python -m http.server 啟動後開啟本頁';
    console.error(e);
  }
}

/* ---------- 抽選 ---------- */
function rollRarity() {
  const x = Math.random() * 100;
  let acc = 0;
  for (const [tier, p] of RATES) {
    acc += p;
    if (x < acc) return tier;
  }
  return 'N';
}
function pickIdentity(tier) {
  // 池空降級:LIVE→SR→R→N
  const order = ['LIVE', 'SR', 'R', 'N'];
  for (let i = order.indexOf(tier); i < order.length; i++) {
    const t = order[i];
    if (t === 'N') {
      const song = POOL.pool[Math.floor(Math.random() * POOL.pool.length)];
      const line = song.lines[Math.floor(Math.random() * song.lines.length)];
      return { song, line, rarity: 'N' };
    }
    const list = CURATED[t];
    if (list && list.length) {
      const id = list[Math.floor(Math.random() * list.length)];
      const [sid, idx] = id.split('#');
      const song = POOL.pool.find(s => s.id === sid);
      const line = song?.lines.find(l => l.i === Number(idx));
      if (song && line) return { song, line, rarity: t };
    }
  }
}

/* ---------- 渲染(canvas 版管線) ---------- */
function renderCard(song, line, seed, rarity) {
  const d = { titleJa: song.title, lyricJa: line.ja, lyricZh: line.zh,
              album: song.album, accent: song.accent, motif: song.motif };
  const L = E.computeLayout(d);
  const { buf, palette: p } = E.buildCardArt(d, L, seed, rarity);

  // 1) 背景 buffer → 小畫布
  const small = new OffscreenCanvas(E.W, E.H);
  const sctx = small.getContext('2d');
  const img = sctx.createImageData(E.W, E.H);
  for (let i = 0, j = 0; i < buf.data.length; i += 3, j += 4) {
    img.data[j] = buf.data[i]; img.data[j + 1] = buf.data[i + 1];
    img.data[j + 2] = buf.data[i + 2]; img.data[j + 3] = 255;
  }
  sctx.putImageData(img, 0, 0);

  // 2) 文字層(FontFace 原生渲染 → alpha 二值化)
  const txt = new OffscreenCanvas(E.W, E.H);
  const t = txt.getContext('2d');
  t.textBaseline = 'top';
  const put = (str, x, y, size, fam, color) => {
    t.font = `${size}px ${fam}`;
    t.fillStyle = `rgb(${color[0]},${color[1]},${color[2]})`;
    t.fillText(str, x, y);
  };
  put('にしな', 10, 10, 12, 'JP12', p.dim);
  const albW = E.textWidth(song.album, 12);
  put(song.album, E.W - 8 - albW, 10, 12, 'JP12', p.gold);
  put(song.title, E.MARGIN, 32, L.titleSize, E.famJP[L.titleSize], p.light);
  put(line.ja, E.MARGIN, L.lyricTop, L.lyricSize, E.famJP[L.lyricSize], p.text);
  if (line.zh && !L.zhDropped)
    put(line.zh, E.MARGIN, L.zhTop, L.zhSize, E.famTC[L.zhSize], p.dim);
  const ti = t.getImageData(0, 0, E.W, E.H);
  for (let j = 3; j < ti.data.length; j += 4) ti.data[j] = ti.data[j] >= 128 ? 255 : 0;
  t.putImageData(ti, 0, 0);

  // 3) 合成 → 調色盤吸附
  sctx.drawImage(txt, 0, 0);
  const comp = sctx.getImageData(0, 0, E.W, E.H);
  const rgb = new Uint8Array(E.W * E.H * 3);
  for (let i = 0, j = 0; j < comp.data.length; i += 3, j += 4) {
    rgb[i] = comp.data[j]; rgb[i + 1] = comp.data[j + 1]; rgb[i + 2] = comp.data[j + 2];
  }
  E.snapToPalette(rgb, p);
  for (let i = 0, j = 0; i < rgb.length; i += 3, j += 4) {
    comp.data[j] = rgb[i]; comp.data[j + 1] = rgb[i + 1]; comp.data[j + 2] = rgb[i + 2];
  }
  sctx.putImageData(comp, 0, 0);

  // 4) 最近鄰 ×5
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, cardCv.width, cardCv.height);
  ctx.drawImage(small, 0, 0, cardCv.width, cardCv.height);
}

/* ---------- 抽卡動線 ---------- */
let drawCount = 0;
async function drawOne() {
  $('draw').disabled = true;
  $('placeholder').style.display = 'none';
  const rarity = rollRarity();
  const { song, line, rarity: actual } = pickIdentity(rarity);
  const seed = (Math.random() * 0xFFFFFFFF) >>> 0;
  current = { song, line, rarity: actual, seed };
  renderCard(song, line, seed, actual);

  cardCv.style.display = 'block';
  cardCv.classList.remove('pop'); void cardCv.offsetWidth; cardCv.classList.add('pop');

  const idStr = `${song.id}#${line.i}`;
  $('rarity').textContent = actual; $('rarity').className = `chip r-${actual}`;
  $('songLink').textContent = `${song.title} →`; $('songLink').href = songUrl(song.id);
  $('cardId').textContent = `${idStr} · print:${seed.toString(16)}`;
  $('info').style.display = 'flex'; $('dl').style.display = 'inline-block';

  // 歷史 + 本機紀錄(未來收集冊回溯用)
  drawCount++;
  $('stat').textContent = `本次測試已抽 ${drawCount} 張`;
  const thumb = document.createElement('img');
  thumb.src = cardCv.toDataURL('image/png');
  thumb.title = `${song.title}#${line.i} (${actual})`;
  thumb.onclick = () => { renderCard(song, line, seed, actual); currentFromHist({ song, line, rarity: actual, seed }); };
  $('hist').prepend(thumb);
  try {
    const log = JSON.parse(localStorage.getItem('nishina-gacha-log') || '[]');
    log.push({ id: idStr, rarity: actual, seed, ts: Date.now() });
    localStorage.setItem('nishina-gacha-log', JSON.stringify(log));
  } catch (e) {}
  $('draw').disabled = false;
}
function currentFromHist(c) {
  current = c;
  $('rarity').textContent = c.rarity; $('rarity').className = `chip r-${c.rarity}`;
  $('songLink').textContent = `${c.song.title} →`; $('songLink').href = songUrl(c.song.id);
  $('cardId').textContent = `${c.song.id}#${c.line.i} · print:${c.seed.toString(16)}`;
}

$('draw').onclick = drawOne;
$('dl').onclick = () => {
  if (!current) return;
  const a = document.createElement('a');
  a.download = `nishina-${current.song.id.replace('nishina-', '')}-${current.line.i}-${current.seed.toString(16)}.png`;
  a.href = cardCv.toDataURL('image/png');
  a.click();
};
boot();
</script>
</body>
</html>
