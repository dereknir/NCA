<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>にしなカードガチャ β</title>
<style>
  :root{--bg:#0a0a15;--panel:#141d31;--line:#243154;--text:#e8ecf6;--dim:#8b97b8;
        --accent:#3d63ff;--gold:#e8c94a;--font:"Noto Sans TC","Hiragino Sans",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;
       display:flex;flex-direction:column;align-items:center;padding:0 16px 80px}

  .site-nav{width:100%;max-width:1200px;padding:14px 4px 22px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
  .site-nav a{color:var(--dim);text-decoration:none}
  .site-nav a.home{color:var(--text);font-weight:600}
  .site-nav a:hover{color:var(--accent)}
  .site-nav .links{display:flex;gap:20px;flex-wrap:wrap;justify-content:flex-end}

  h1{font-size:24px;letter-spacing:.12em}
  .sub{color:var(--dim);font-size:12.5px;margin-top:8px;text-align:center;line-height:1.7;margin-bottom:20px}

  /* ── 主要區塊: 桌面兩欄 / 手機單欄 ── */
  .gacha-main{width:100%;max-width:1100px;display:grid;
              grid-template-columns:minmax(300px,400px) minmax(0,1fr);
              gap:36px;align-items:start;margin-top:8px}
  @media (max-width:820px){
    .gacha-main{grid-template-columns:1fr;gap:22px;justify-items:center}
  }

  .col-machine{display:flex;flex-direction:column;align-items:center;position:sticky;top:20px}
  @media (max-width:820px){ .col-machine{position:static} }

  #machine{image-rendering:pixelated;cursor:default;border-radius:10px;
           width:min(360px,86vw);height:auto;transition:filter .2s}
  #machine.knob-hover{cursor:pointer;filter:brightness(1.06)}
  #machine.busy{cursor:wait;filter:none}
  #machine.shake{animation:mshake .3s}
  @keyframes mshake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  #hint{color:var(--dim);font-size:12.5px;margin-top:10px;min-height:16px;text-align:center}

  /* ── 右欄: 最新抽到 (預抽前用 placeholder 佔位) ── */
  .col-card{display:flex;flex-direction:column;align-items:center;width:100%;min-height:1px}
  #cardPlaceholder{width:100%;max-width:480px;aspect-ratio:4/3;border:1px dashed var(--line);
                   border-radius:12px;display:flex;flex-direction:column;align-items:center;
                   justify-content:center;color:var(--dim);font-size:13px;text-align:center;
                   line-height:1.9;padding:20px}
  #cardPlaceholder .ico{font-size:36px;margin-bottom:12px;opacity:.7}

  #cardWrap{width:100%;max-width:480px;display:none}
  #card{width:100%;image-rendering:pixelated;border-radius:6px;box-shadow:0 18px 60px rgba(0,0,0,.55)}
  #cardWrap.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.5) rotate(-4deg);opacity:0}100%{transform:none;opacity:1}}

  #info{margin-top:14px;display:none;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;
        font-size:13.5px}
  #info a{color:var(--accent);text-decoration:none}
  .chip{border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:12px;color:var(--dim)}
  .chip.r-N{border-color:var(--line)}
  .chip.r-R{border-color:var(--accent);color:var(--accent)}
  .chip.r-SR,.chip.r-LIVE{border-color:var(--gold);color:var(--gold)}
  .id{font-family:monospace;font-size:11px;color:#5a6784}

  .row{margin-top:14px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;
         padding:11px 22px;font-size:14px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:wait}
  #again{background:var(--accent);border-color:var(--accent);font-weight:700;letter-spacing:.08em}

  /* ── 收集冊背包位 (fable 之後注入 backpack.js) ── */
  #backpack{width:100%;max-width:1100px;margin-top:44px}
  .backpack-placeholder{background:var(--panel);border:1px solid var(--line);border-radius:8px;
                        padding:36px 20px;text-align:center;color:var(--dim);font-size:13px;line-height:1.9}
  .backpack-placeholder .tag{display:inline-block;background:rgba(232,201,74,.12);color:var(--gold);
                             border:1px solid rgba(232,201,74,.4);border-radius:99px;
                             padding:2px 10px;font-size:11px;margin-bottom:12px;letter-spacing:.05em}

  #stat{margin-top:14px;color:var(--dim);font-size:12px;text-align:center}
  footer{margin-top:44px;color:#5a6784;font-size:11.5px;text-align:center;line-height:1.8}
</style>
</head>
<body>
<nav class="site-nav">
  <a href="/" class="home">Derek's Site</a>
  <div class="links">
    <a href="/translations">日文歌翻譯</a>
    <a href="/lyric-universe/">歌詞宇宙</a>
    <a href="/kwic/">歌詞索引</a>
    <a href="/star-map/">歌詞星圖</a>
  </div>
</nav>

<h1>にしなカードガチャ <span style="color:var(--gold)">β</span></h1>
<p class="sub">轉動扭蛋機的金色旋鈕抽一張獨一無二的歌詞卡<br>身分(歌×句)共 <b id="poolN">…</b> 種・印刷(星空)無限</p>

<main class="gacha-main">
  <div class="col-machine">
    <canvas id="machine" width="600" height="550" title="點金色旋鈕抽卡"></canvas>
    <div id="hint">載入字型中…</div>
  </div>

  <div class="col-card">
    <div id="cardPlaceholder">
      <div class="ico">🎴</div>
      <div>轉動旋鈕,抽第一張<br>
      <span style="color:#5a6784">卡片會顯示在這裡</span></div>
    </div>
    <div id="cardWrap"><canvas id="card" width="840" height="630"></canvas></div>
    <div id="info">
      <span class="chip" id="rarity"></span>
      <a id="songLink" href="#" target="_blank"></a>
      <span class="id" id="cardId"></span>
    </div>
    <div class="row">
      <button id="dl" style="display:none">下載 PNG</button>
      <button id="again" style="display:none">再抽一張</button>
    </div>
  </div>
</main>

<div id="backpack">
  <div class="backpack-placeholder">
    <div class="tag">🎒 COMING SOON</div><br>
    收集冊 · 背包 UI 開發中<br>
    <span style="font-size:11.5px;color:#5a6784">已抽卡紀錄仍保留在本機 localStorage,背包完成後會回溯載入</span>
  </div>
</div>
<div id="stat"></div>

<footer>測試版:不限次數・reduced-motion 使用者自動跳過演出。<br>抽卡紀錄存於本機瀏覽器,未來收集冊將回溯計入。</footer>

<script type="module">
import * as E from './engine.js';
import { drawMachine, drawCapsule, MACHINE_W, MPAL } from './machine.js';

/* ===== 站長策展區 ===== */
const songUrl = id => `/translations/${id}`;
// 機率表(百分比)。R/SR/LIVE 池為空時自動降級抽下一階。
const RATES = [['LIVE', 1], ['SR', 5], ['R', 16], ['N', 78]];
// 策展卡表:身分 id = `${songId}#${lineIndex}`。站長填入後即生效。
// LIVE 池於 boot() 自動注入 (從 annotation/shorts_anchors.json 已標 anchor 的句子生 live_pool.json)
const CURATED = {
  R: [],      // 例: ['nishina-plum#14', ...]
  SR: [],     // 名句(每首 2-3 句)
  LIVE: [],   // 自動注入 — 若要手工加也 OK, 兩邊 union
};
/* ===================== */

const $ = id => document.getElementById(id);
const SW = 120, SH = 110;
const mCv = $('machine'), mCtx = mCv.getContext('2d');
const small = new OffscreenCanvas(SW, SH), sCtx = small.getContext('2d');
const cardCv = $('card'), cCtx = cardCv.getContext('2d');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let POOL = null, busy = false, current = null, drawCount = 0, ready = false;

/* ---------- 場景繪製(rAF) ---------- */
const scene = {
  t: 0, knob: 0, hatch: null,
  capsule: null,                             // {x, y, vy, color, crack, visible}
  flash: 0, flashColor: [255, 255, 255],
  confetti: [],
};
function paintScene() {
  const img = sCtx.createImageData(SW, SH);
  const d = img.data;
  // 底色 (與 --bg 一致)
  for (let i = 0; i < d.length; i += 4) { d[i] = 10; d[i+1] = 10; d[i+2] = 21; d[i+3] = 255; }
  const put = (x, y, c) => {
    x |= 0; y |= 0;
    if (x < 0 || y < 0 || x >= SW || y >= SH) return;
    const i = (y * SW + x) * 4;
    d[i] = c[0]; d[i+1] = c[1]; d[i+2] = c[2];
  };
  drawMachine(put, (SW - MACHINE_W) >> 1, 6, {
    knob: scene.knob, bob: Math.floor(scene.t / 500) % 2, hatchCapsule: scene.hatch,
  });
  if (scene.capsule?.visible)
    drawCapsule(put, scene.capsule.x, scene.capsule.y, scene.capsule.color, 6, scene.capsule.crack);
  for (const p of scene.confetti) {
    put(p.x, p.y, p.c); put(p.x + 1, p.y, p.c);
    put(p.x, p.y + 1, p.c); put(p.x + 1, p.y + 1, p.c);
  }
  if (scene.flash > 0) {
    const r = (1 - scene.flash) * 70 + 8, cx = 60, cy = 96;
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
      const dist = x * x + y * y;
      if (dist <= r * r && dist > (r - 3) * (r - 3)) put(cx + x, cy + y, scene.flashColor);
    }
  }
  sCtx.putImageData(img, 0, 0);
  mCtx.imageSmoothingEnabled = false;
  mCtx.clearRect(0, 0, mCv.width, mCv.height);
  mCtx.drawImage(small, 0, 0, mCv.width, mCv.height);
}
function loop(ts) {
  scene.t = ts;
  stepConfetti();
  if (scene.flash > 0) scene.flash -= 0.06;
  paintScene();
  requestAnimationFrame(loop);
}
function stepConfetti() {
  for (const p of scene.confetti) { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--; }
  scene.confetti = scene.confetti.filter(p => p.life > 0 && p.y < SH);
}

/* ---------- 抽選 ---------- */
function rollRarity() {
  const x = Math.random() * 100; let acc = 0;
  for (const [t, p] of RATES) { acc += p; if (x < acc) return t; }
  return 'N';
}
function pickIdentity(tier) {
  const order = ['LIVE', 'SR', 'R', 'N'];
  for (let i = order.indexOf(tier); i < order.length; i++) {
    const t = order[i];
    if (t === 'N') {
      const song = POOL.pool[Math.floor(Math.random() * POOL.pool.length)];
      const line = song.lines[Math.floor(Math.random() * song.lines.length)];
      return { song, line, rarity: 'N' };
    }
    const list = CURATED[t];
    if (list?.length) {
      const id = list[Math.floor(Math.random() * list.length)];
      const [sid, idx] = id.split('#');
      const song = POOL.pool.find(s => s.id === sid);
      const line = song?.lines.find(l => l.i === Number(idx));
      if (song && line) return { song, line, rarity: t };
    }
  }
}

/* ---------- 卡渲染 (canvas + FontFace + palette snap) ---------- */
function renderCard(song, line, seed, rarity) {
  const dd = {
    titleJa: song.title, lyricJa: line.ja, lyricZh: line.zh,
    album: song.album, accent: song.accent, motif: song.motif,
  };
  const L = E.computeLayout(dd);
  const { buf, palette: p } = E.buildCardArt(dd, L, seed, rarity);
  const oc = new OffscreenCanvas(E.W, E.H), o = oc.getContext('2d');
  const img = o.createImageData(E.W, E.H);
  for (let i = 0, j = 0; i < buf.data.length; i += 3, j += 4) {
    img.data[j] = buf.data[i]; img.data[j+1] = buf.data[i+1];
    img.data[j+2] = buf.data[i+2]; img.data[j+3] = 255;
  }
  o.putImageData(img, 0, 0);
  const txt = new OffscreenCanvas(E.W, E.H), t = txt.getContext('2d');
  t.textBaseline = 'top';
  const put = (str, x, y, size, fam, color) => {
    t.font = `${size}px ${fam}`;
    t.fillStyle = `rgb(${color[0]},${color[1]},${color[2]})`;
    t.fillText(str, x, y);
  };
  put('にしな', 10, 10, 12, 'JP12', p.dim);
  put(song.album, E.W - 8 - E.textWidth(song.album, 12), 10, 12, 'JP12', p.gold);
  put(song.title, E.MARGIN, 32, L.titleSize, E.famJP[L.titleSize], p.light);
  put(line.ja, E.MARGIN, L.lyricTop, L.lyricSize, E.famJP[L.lyricSize], p.text);
  if (line.zh && !L.zhDropped) put(line.zh, E.MARGIN, L.zhTop, L.zhSize, E.famTC[L.zhSize], p.dim);
  const ti = t.getImageData(0, 0, E.W, E.H);
  for (let j = 3; j < ti.data.length; j += 4) ti.data[j] = ti.data[j] >= 128 ? 255 : 0;
  t.putImageData(ti, 0, 0);
  o.drawImage(txt, 0, 0);
  const comp = o.getImageData(0, 0, E.W, E.H);
  const rgb = new Uint8Array(E.W * E.H * 3);
  for (let i = 0, j = 0; i < rgb.length; i += 3, j += 4) {
    rgb[i] = comp.data[j]; rgb[i+1] = comp.data[j+1]; rgb[i+2] = comp.data[j+2];
  }
  E.snapToPalette(rgb, p);
  for (let i = 0, j = 0; i < rgb.length; i += 3, j += 4) {
    comp.data[j] = rgb[i]; comp.data[j+1] = rgb[i+1]; comp.data[j+2] = rgb[i+2];
  }
  o.putImageData(comp, 0, 0);
  cCtx.imageSmoothingEnabled = false;
  cCtx.clearRect(0, 0, cardCv.width, cardCv.height);
  cCtx.drawImage(oc, 0, 0, cardCv.width, cardCv.height);
}

/* ---------- 演出編排 ---------- */
const wait = ms => new Promise(r => setTimeout(r, ms));
const RARITY_FLASH = { N: [200, 216, 246], R: [90, 130, 255], SR: [232, 201, 74], LIVE: [232, 201, 74] };

async function choreography(rarity, capsuleColorIdx) {
  // ① 轉旋鈕
  scene.knob = 1; await wait(160);
  mCv.classList.add('shake');
  scene.knob = 2; await wait(200);
  mCv.classList.remove('shake');
  // ② 蛋進取物口
  scene.hatch = capsuleColorIdx; await wait(260);
  // ③ 彈出落地
  scene.hatch = null;
  scene.capsule = { x: 71, y: 79, vy: 0, color: MPAL.capsules[capsuleColorIdx % 5], crack: 0, visible: true };
  const floorY = 96;
  let vy = -0.8, x = 71;
  for (let f = 0; f < 60; f++) {
    vy += 0.14;
    scene.capsule.y += vy;
    if (x < 60) { x += 0.6; scene.capsule.x = x; }
    if (scene.capsule.y >= floorY) {
      scene.capsule.y = floorY;
      if (Math.abs(vy) < 0.5) break;
      vy = -vy * 0.45;
    }
    await wait(16);
  }
  // ④ 搖晃 (SR/LIVE 多搖一輪吊胃口)
  const shakes = (rarity === 'SR' || rarity === 'LIVE') ? 3 : 1;
  for (let s = 0; s < shakes; s++) {
    for (const dx of [-2, 2, -2, 2, 0]) { scene.capsule.x = 60 + dx; await wait(50); }
    await wait(s < shakes - 1 ? 240 : 80);
  }
  // ⑤ 裂開 + 閃光 + 紙屑
  scene.capsule.crack = 1; await wait(140);
  scene.capsule.crack = 2; await wait(120);
  scene.flashColor = RARITY_FLASH[rarity]; scene.flash = 1;
  scene.capsule.visible = false;
  const colors = (rarity === 'SR' || rarity === 'LIVE')
    ? [MPAL.gold, MPAL.white, [255, 226, 130]]
    : [MPAL.white, [140, 170, 255], MPAL.capsules[capsuleColorIdx % 5]];
  for (let i = 0; i < 42; i++) {
    scene.confetti.push({
      x: 60, y: floorY, vx: (Math.random() - 0.5) * 3.2,
      vy: -Math.random() * 3 - 0.6, life: 40 + Math.random() * 25,
      c: colors[i % colors.length],
    });
  }
  await wait(220);
}

/* ---------- 主流程 ---------- */
async function drawOne() {
  if (busy || !ready) return;
  busy = true;
  mCv.classList.add('busy');
  mCv.classList.remove('knob-hover');
  $('hint').textContent = '抽選中…';
  const cph = $('cardPlaceholder');
  if (cph) cph.style.display = 'none';           // 首抽後就不再需要 placeholder
  $('cardWrap').style.display = 'none';
  $('info').style.display = 'none';
  $('dl').style.display = 'none';
  $('again').style.display = 'none';

  const { song, line, rarity } = pickIdentity(rollRarity());
  const seed = (Math.random() * 0xFFFFFFFF) >>> 0;
  current = { song, line, rarity, seed };
  renderCard(song, line, seed, rarity);  // 演出期間先畫好卡

  if (!reduced) await choreography(rarity, Math.floor(Math.random() * 5));

  $('cardWrap').style.display = 'block';
  $('cardWrap').classList.remove('pop'); void $('cardWrap').offsetWidth; $('cardWrap').classList.add('pop');
  const idStr = `${song.id}#${line.i}`;
  $('rarity').textContent = rarity; $('rarity').className = `chip r-${rarity}`;
  $('songLink').textContent = `${song.title} →`;
  $('songLink').href = songUrl(song.id);
  $('cardId').textContent = `${idStr} · print:${seed.toString(16)}`;
  $('info').style.display = 'flex';
  $('dl').style.display = 'inline-block';
  $('again').style.display = 'inline-block';

  drawCount++;
  $('hint').textContent = `再轉一次旋鈕抽下一張(本次已抽 ${drawCount})`;
  $('stat').textContent = `本次測試已抽 ${drawCount} 張 · 完整收集冊即將由背包 UI 呈現`;

  // 紀錄本機 log (背包 UI 完成後會回溯讀這裡)
  try {
    const log = JSON.parse(localStorage.getItem('nishina-gacha-log') || '[]');
    log.push({ id: idStr, rarity, seed, ts: Date.now() });
    localStorage.setItem('nishina-gacha-log', JSON.stringify(log));
  } catch (e) {}
  mCv.classList.remove('busy');
  busy = false;
}
function currentFromHist(c) {
  current = c;
  $('rarity').textContent = c.rarity; $('rarity').className = `chip r-${c.rarity}`;
  $('songLink').textContent = `${c.song.title} →`;
  $('songLink').href = songUrl(c.song.id);
  $('cardId').textContent = `${c.song.id}#${c.line.i} · print:${c.seed.toString(16)}`;
}

/* ---------- 只認旋鈕的 hit-test ---------- */
// 機器在 scene 座標 (32, 6); 旋鈕在 machine-local (20, 60) 半徑 7 → scene (52, 66)
const KNOB_SX = ((SW - MACHINE_W) >> 1) + 20;
const KNOB_SY = 6 + 60;
const KNOB_HIT_R = 10;  // 7 px 本體 + 少量觸控/滑鼠寬容
function knobHit(clientX, clientY) {
  const rect = mCv.getBoundingClientRect();
  // clientX/Y → canvas 內部座標 → scene 座標
  const sx = (clientX - rect.left) / rect.width * SW;
  const sy = (clientY - rect.top) / rect.height * SH;
  const dx = sx - KNOB_SX, dy = sy - KNOB_SY;
  return dx * dx + dy * dy <= KNOB_HIT_R * KNOB_HIT_R;
}
mCv.addEventListener('click', (e) => { if (knobHit(e.clientX, e.clientY)) drawOne(); });
mCv.addEventListener('mousemove', (e) => {
  if (busy) return;
  mCv.classList.toggle('knob-hover', knobHit(e.clientX, e.clientY));
});
mCv.addEventListener('mouseleave', () => mCv.classList.remove('knob-hover'));
$('again').onclick = drawOne;
$('dl').onclick = () => {
  if (!current) return;
  const a = document.createElement('a');
  a.download = `nishina-${current.song.id.replace('nishina-', '')}-${current.line.i}-${current.seed.toString(16)}.png`;
  a.href = cardCv.toDataURL('image/png');
  a.click();
};

/* ---------- 啟動 ---------- */
const FONTS = [
  ['JP12', 'fonts/fusion-pixel-12px-proportional-ja.sub.ttf'],
  ['JP10', 'fonts/fusion-pixel-10px-proportional-ja.sub.ttf'],
  ['JP8', 'fonts/fusion-pixel-8px-proportional-ja.sub.ttf'],
  ['TC12', 'fonts/fusion-pixel-12px-proportional-zh_hant.sub.ttf'],
  ['TC10', 'fonts/fusion-pixel-10px-proportional-zh_hant.sub.ttf'],
  ['TC8', 'fonts/fusion-pixel-8px-proportional-zh_hant.sub.ttf'],
];
(async () => {
  requestAnimationFrame(loop);  // 機器持續動 (呼吸感)
  try {
    await Promise.all(FONTS.map(async ([n, u]) => {
      const f = new FontFace(n, `url(${u})`); await f.load(); document.fonts.add(f);
    }));
    POOL = await fetch('pool.json').then(r => r.json());
    $('poolN').textContent = POOL.meta.cards;
    // 自動注入 LIVE 池 (載入失敗就沿用手工的 CURATED.LIVE)
    try {
      const auto = await fetch('live_pool.json').then(r => r.ok ? r.json() : []);
      if (Array.isArray(auto) && auto.length) {
        const seen = new Set(CURATED.LIVE);
        for (const id of auto) if (!seen.has(id)) { CURATED.LIVE.push(id); seen.add(id); }
      }
    } catch (e) { /* live_pool 不存在也可以, LIVE 池會退化為空 → 自動降級到 SR/R/N */ }
    ready = true;
    $('hint').textContent = '轉動金色旋鈕抽一張';
  } catch (e) {
    $('hint').textContent = '載入失敗:請以 python -m http.server 啟動後開啟本頁';
    console.error(e);
  }
})();
</script>
</body>
</html>
